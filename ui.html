<!-- gate ui — the world bench, v2: the playground's shell, faithfully.
     CodeMirror editor with declared-name highlighting; the Code · Table
     surface switch (Table projects the world as sortable relations, click a
     name to jump); Full · Bare (the same editor, ceremony collapsed from
     view — full Swift, fully editable); a draggable file rail (the declared
     layout); the verdict docked at the bottom, Xcode-style; cross-file
     judgement over unsaved text. -->
<meta charset="utf-8"><title>gate · world bench</title>
<!-- zero egress, enforced by the browser as well as by the code: the bench may
     talk to its own loopback server and to nothing else. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; form-action 'none'; base-uri 'none'">
<link rel="stylesheet" href="/codemirror.css">
<script>
// The theme is a declaration, not a toggle — and the declaration lives in the
// world, which is read a third of a second after the first paint. Painting the
// operating system's preference in the meantime is a guess, and a guess that
// disagrees with the declaration is watched being corrected. So this machine
// remembers what the world last DECLARED here and paints that at once; with no
// memory yet the operating system still stands, so a dark machine never flashes
// white. The memory is never a second truth about the world: it holds only a
// declaration the world itself made, the world overwrites it on every read, and
// it is dropped the moment the world stops declaring one.
(function () {
    var remembered = null;
    try { remembered = localStorage.getItem("gate.theme.declared"); } catch (e) {}
    document.documentElement.setAttribute("data-theme", remembered
        || (window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"));
})();
</script>
<style>
/* ── the palette, generated from the judged stdlib/bench-palette.swift: the hex
   is the sRGB fallback, and color(xyz-d65 …) carries the SAME numbers the atom
   states and its contrast certificates hold to. Lower a colour here and the
   file's slack stops settling — the palette cannot drift from what was judged.
   Do not hand-edit; regenerate from the atoms. ── */
:root{color-scheme:light; font-size:13px;
  /* the reading line is the base of every distance: an instrument for reading
     measures its spacing in the letter it sets. --u is one fifth of the line,
     and every gap is a multiple of it — one ladder, no length off it. */
  --textline: 1.45rem; --u: calc(var(--textline) / 10);
  --ink: #1C191A; --ink: color(xyz-d65 calc(10/1000) calc(10/1000) calc(11/1000));
  --paper: #FDFDFD; --paper: color(xyz-d65 calc(931/1000) calc(980/1000) calc(1067/1000));
  --mist: #F3F4F3; --mist: color(xyz-d65 calc(855/1000) calc(900/1000) calc(980/1000));
  --line: #D7D7D7; --line: color(xyz-d65 calc(646/1000) calc(680/1000) calc(740/1000));
  --muted: #868686; --muted: color(xyz-d65 calc(228/1000) calc(240/1000) calc(261/1000));
  --ok: #007D36; --ok: color(xyz-d65 calc(80/1000) calc(150/1000) calc(60/1000));
  --bad: #BF4035; --bad: color(xyz-d65 calc(240/1000) calc(150/1000) calc(50/1000));
  --action: #2269CF; --action: color(xyz-d65 calc(170/1000) calc(150/1000) calc(610/1000));
  --law: #AB5406; --law: color(xyz-d65 calc(200/1000) calc(150/1000) calc(20/1000));
  --localtype: #1B7781; --localtype: color(xyz-d65 calc(110/1000) calc(150/1000) calc(230/1000));
  --knownname: #8D48D3; --knownname: color(xyz-d65 calc(250/1000) calc(150/1000) calc(630/1000));
  --seam: #939393; --seam: color(xyz-d65 calc(276/1000) calc(290/1000) calc(316/1000));
  --select: #D7D7D7; --select: color(xyz-d65 calc(646/1000) calc(680/1000) calc(740/1000));
  /* a shadow is light taken away, so it is cast toward nothing in either theme.
     Cast in --ink it followed the text instead, and in the dark theme the ink is
     the LIGHT end: every raised thing wore a halo. This one belongs to no theme
     and is overridden by neither. */
  --shade: #000; --shade: color(xyz-d65 0 0 0);
}
:root[data-theme="dark"]{color-scheme:dark;
  --ink: #CECFCF; --ink: color(xyz-d65 calc(590/1000) calc(621/1000) calc(676/1000));
  --paper: #1C191A; --paper: color(xyz-d65 calc(10/1000) calc(10/1000) calc(11/1000));
  --mist: #2F3131; --mist: color(xyz-d65 calc(28/1000) calc(30/1000) calc(33/1000));
  --line: #403F3F; --line: color(xyz-d65 calc(48/1000) calc(50/1000) calc(54/1000));
  --muted: #878788; --muted: color(xyz-d65 calc(232/1000) calc(244/1000) calc(266/1000));
  --ok: #24C75B; --ok: color(xyz-d65 calc(230/1000) calc(419/1000) calc(168/1000));
  --bad: #D4A19F; --bad: color(xyz-d65 calc(461/1000) calc(419/1000) calc(384/1000));
  --action: #9DADD7; --action: color(xyz-d65 calc(412/1000) calc(419/1000) calc(705/1000));
  --law: #D6A28E; --law: color(xyz-d65 calc(454/1000) calc(419/1000) calc(314/1000));
  --localtype: #2BBECF; --localtype: color(xyz-d65 calc(307/1000) calc(419/1000) calc(656/1000));
  --knownname: #B9A5D6; --knownname: color(xyz-d65 calc(454/1000) calc(419/1000) calc(691/1000));
  --seam: #6B6B6B; --seam: color(xyz-d65 calc(140/1000) calc(147/1000) calc(160/1000));
  --select: #383839; --select: color(xyz-d65 calc(38/1000) calc(40/1000) calc(44/1000));
}
*{box-sizing:border-box}
/* ── REGISTERS: material is a function of the wire (MiC at the pixel). A register
   is declared ONCE here; an element only names it, and no rule restates what the
   wire already said. Font tells WHAT a thing is (mono = judged data; system =
   speech); ink tells WHETHER it is judged (ink = judged/primary; muted =
   observed/secondary). Two accents own their colour alone: the verdict (ok/bad)
   and the hand (action). Full is exempt — raw source, all mono, no projection. ── */
.fact{font:12.5px/1.45 ui-monospace,Menlo,monospace;color:var(--ink)}
.observed{font:12.5px/1.45 ui-monospace,Menlo,monospace;color:var(--muted)}
.speech{font:13px/1.45 -apple-system,sans-serif;color:var(--ink)}
.caption{font:11px/1.4 -apple-system,sans-serif;color:var(--muted)}
.verdict{font-weight:600}.verdict.ok{color:var(--ok)}.verdict.bad{color:var(--bad)}
.gesture{color:var(--action);cursor:pointer}
body{font:13px/1.45 -apple-system,sans-serif;margin:0;color:var(--ink);background:var(--paper);display:flex;height:100vh;overflow:hidden}
#rail{flex:0 0 250px;display:none;flex-direction:column;overflow:auto;min-width:0}
#rail h3{font-weight:600;letter-spacing:.08em;text-transform:uppercase;margin:0;padding:calc(var(--u)*6) calc(var(--u)*7) calc(var(--u)*4)}
.file{display:flex;align-items:center;gap:calc(var(--u)*3);padding:calc(var(--u)*2) calc(var(--u)*7);cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.file:hover{background:var(--mist)}
.file.on{background:var(--mist);font-weight:600}
.file .dot{flex:0 0 6px;width:6px;height:6px;border-radius:50%;background:transparent}
.file.bad{color:var(--bad)}.file.bad .dot{background:var(--bad)}
.file .mine{margin-left:auto;background:var(--mist);border-radius:8px;padding:0 calc(var(--u)*3);flex:none}
.file.on .mine{background:var(--paper)}
.split{flex:0 0 5px;cursor:col-resize;background:transparent;transition:background .1s}
.split:hover,.split.dragging{background:color-mix(in srgb,var(--action) 45%,transparent)}
.line-flash{background:color-mix(in srgb,var(--action) 22%,transparent)}
#journal-head .obs{display:block;font-weight:500;letter-spacing:.03em;text-transform:none;opacity:.75;margin-top:var(--u)}
/* the row works WITH the space it is given: the subject takes what is there and
   the meta sits beside it, dropping to its own line only when there is no room.
   It used to stack always, so a wide rail left a long empty tail; and the subject
   was cut with nothing to show for it, so a reader could not tell a title from a
   title that had been shortened. */
.commit{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;column-gap:calc(var(--u)*3);row-gap:var(--u);padding:calc(var(--u)*3) calc(var(--u)*7);cursor:default}
.commit:hover{background:var(--mist)}
.commit.touches{cursor:pointer}
.commit .subj{flex:1 1 auto;min-width:0;display:flex;gap:calc(var(--u)*3);align-items:baseline;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.commit .subj{text-overflow:ellipsis}
.commit .meta{flex:0 0 auto;white-space:nowrap;display:flex;align-items:center;gap:calc(var(--u)*3);font-variant-numeric:tabular-nums}
/* A NAME IS NOT AN ACTION. The blue here belonged to the hand — it is what this
   bench paints things you press — and an author's name is a fact about a commit,
   not a button. It reads as one now: ink like every other fact, with the
   underline arriving under the pointer to say it can be pressed. */
.commit .who{cursor:pointer;color:var(--ink);text-decoration:underline dotted var(--line);
  text-underline-offset:3px}
.commit .who:hover{text-decoration:underline solid var(--ink)}
.badge{flex:none;padding:0 calc(var(--u)*3);border-radius:8px}
/* the badge is marked by an EDGE, not by a fill: filled with --mist it vanished
   the moment the row underneath went --mist too, which is every hover */
.badge.closed{border:1px solid var(--line);color:var(--muted)}
.badge.open{border:1px solid var(--line);color:var(--muted)}
#next{margin-left:auto;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:52%}
#filter-note,#load-more{padding:calc(var(--u)*2) calc(var(--u)*7);font:11px -apple-system,sans-serif;color:var(--action);cursor:pointer}
#filter-note:hover,#load-more:hover{text-decoration:underline}
#rail h3.fold{cursor:pointer;display:flex;flex-wrap:wrap;align-items:flex-start;gap:calc(var(--u)*3);user-select:none}
#rail h3.fold:hover{color:var(--ink)}
#rail h3.fold i{flex:none;width:8px;margin-top:var(--u);font-style:normal;transition:transform .12s;line-height:1}
#rail h3.fold i::before{content:"▾"}
#rail h3.fold.shut i{transform:rotate(-90deg)}
#rail h3.fold .obs{flex:1 1 100%;padding-left:calc(var(--u)*7)}
/* the revision is a fact, not a heading: it keeps its own case and its own face */
#judge-rev{font-family:ui-monospace,Menlo,monospace;text-transform:none;letter-spacing:0;opacity:.65;margin-top:var(--u)}
#rail h3.fold.shut .obs{display:none}
/* except the revision: it is the one dependency here, and a shut list is
   exactly when an operator wants it stated rather than hunted for */
#rail h3.fold.shut #judge-rev{display:block}
.foldable.shut{display:none}
#keys-btn{border:none;background:transparent;color:var(--muted);font:13px -apple-system,sans-serif;width:20px;height:20px;border-radius:5px;cursor:pointer;padding:0}
#keys-btn:hover{background:var(--mist);color:var(--ink)}
#keys-panel{position:fixed;top:38px;right:14px;z-index:30;width:min(360px,86vw);background:var(--paper);border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 28px color-mix(in srgb,var(--shade) 18%,transparent);padding:calc(var(--u)*6) calc(var(--u)*7)}
#keys-panel h4{margin:0 0 calc(var(--u)*4);font:600 13px/1 -apple-system,sans-serif}
#keys-panel p{margin:calc(var(--u)*4) 0 0;font:11px/1.5 -apple-system,sans-serif;color:var(--muted)}
.krow{display:flex;gap:calc(var(--u)*4);align-items:baseline;padding:var(--u) 0;font:11px/1.45 -apple-system,sans-serif}
.krow kbd{flex:0 0 5.6em;font:11px ui-monospace,Menlo,monospace;color:var(--ink);background:var(--mist);border-radius:5px;padding:var(--u) calc(var(--u)*2);text-align:center}
.krow span{color:var(--muted)}
#completion{position:absolute;z-index:32;background:var(--paper);border:1px solid var(--line);border-radius:8px;box-shadow:0 6px 22px color-mix(in srgb,var(--shade) 16%,transparent);padding:calc(var(--u)*2);min-width:11em;max-height:15em;overflow:auto}
.crow{padding:var(--u) calc(var(--u)*4);border-radius:5px;cursor:pointer;white-space:nowrap}
.crow.on{background:color-mix(in srgb,var(--action) 14%,transparent);color:var(--action)}
.crow:hover{background:var(--mist)}
.cnote{padding:calc(var(--u)*2) calc(var(--u)*4) var(--u);border-top:0.5px solid var(--line);margin-top:calc(var(--u)*2)}
#inspect{flex:none;padding:calc(var(--u)*3) calc(var(--u)*8) calc(var(--u)*2);border-bottom:0.5px solid var(--line);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#inspect:empty::before{content:"the cursor on a name says what it is";opacity:.5}
#say{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);z-index:31;background:var(--ink);color:var(--paper);font:13px -apple-system,sans-serif;padding:calc(var(--u)*3) calc(var(--u)*7);border-radius:8px;box-shadow:0 6px 20px color-mix(in srgb,var(--shade) 30%,transparent)}
#brand{padding:calc(var(--u)*7) calc(var(--u)*7) calc(var(--u)*3)}
#brand b{display:block;font:600 15px/1.2 -apple-system,sans-serif;letter-spacing:-.01em}
#brand span{display:block;margin-top:calc(var(--u)*2)}
/* an open commit and what it opened are one block, told apart by surface
   alone: a caret says which way it goes, and nothing is drawn around it */
.commit.open{background:var(--mist)}
.commit.open .caret{transform:rotate(90deg)}
.commit .caret{flex:none;width:8px;color:var(--muted);transition:transform .12s;font-style:normal;opacity:.6}
.commit .caret::before{content:"\203A"}
.cdiff{flex:0 0 100%;padding:var(--u) 0 calc(var(--u)*5);background:var(--mist)}
.dwait{padding:calc(var(--u)*2) calc(var(--u)*7);font:11px -apple-system,sans-serif;color:var(--muted)}
.dfile{padding:calc(var(--u)*2) calc(var(--u)*7) var(--u);font:11px ui-monospace,Menlo,monospace;color:var(--muted)}
.dfile .dnote{margin-left:calc(var(--u)*3);font:11px -apple-system,sans-serif}
.dmore{padding:var(--u) calc(var(--u)*7);font:11px -apple-system,sans-serif;color:var(--muted)}
.factrow{display:flex;align-items:baseline;gap:calc(var(--u)*2);flex-wrap:wrap;padding:var(--u) calc(var(--u)*7)}
.dline{padding:var(--u) calc(var(--u)*7);font:11px/1.45 ui-monospace,Menlo,monospace;white-space:pre-wrap;word-break:break-word;color:var(--muted)}
.factrow .sep{color:var(--muted)}
.factrow .own{color:var(--localtype)}
.factrow .was{color:var(--muted);text-decoration:line-through;text-decoration-thickness:1px}
.factrow .arrow{color:var(--muted)}
.factrow .now{color:var(--ink)}
.dline .sg{display:inline-block;width:1.1em;opacity:.6}
.dline.add{color:var(--ink)}
.dline.del{color:var(--muted);text-decoration:line-through;text-decoration-thickness:1px}
#main{flex:1;display:flex;flex-direction:column;min-width:0;border-left:0.5px solid var(--line)}
#bar{display:flex;gap:calc(var(--u)*5);align-items:center;padding:calc(var(--u)*3) calc(var(--u)*6);border-bottom:0.5px solid var(--line);flex:none}
#bar b{font-weight:600}
.seg{display:inline-flex;background:var(--mist);border-radius:8px;padding:var(--u);gap:var(--u)}
.seg button{border:none;border-radius:5px;margin:0;background:transparent;color:var(--muted);font:13px -apple-system,sans-serif;padding:calc(var(--u)*2) calc(var(--u)*6);cursor:pointer}
.seg button:hover{color:var(--ink)}
.seg button.on{background:var(--paper);color:var(--ink);box-shadow:0 1px 2px color-mix(in srgb,var(--shade) 12%,transparent)}
.seg button:disabled{opacity:.3;cursor:default}
.seg button:disabled:hover{color:var(--muted)}
#nav-seg button{padding:calc(var(--u)*2) calc(var(--u)*5);font-size:15px;line-height:1}
#gitstate{font-family:ui-monospace,Menlo,monospace;margin-left:auto;display:flex;align-items:center;gap:calc(var(--u)*3)}
#gitstate .g{width:7px;height:7px;border-radius:50%;background:var(--muted)}
#gitstate.modified{color:var(--law)}#gitstate.modified .g{background:var(--law)}
#gitstate.committed{color:var(--muted)}#gitstate.committed .g{background:var(--muted)}
#write{border:none;background:color-mix(in srgb,var(--action) 12%,transparent);color:var(--action);padding:calc(var(--u)*2) calc(var(--u)*6);border-radius:5px;font:inherit;cursor:pointer}
#write:disabled{opacity:.4;cursor:default}
#surface{flex:1;position:relative;min-height:0}
#editor-host{position:absolute;inset:0}
.CodeMirror{height:100%;font:12.5px/19px ui-monospace,Menlo,monospace;background:var(--paper);color:var(--ink)}
/* the code stands off from its index by a named step, not by the four pixels the
   vendored sheet happens to give: the gutter is scaffolding and the text needs
   air from it. Written at the vendor's own weight, or the vendor wins. */
.CodeMirror pre.CodeMirror-line,.CodeMirror pre.CodeMirror-line-like{padding:0 calc(var(--u)*4)}
.CodeMirror-linenumber{color:var(--seam)}
.CodeMirror-cursor{border-left-color:var(--ink)}
.CodeMirror-gutters{background:var(--paper);border-right-color:var(--line)}
.CodeMirror-selected,.CodeMirror-focused .CodeMirror-selected{background:var(--select)}
.CodeMirror-line::selection,.CodeMirror-line>span::selection,.CodeMirror-line>span>span::selection{background:var(--select)}
/* the editor's tokens speak the same table. Ceremony — public, enum, typealias,
   extension, where, an @attribute, .self — carries no meaning of the world: it is
   the SEAM, the colour of the brackets, at the weight of ordinary text. Full stops
   shouting with form; the facts stand out, and the two views converge. A literal is
   a value, never red: red is the verdict's alone. */
.cm-s-default .cm-keyword,.cm-s-default .cm-attribute{color:var(--seam)}
.cm-s-default .cm-string{color:var(--knownname)}
.cm-s-default .cm-comment{color:var(--muted)}
.cm-localtype{color:var(--localtype)}.cm-knownname{color:var(--knownname)}
/* weight says SUBJECT: a declaration line holds two names, the one it declares
   and the one it answers to, and the eye must land on the first. An axis name
   is neither a fact nor a stranger — it is the label of a slot — so it is set
   in plain ink, the way the bare view has always set it. */
.cm-declname{font-weight:600}
.cm-axisname{color:var(--ink)}
.CodeMirror.holding .cm-jumpable{text-decoration:underline;text-underline-offset:2px;cursor:pointer}
.cm-badname{text-decoration:underline wavy var(--bad);text-underline-offset:3px}.cm-ghost{color:var(--seam)}
.line-flag-bad{background:color-mix(in srgb,var(--bad) 6%,transparent)}
.gutter-flag-bad .CodeMirror-linenumber{color:var(--bad);font-weight:700}
.flag-note{font:11px/1.5 -apple-system,sans-serif;color:var(--bad);background:color-mix(in srgb,var(--bad) 8%,transparent);padding:var(--u) calc(var(--u)*5) var(--u) calc(var(--u)*14)}
#bare{position:absolute;inset:0;overflow:auto;background:var(--paper);margin:0;padding:calc(var(--u)*6) calc(var(--u)*8) calc(var(--u)*40);display:none;font:12.5px/19px ui-monospace,Menlo,monospace;color:var(--ink);white-space:pre}
#bare .conf{color:var(--muted)}
#bare .decl{color:var(--localtype);font-weight:600;cursor:pointer}
#bare .jump{color:var(--localtype);cursor:pointer}
#bare .decl:hover,#bare .jump:hover{text-decoration:underline}
#bare .known{color:var(--knownname)}
/* THE SEAMS THIS WORLD IS PARTY TO. Same registers as everywhere: an address is
   a fact and set in mono, what it means is speech and set in the system face,
   the category of the line is a caption. Nothing here is a verdict — a seam is a
   standing account of who owes whom a word, and the court over it is `gate
   seam`. */
/* THE SEAMS THIS FOLDER IS PARTY TO, in the rail's own grammar: one row per
   item, the address a fact, the kind a badge, and WHY IT IS THERE in the title —
   the same way the journal wears its state, and the same way this bench has
   always answered `what is this` on demand rather than printing it nine times
   down a narrow column. Nothing new is measured here: the rows are commits'
   rows, so the ladder is the one already judged. */
#seam-host,#shelf-host{padding-bottom:calc(var(--u)*3)}
.seam-pair{padding:calc(var(--u)*2) calc(var(--u)*7) 0}
.badge.back{color:var(--law)}
.seam-where{color:var(--seam)}
/* the pins hang under the pair they belong to, in the pair's own column */
.seam-took{padding:0 calc(var(--u)*7);color:var(--seam)}
.stale{color:var(--law)}
/* ── PROSE IS READ AS PROSE. A comment is somebody talking, and Bare had been
   setting each source LINE as its own block inside a `pre` — so one paragraph
   came out a column of fragments with a blank line between every one of them,
   and the hard wrap of the file leaked into the reading. A run of comment lines
   is one paragraph now: speech register, wrapped to the pane, and the air goes
   between paragraphs where it belongs rather than inside one. ── */
#bare .note{display:block;white-space:normal;max-width:62ch;
  font:13px/1.5 -apple-system,sans-serif;color:var(--muted)}
/* ── AND EVERY GAP HERE IS A NAMED STEP, which it had not been. Records were
   held apart by a blank line of text — the font's line-height, some eight and a
   fifth units, a number nobody declared and nobody could defend. The law of
   proximity says what these gaps are: a record with its axes is a GROUP, so
   groups stand `Apart`; a note and the record it speaks for are PARTS OF ONE
   THING, so they sit `Near`, closer than rows stand from each other. Read the
   ladder and the spacing states the kinship instead of guessing at it. ── */
#bare .rec{display:block;margin-bottom:calc(var(--u)*6)}      /* Apart: between groups */
#bare .note.said{margin:0 0 calc(var(--u)*3)}                 /* Near: parts of one thing */
#bare .note.free{margin:0}
#bare .note code{font:12px/1.4 ui-monospace,Menlo,monospace;color:var(--ink)}
#bare .note .known{font:12px/1.4 ui-monospace,Menlo,monospace}
#bare .slot{cursor:pointer;border-bottom:1px dashed var(--line)}
#bare .slot.elsewhere{cursor:default;border-bottom-style:none}
/* a hole already says it three ways — the word, the dashes, the quiet register —
   so the amber it wore was a third hue answering a question the scene does not
   ask (С9: unearned; Р3: taxed). What is owed is not a warning, it is a row. */
#bare .slot.hole{border-bottom-style:dashed;border-color:var(--muted)}
/* a gesture inside the code fabric is known by its form, its place and the
   cursor — never by chroma. The hand reads all three before colour, and the
   scene has only two questions to spend a hue on: where a name is from, and
   what the verdict is. Blue stays outside the fabric, where it answers to the
   page rather than to the world's own text (Р2, Р3). */
/* THE HAND'S TARGET IS A STEP OF THE LADDER (Р1). Reaching a target costs time
   that grows with distance and falls with its size, so a target has a floor —
   and the floor is not borrowed from a phone: it is ONE READING LINE, the base
   every distance here is measured in. What you can read, you can hit. Vertical

// and a page talking to a server that has never heard of half its answers fails
// quietly — the one failure this bench must never have.
const BENCH_FOR = "0.1.0";

// asked for the save, so a word about the save can go and be forgotten — but a

// where it can be read twice. This one is true until somebody restarts the
// bench, so it stands in the line that reports the bench's own condition.
let benchStale = "";
fetch("/version", { cache: "no-store" }).then(r => r.json()).then(v => {
    // the one dependency that cannot be edited, only re-pinned — so it is named
    // where the words it carries are listed, and said plainly when unrecorded
    const rev = document.getElementById("judge-rev");
    if (rev) rev.textContent = v.judge_from ? v.judge_from.slice(0, 7) : "revision unrecorded";
    if (v.gate !== BENCH_FOR) {

            + v.gate + " — restart `gate serve`";

const keywordSet = new Set(["public","enum","protocol","typealias","extension","where",
    "static","var","some","associatedtype","import","struct","let","func"]);

// declares protocols, which the plain court refuses on sight — so it is opened
// and written here like any file of theirs, and judged by the guards that are
// its actual court. A dependency belongs to whoever depends: writing it is
// theirs to do, and the command that writes a row is a scribe, not the door.
let layoutFile = null;
let jumpable = new Set();      // names with a home: underlined, and clickable
let vocabulary = {};           // name -> the shelf module that declares it

CodeMirror.defineMode("gate-swift", () => ({
    token: (stream) => {
        if (stream.match("//")) { stream.skipToEnd(); return "comment"; }
        if (stream.match('"')) { while (!stream.eol()) { if (stream.next() === '"') break; } return "string"; }
        if (stream.match(/^@[A-Za-z]+/)) return "attribute";
        if (stream.match(/^[A-Za-z_][A-Za-z0-9_]*/)) {
            const word = stream.current();
            if (word === "self" || keywordSet.has(word)) return "keyword";
            if (/^[A-Z]/.test(word)) {
                if (unresolved.has(word)) return "badname";   // nothing survives: |S| = 0
                const before = stream.string.slice(0, stream.start);
                // an axis name is the label of a slot: plain ink, as in Bare
                if (/\b(?:typealias|associatedtype)\s+$/.test(before)) return "axisname";
                const home = jumpable.has(word) ? " jumpable" : "";
                // the weight goes to what the line DECLARES, not to what it
                // inherits. Weighting kinds instead put the accent on the
                // inheritance — `MyBench: Bench` shouted Bench — and the eye
                // went to the answer rather than the question. Hue still says
                // where a name is from; the two views agree now.
                const subject = /\b(?:enum|protocol|struct|extension)\s+$/.test(before) ? " declname" : "";
                if (stream.string[stream.start - 1] === ".") return "knownname" + home + subject;
                if (localNames.has(word)) return "localtype" + home + subject;
                return "knownname" + home + subject;
            }

        }
        if (stream.match(/^[<>,.]/)) return "ghost";
        stream.next(); return null;
    },
}));

// ── the keys people already know. Every one is bound twice, so the same
// hand works on a Mac keyboard and on a PC one; the panel behind ? shows
// whichever prefix this machine uses. ──
const MAC = /Mac|iPhone|iPad/.test(navigator.platform || navigator.userAgent);
const MOD = MAC ? "\u2318" : "Ctrl";

function toggleComment(cm) {
    // Xcode's ⌘/ over the selected lines: comment them, or take it back
    const from = cm.getCursor("from").line, to = cm.getCursor("to").line;
    let lines = [];
    for (let i = from; i <= to; i++) lines.push(cm.getLine(i));
    const meaty = lines.filter(l => l.trim());
    const commented = meaty.length && meaty.every(l => l.trim().startsWith("//"));
    for (let i = from; i <= to; i++) {
        const line = cm.getLine(i);
        if (!line.trim()) continue;
        const next = commented
            ? line.replace(/^(\s*)\/\/ ?/, "$1")
            : line.replace(/^(\s*)/, "$1// ");
        cm.replaceRange(next, { line: i, ch: 0 }, { line: i, ch: line.length }, "+input");
    }
}

function noSave(cm) {
    // ⌘S is muscle memory, and here it has nothing to do: say so, and above
    // all keep the browser from offering to save the page
    say("There is nothing to save: the file is written whenever the judge holds.");
}

const cm = CodeMirror(document.getElementById("editor-host"), {
    value: "", mode: "gate-swift", lineNumbers: true, indentUnit: 4,
    viewportMargin: Infinity, dragDrop: false,

        "Tab": (cm) => {

            return cm.somethingSelected() ? cm.indentSelection("add")

        },
        "Shift-Tab": (cm) => cm.indentSelection("subtract"),
        "Cmd-Enter": () => {}, "Ctrl-Enter": () => {},
        "Cmd-Ctrl-Left": () => navGo(navBack, navForward),
        "Cmd-Ctrl-Right": () => navGo(navForward, navBack),
        "Alt-Left": () => MAC ? CodeMirror.Pass : navGo(navBack, navForward),
        "Alt-Right": () => MAC ? CodeMirror.Pass : navGo(navForward, navBack),

        "Up": (cm) => { if (compEl.hidden) return CodeMirror.Pass;

// ⌘-click (Ctrl on a PC) opens the line that declares a name: the binding
// every editor uses for this. Alt is left alone — CodeMirror wants it for
// rectangular selection, which is why it turned the pointer into a crosshair.
// While the key is down, names underline and the pointer says they can be
// clicked, so the affordance is visible before the click.
const jumpKey = (e) => (MAC ? e.metaKey : e.ctrlKey);
cm.getWrapperElement().addEventListener("mousedown", (e) => {
    if (!jumpKey(e)) return;
    const tok = cm.getTokenAt(cm.coordsChar({ left: e.clientX, top: e.clientY }), true);
    const name = (tok.string || "").trim();

});
{

let files = [], active = "", personalFile = null, personalEmpty = false, viewingShelf = null;

// ── the file rail: the declared layout, the same list the judge runs over ──
function buildRail() {
    const list = document.getElementById("filelist");
    list.innerHTML = "";
    for (const f of files) {
        const row = document.createElement("div");
        row.className = "file fact" + (f === active ? " on" : "") + (badFiles.has(f) ? " bad" : "");
        // your personal world stands apart: it is in your own git, and the

        row.innerHTML = '<span class="dot"></span>' + f + (f === personalFile
            // every file under this heading is mine, so the badge must say the

            ? '<span class="mine caption" title="Your personal world. It lives in your own git at ~/.gate/me and is never in the shared repository.">not shared</span>' : "");
        row.onclick = () => {

}

// ── the journal VIEW: git's own history, projected. A pure function of the
// clone — no server state, no hosting; whoever can read the repo sees it.
// Observed, never judged (open/closed is reachability, not a verdict). ──

async function buildJournal() {

        const j = await (await fetch("/log?n=" + journalLimit + "&scope=" + journalScope)).json();
        journalCommits = j.commits || []; journalWorld = j.world_files || []; journalMe = j.me || "";
    } catch { journalCommits = []; }

    buildSeams();
    buildShelf();
}

// ── THE WORDS THE JUDGE CARRIES, and the reason they are not on either of the
// two lists above. The rail says MINE and THEIRS because that is the whole of
// the difference between files: one kind I write and the verdict follows me,
// one kind I only read. `Department`, `Ranked`, `Site` are neither. They are
// not files here at all — a world speaks them with no such file anywhere near
// it, and a copy declared as a world file is refused. They are compiled inside
// the judge, and what these pages show is a printout.
//
// The earlier split — forms files over here, gate's own furniture over there — drew
// a line nobody using this needs and hid the one they do: none of it is yours,
// and none of it can be changed by editing a copy. So one list, under the name
// of the thing it belongs to, with the revision it was compiled from beside it.
// That revision IS the dependency, and it is the only part of this a world can
// be pinned to.
// AND ONLY WHAT YOU CAN SPEAK. The shelf also carries this tool's own
// furniture — how the page looks, how it spaces itself, the lengths its battery
// holds it to — and an operator has no use for any of it: it never enters their
// repository and answers no question they have. Those are gate's own world, and
// where they belong is gate's own rail, under `mine`, the day this tool declares
// its world the way it asks everybody else to. Until then they stay off a page
// that is supposed to be an account of YOUR repository.
//
// The cut is the role, which each file states in its own second line — not the
// shape of its name. `git-atoms` is here and is not a forms file: it is what your
// merge policy is written in.
async function buildShelf() {
    const host = document.getElementById("shelf-host");
    let mods = [];
    try {
        const shelf = await (await fetch("/shelf")).json();
        mods = (shelf.modules || []).filter(m => (shelf.roles || {})[m] === "forms");
    } catch { mods = []; }

    document.getElementById("shelf-head").hidden = !mods.length;
    for (const m of mods) {
        const r = document.createElement("div");
        r.className = "commit touches";

            + "made of: your world speaks these with no such file present, and editing a copy "
            + "adds no word to the language.";
        r.innerHTML = '<div class="subj fact">' + esc(m) + "</div>";
        r.onclick = () => openShelf(m);

}


// ── the theme is a declaration too. The default follows the operating system;
// MyBench in your personal world overrides it, and the page repaints when either
// changes. No toggle: a button that duplicates a declaration is forbidden. ──
const darkMedia = window.matchMedia("(prefers-color-scheme: dark)");
let declaredTheme = null;               // a theme the forms file names, read from MyBench.Theme
function effectiveTheme() { return declaredTheme || (darkMedia.matches ? "dark" : "light"); }
function paintTheme() {
    document.documentElement.setAttribute("data-theme", effectiveTheme());
    // and this machine remembers the DECLARATION alone, so the next first paint
    // is the answer and not a guess. Nothing declared, nothing remembered: an
    // undeclared bench goes back to following the operating system at once.
    try {
        if (declaredTheme) localStorage.setItem("gate.theme.declared", declaredTheme);
        else localStorage.removeItem("gate.theme.declared");
    } catch (e) {}
}
darkMedia.addEventListener("change", paintTheme);   // the OS flips, and an undeclared bench follows
function applyMyBench() {
    const d = (active === personalFile && lastParsed ? lastParsed.declarations : layoutDecls).get("MyBench");
    const a = d && d.aliases.get("Theme");
    // only a value the bench's own forms names sets the theme; a stranger is the
    // guard's to report, and until then the OS default stands
    declaredTheme = a && (conformers["BenchTheme"] || []).includes(a.target) ? a.target.toLowerCase() : null;
    paintTheme();
}

// ── the bench is judged by its own rules. A value on a bench declaration
// (MyBench, MyJournal) that the forms file does not name is not silently ignored the
// way a mistyped Scope once fell to a default — it is a guard line, addressed at
// its own line. Guarded, not judged (the theme is not a fact of the world), and
// read from the one source the completion reads: protoAxes and conformers of
// the bench's own forms, so a stranger cannot be mistaken for a value. ──
function benchGuards() {
    const onMine = active === personalFile && lastParsed;
    const decls = onMine ? lastParsed.declarations : layoutDecls;
    const out = [];
    for (const [name, d] of decls) {
        for (const conf of d.conformances) {
            if (vocabulary[conf] !== "bench-atoms") continue;   // only the bench's own forms, never the world's
            for (const [axis, kind] of Object.entries(protoAxes[conf] || {})) {
                const a = d.aliases.get(axis);
                if (a && a.target && !(conformers[kind] || []).includes(a.target))
                    out.push({ file: onMine ? personalFile : (declFile.get(name) || personalFile),
                               line: a.line, decl: name, axis, value: a.target,
                               allowed: (conformers[kind] || []).join(", ") });

// ── the dashboard is a declaration: MyJournal in your personal world says what
// the journal shows. Edit it in the bench and the journal follows — one truth,
// judged like everything else (a name that does not exist is refused by line).
function applyMyJournal() {
    // while you are editing the personal file, the live parse is the truth;
    // otherwise the layout's copy, read when the file was loaded
    const d = (active === personalFile && lastParsed ? lastParsed.declarations : layoutDecls).get("MyJournal");
    const scope = d && d.aliases.get("Scope") && d.aliases.get("Scope").target === "AllRepo" ? "all" : "world";
    const author = d && d.aliases.get("Author") && d.aliases.get("Author").target === "Me" ? "me" : null;
    const key = scope + "/" + author;
    if (key === myJournalKey) return;
    myJournalKey = key;
    journalScope = scope;
    authorFilter = author === "me" ? (journalMe || null) : null;
    buildJournal();

function renderJournal() {

    document.querySelector("#journal-head .obs").textContent =

// A world has four places, and each one allows a different thing. Everything
// the bench offers comes from this one reading; nothing is a special case
// added because somebody noticed it missing.
//
//   top level          a declaration may begin, and after `:` its protocols
//   inside one         the axes it owes, and the values each of them takes
//   inside a body      the gates that may be claimed, and their arguments
//   after a dot        the axes of whatever stands to the left
function placeAt(cur) {
    let host = null, inBody = false, depth = 0;

    for (const [name, d] of layoutDecls)
        if ((d.conformances || []).includes(kind)) out.push(name);
    for (const [axis, axisKind] of Object.entries(axesOfHost(host))) {
        if (axis === slotName) continue;         // a slot cannot be filled by itself
        for (const [inner, innerKind] of Object.entries(protoAxes[axisKind] || {}))

    const line = cm.getLine(cur.line) || "";
    const before = line.slice(0, cur.ch);
    const { host, inBody } = placeAt(cur);

    // an axis slot: `typealias Sex = `
    const slot = /typealias\s+(\w+)\s*=\s*[\w.]*$/.exec(before);
    const wanted = slot ? (axesOfHost(host)[slot[1]] || axisOf[slot[1]] || null) : null;

    const dotted = afterDot(before, host, wanted);
    if (dotted) return { items: dotted.items, back: dotted.back,
                         kind: wanted ? "this axis takes " + wanted : "what stands here", closed: true };

    if (slot) {
        // a slot is a closed question: only what its kind allows, and if the
        // forms state no kind for it, nothing — never a name of another kind
        const f = wanted ? fillersFor(wanted, host, slot[1]) : null;
        return { items: f || [], kind: wanted ? "this axis takes " + wanted : "an axis", closed: true };
    }

    // the head of a declaration: `public enum Emp9007: `
    const head = /^\s*(?:public\s+)?enum\s+\w+\s*:\s*([\w,\s]*)$/.exec(before);
    if (head) {
        const already = new Set(head[1].split(",").map(x => x.trim()).filter(Boolean));
        const protos = Object.keys(protoAxes).filter(p => !already.has(p));
        return protos.length ? { items: protos, kind: "what this record is", closed: true } : null;
    }

    // inside a body: the gates that may be claimed here
    if (inBody && /^\s*\w*$/.test(before)) {
        const forms = Object.keys(gates);
        return forms.length ? { items: forms, kind: "a claim this body may hold", closed: true } : null;
    }
    // an argument of a gate: `VerifiedView<\n  Emp9001,\n  ` — the kind is stated
    if (inBody) {
        for (let i = cur.line; i >= 0 && i > cur.line - 6; i--) {

                const nth = cur.line - i - 1;
