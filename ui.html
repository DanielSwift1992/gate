<script>
const keywordSet = new Set(["public","enum","protocol","typealias","extension","where",
    "static","var","some","associatedtype","import","struct","let","func"]);
let localNames = new Set(), unresolved = new Set();
let jumpable = new Set();      // names with a home: underlined, and clickable
let vocabulary = {};           // name -> the shelf module that declares it
let conformers = {}, axisOf = {};   // what conforms to what, and what an axis takes

CodeMirror.defineMode("gate-swift", () => ({
    token: (stream) => {
        if (stream.match("//")) { stream.skipToEnd(); return "comment"; }
        if (stream.match('"')) { while (!stream.eol()) { if (stream.next() === '"') break; } return "string"; }
        if (stream.match(/^@[A-Za-z]+/)) return "attribute";
        if (stream.match(/^[A-Za-z_][A-Za-z0-9_]*/)) {
            const word = stream.current();
            if (word === "self" || keywordSet.has(word)) return "keyword";
            if (/^[A-Z]/.test(word)) {
                if (unresolved.has(word)) return "badname";
                const home = jumpable.has(word) ? " jumpable" : "";
                if (stream.string[stream.start - 1] === ".") return "knownname" + home;
                if (localNames.has(word)) return "localtype" + home;
                return "knownname" + home;
            }
            return null;
        }
        if (stream.match(/^[<>,.]/)) return "ghost";
        stream.next(); return null;
    },
}));

// ── the keys people already know. Every one is bound twice, so the same
// hand works on a Mac keyboard and on a PC one; the panel behind ? shows
// whichever prefix this machine uses. ──
const MAC = /Mac|iPhone|iPad/.test(navigator.platform || navigator.userAgent);
const MOD = MAC ? "\u2318" : "Ctrl";

function toggleComment(cm) {
    // Xcode's ⌘/ over the selected lines: comment them, or take it back
    const from = cm.getCursor("from").line, to = cm.getCursor("to").line;
    let lines = [];
    for (let i = from; i <= to; i++) lines.push(cm.getLine(i));
    const meaty = lines.filter(l => l.trim());
    const commented = meaty.length && meaty.every(l => l.trim().startsWith("//"));
    for (let i = from; i <= to; i++) {
        const line = cm.getLine(i);
        if (!line.trim()) continue;
        const next = commented
            ? line.replace(/^(\s*)\/\/ ?/, "$1")
            : line.replace(/^(\s*)/, "$1// ");
        cm.replaceRange(next, { line: i, ch: 0 }, { line: i, ch: line.length }, "+input");
    }
}

function noSave(cm) {
    // ⌘S is muscle memory, and here it has nothing to do: say so, and above
    // all keep the browser from offering to save the page
    say("There is nothing to save: the file is written whenever the judge holds.");
}

const cm = CodeMirror(document.getElementById("editor-host"), {
    value: "", mode: "gate-swift", lineNumbers: true, indentUnit: 4,
    viewportMargin: Infinity, dragDrop: false,
    extraKeys: {
        "Cmd-/": toggleComment, "Ctrl-/": toggleComment,
        "Cmd-S": noSave, "Ctrl-S": noSave,
        "Tab": (cm) => {
            if (!compEl.hidden) return acceptCompletion();     // the offer, first
            return cm.somethingSelected() ? cm.indentSelection("add")
                                          : cm.replaceSelection("    ", "end", "+input");
        },
        "Shift-Tab": (cm) => cm.indentSelection("subtract"),
        "Cmd-Enter": () => {}, "Ctrl-Enter": () => {},
        "Down": (cm) => { if (compEl.hidden) return CodeMirror.Pass;
                          compChosen = (compChosen + 1) % compItems.length; drawCompletion(); },
        "Up": (cm) => { if (compEl.hidden) return CodeMirror.Pass;
                        compChosen = (compChosen - 1 + compItems.length) % compItems.length; drawCompletion(); },
        "Enter": (cm) => { if (compEl.hidden) return CodeMirror.Pass; acceptCompletion(); },
        "Esc": (cm) => { if (compEl.hidden) return CodeMirror.Pass; hideCompletion(); },
    },
});
const editor = { get value() { return cm.getValue(); }, set value(n) { cm.setValue(n); } };

// ⌘-click (Ctrl on a PC) opens the line that declares a name: the binding
// every editor uses for this. Alt is left alone — CodeMirror wants it for
// rectangular selection, which is why it turned the pointer into a crosshair.
// While the key is down, names underline and the pointer says they can be
// clicked, so the affordance is visible before the click.
const jumpKey = (e) => (MAC ? e.metaKey : e.ctrlKey);
cm.getWrapperElement().addEventListener("mousedown", (e) => {
    if (!jumpKey(e)) return;
    const tok = cm.getTokenAt(cm.coordsChar({ left: e.clientX, top: e.clientY }), true);
    const name = (tok.string || "").trim();
    if (!/^[A-Z]\w*$/.test(name)) return;
    e.preventDefault();
    jumpTo(name);
});
{
    const wrap = cm.getWrapperElement();
    const hold = (e) => wrap.classList.toggle("holding", jumpKey(e));
    document.addEventListener("keydown", hold);
    document.addEventListener("keyup", hold);
    window.addEventListener("blur", () => wrap.classList.remove("holding"));
}
let files = [], active = "", personalFile = null, personalEmpty = false;
let badFiles = new Set(), siblingNames = new Set(), layoutDecls = new Map(), declFile = new Map();
let lastParsed = null, lastRefusals = [], widgets = [], tableSort = null;

// ── the file rail: the declared layout, the same list the judge runs over ──
function buildRail() {
    const list = document.getElementById("filelist");
    list.innerHTML = "";
    for (const f of files) {
        const row = document.createElement("div");
        row.className = "file" + (f === active ? " on" : "") + (badFiles.has(f) ? " bad" : "");
        // your personal world stands apart: it is in your own git, and the
        // shared repository does not have it
        row.innerHTML = '<span class="dot"></span>' + f + (f === personalFile
            ? '<span class="mine" title="Your personal world. It lives in your own git at ~/.gate/me and is never in the shared repository.">mine</span>' : "");
        row.onclick = () => loadFile(f);
        list.appendChild(row);
    }
}

// ── the journal VIEW: git's own history, projected. A pure function of the
// clone — no server state, no hosting; whoever can read the repo sees it.
// Observed, never judged (open/closed is reachability, not a verdict). ──
let journalCommits = [], authorFilter = null, journalLimit = 60, journalScope = "world";
let journalMe = "", myJournalKey = "";
async function buildJournal() {
    try {
        const j = await (await fetch("/log?n=" + journalLimit + "&scope=" + journalScope)).json();
        journalCommits = j.commits || []; journalWorld = j.world_files || []; journalMe = j.me || "";
    } catch { journalCommits = []; }
    renderJournal();
}

// ── the dashboard is a declaration: MyJournal in your personal world says what
// the journal shows. Edit it in the bench and the journal follows — one truth,
// judged like everything else (a name that does not exist is refused by line).
function applyMyJournal() {
    // while you are editing the personal file, the live parse is the truth;
    // otherwise the layout's copy, read when the file was loaded
    const d = (active === personalFile && lastParsed ? lastParsed.declarations : layoutDecls).get("MyJournal");
    const scope = d && d.aliases.get("Scope") && d.aliases.get("Scope").target === "AllRepo" ? "all" : "world";
    const author = d && d.aliases.get("Author") && d.aliases.get("Author").target === "Me" ? "me" : null;
    const key = scope + "/" + author;

// what a commit did, read as facts: `Rank: Manager → Lead`, not a wall of
// git plumbing. It opens UNDER the commit, in the rail — nothing is covered
// and nothing dims, because a diff is something you glance at.
async function toggleDiff(c, row) {
    // each commit opens and closes on its own: several can stand open at once,
    // and which of them is worth reading together is nobody's business but yours
    const next = row.nextElementSibling;
    if (next && next.classList.contains("cdiff")) {
        next.remove(); row.classList.remove("open"); return;
    }
    row.classList.add("open");
    const box = document.createElement("div");
    box.className = "cdiff";
    box.innerHTML = '<div class="dwait">reading…</div>';
    row.after(box);
    const f = c.files.find(x => (journalWorld || []).includes(x)) || "";
    const d = await (await fetch("/show?hash=" + c.hash + "&f=" + encodeURIComponent(f))).json();
    let body = "";
    for (const file of d.files) {
        if (!file.changes.length) continue;
        const signs = new Set(file.changes.map(x => x.kind === "fact" ? "~" : x.sign));
        const whole = file.changes.length > 24 && signs.size === 1 && !signs.has("~");
        body += '<div class="dfile">' + esc(file.name)
            + (whole ? '<span class="dnote">' + (signs.has("+") ? "written" : "removed")
                + ", " + file.changes.length + " lines</span>" : "") + "</div>";
        if (whole) continue;
        const shown = file.changes.slice(0, 20);
        for (const ch of shown) {
            body += ch.kind === "fact"
                ? '<div class="fact">' + (ch.owner ? '<span class="own">' + esc(ch.owner) + '</span><span class="sep">·</span>' : "")
                    + '<span class="key">' + esc(ch.key) + '</span><span class="was">' + esc(ch.from)
                    + '</span><span class="arrow">→</span><span class="now">' + esc(ch.to) + "</span></div>"
                : '<div class="dline ' + (ch.sign === "+" ? "add" : "del") + '"><span class="sg">'
                    + ch.sign + "</span>" + esc(ch.text) + "</div>";
        }
        if (file.changes.length > shown.length)
            body += '<div class="dmore">' + (file.changes.length - shown.length) + " more lines</div>";

    box.innerHTML = body || '<div class="dmore">no change in these files</div>';
}

let journalWorld = [];
// ── completion: the names this world allows, offered while you type. The
// pool is not a dictionary of ours — it is what the files themselves declare,
// so what it offers is what the judge will accept. ──
let compItems = [], compChosen = 0, compFrom = null;
const compEl = document.getElementById("completion");

function allowedHere(line, upto) {
    // `public typealias Sex = ` — the axis names what may stand in it, and the
    // genre says which atoms are of that kind. Offering anything else would be
    // offering something the judge is going to refuse.
    const m = /typealias\s+(\w+)\s*=\s*\w*$/.exec(line.slice(0, upto));
    if (!m) return null;
    const kind = axisOf[m[1]];
    if (!kind) return null;
    const world = [];
    for (const [name, d] of layoutDecls)
        if ((d.conformances || []).includes(kind)) world.push(name);
    const all = [...(conformers[kind] || []), ...world];
    return all.length ? all : null;
}

function completionPool() {
    const out = new Set();
    for (const [name, d] of layoutDecls) {
        out.add(name);
        for (const c of d.conformances) out.add(c);
        for (const [k, v] of d.aliases) { out.add(k); if (v && v.target) out.add(v.target); }
        for (const e of (d.entries || [])) { out.add(e.head); (e.args || []).forEach(a => out.add(a)); }
    }
    for (const n of siblingNames) out.add(n);
    if (lastParsed) for (const n of namesOf(lastParsed)) out.add(n);
    return [...out];
}

function hideCompletion() { compEl.hidden = true; compItems = []; compFrom = null; }

function drawCompletion() {
    compEl.innerHTML = compItems.map((n, i) =>
        '<div class="crow' + (i === compChosen ? " on" : "") + '" data-i="' + i + '">' + esc(n) + "</div>").join("")
        + (compEl.dataset.kind ? '<div class="cnote">what this axis takes: ' + esc(compEl.dataset.kind) + "</div>" : "");
    const co = cm.cursorCoords(compFrom, "page");
    compEl.style.left = co.left + "px";
    compEl.style.top = (co.bottom + 2) + "px";
    compEl.hidden = false;
    for (const row of compEl.querySelectorAll(".crow"))
        row.onmousedown = (e) => { e.preventDefault(); acceptCompletion(+row.dataset.i); };
}

function acceptCompletion(i) {
    const name = compItems[i === undefined ? compChosen : i];
    if (!name || !compFrom) return hideCompletion();
    cm.replaceRange(name, compFrom, cm.getCursor(), "+input");
    hideCompletion();
}

function offerCompletion() {
    const cur = cm.getCursor();
    const line = cm.getLine(cur.line) || "";
    const before = line.slice(0, cur.ch);
    const m = /([A-Za-z_]\w*)$/.exec(before);
    const only = allowedHere(line, cur.ch);
    // a slot standing empty is a question already answered: show what fits,
    // without waiting for somebody to guess the first letters
    if (!m) {
        if (!only || !/=\s*$/.test(before)) return hideCompletion();
        compItems = only.slice(0, 8);
        compChosen = 0;
        compFrom = { line: cur.line, ch: cur.ch };
        compEl.dataset.kind = axisOf[/typealias\s+(\w+)\s*=/.exec(line)[1]] || "";
        return drawCompletion();
    }
    if (m[1].length < 2 && !only) return hideCompletion();
    const word = m[1], low = word.toLowerCase();
    const pool = (only || completionPool()).filter(n => n !== word && n.toLowerCase().includes(low));
    pool.sort((a, b) => {
        const pa = a.toLowerCase().startsWith(low), pb = b.toLowerCase().startsWith(low);
        return pa === pb ? a.localeCompare(b) : (pa ? -1 : 1);
    });
    compItems = pool.slice(0, 8);
    compChosen = 0;
    compEl.dataset.kind = only ? (axisOf[/typealias\s+(\w+)\s*=/.exec(line)[1]] || "") : "";
    if (!compItems.length) return hideCompletion();
    compFrom = { line: cur.line, ch: cur.ch - word.length };
    drawCompletion();
}

function namesOf(parsed) {
    const out = new Set();
    for (const [name, d] of parsed.declarations) {
        out.add(name);
        for (const c of d.conformances) out.add(c);
        for (const [k] of d.aliases) out.add(k);
        for (const e of (d.entries || [])) { out.add(e.head); (e.args || []).forEach(a => out.add(a)); }
    }
    for (const [name] of (parsed.topAliases || new Map())) out.add(name);
    return out;
}

function clearFlags() {

let paintedKey = "";

// ── the Table surface: the ACTIVE file projected as relations, so all three
// views (Full · Bare · Table) show the same file. Cross-file names still jump
// (declFile) and the wave still respects siblings; only the projection is
// per-file, matching the code. ──
function activeDecls() { return lastParsed ? lastParsed.declarations : new Map(); }
function tableGroups() {
    if (!lastParsed) return [];
    const buckets = new Map();
    for (const d of activeDecls().values()) {
        if (d.aliases.size === 0) continue;
        const keys = [...d.aliases.keys()].sort();
        const sig = d.conformances.join("+") + " · " + keys.join(",");
        if (!buckets.has(sig)) buckets.set(sig, { conformances: d.conformances, keys, rows: [] });
        buckets.get(sig).rows.push(d);
    }
    const groups = [...buckets.values()].filter(g => g.rows.length >= 2);
    for (const g of groups) g.rows.sort((a, b) => a.line - b.line);
    groups.sort((a, b) => a.rows[0].line - b.rows[0].line);
    return groups;
}
function layoutOrActive() { return layoutDecls.size ? layoutDecls : (lastParsed ? lastParsed.declarations : new Map()); }

// the ledgers: declarations whose body is a list of gate entries (VerifiedView,
// VerifiedInDepartment …). Each becomes a table of the entry's arguments.
function ledgerGroups() {
    const out = [];
    for (const [name, d] of activeDecls()) {
        const entries = (d.entries || []).filter(e => e.args && e.args.length);
        if (entries.length < 2) continue;
        const byHead = new Map();
        for (const e of entries) {
            if (!byHead.has(e.head)) byHead.set(e.head, []);
            byHead.get(e.head).push(e);
        }
        for (const [head, es] of byHead)
            if (es.length >= 2) out.push({ owner: name, head, cols: es[0].args.length, rows: es });
    }
    return out;
}

// the landing is visible: the whole line selected, a brief flash, scrolled with margin
function reveal(line) {
    setMode("full");
    const local = Math.max(0, Math.min(line - 1, cm.lineCount() - 1));
    cm.focus();
    cm.setSelection({ line: local, ch: 0 }, { line: local, ch: cm.getLine(local).length });
    cm.scrollIntoView({ line: local, ch: 0 }, 120);
    cm.addLineClass(local, "background", "line-flash");
    setTimeout(() => cm.removeLineClass(local, "background", "line-flash"), 1200);
}

async function jumpTo(name) {
    const f = declFile.get(name);
    if (f && f !== active) await loadFile(f);   // a name in another file opens that file
    const d = layoutOrActive().get(name);
    if (d) return reveal(d.line);
    const mod = vocabulary[name];               // a name from a genre: open the genre
    if (mod) return openShelf(mod, name);
}

// the shelf, read-only: where the names your world speaks are declared
async function openShelf(mod, name) {

        + "`gate stdlib materialize " + mod + "` to make it yours.");

            && /^\s*(public\s+)?(enum|protocol|struct|typealias)/.test(l));

function buildTables() {
    const host = document.getElementById("table-host");
    host.innerHTML = "";
    const badLines = new Set(lastRefusals.map(r => r.line));
    const groups = tableGroups();
    const ledgers = ledgerGroups();
    if (!groups.length && !ledgers.length) { host.innerHTML = '<h3>no relations to project</h3>'; return; }
    // the ledgers first: who → what, one row per entry
    for (const L of ledgers) {
        const h = document.createElement("h3");
        h.textContent = L.owner + " · " + L.head + " · " + L.rows.length + " entries";
        h.style.cursor = "pointer"; h.onclick = () => jumpTo(L.owner);
        host.append(h);
        const table = document.createElement("table");
        const sig = "ledger:" + L.owner + ":" + L.head;
        const mark = (k) => tableSort && tableSort.sig === sig && tableSort.key === k
            ? ' <span class="dir">' + (tableSort.dir > 0 ? "↓" : "↑") + "</span>" : "";
        const head = document.createElement("tr");
        for (let c = 0; c < L.cols; c++) {
            const th = document.createElement("th");
            th.innerHTML = (c === 0 ? "who" : c === 1 ? "what" : "arg " + (c + 1)) + mark(c);
            th.onclick = () => {
                const dir = tableSort && tableSort.sig === sig && tableSort.key === c ? -tableSort.dir : 1;
                tableSort = { sig, key: c, dir }; buildTables();
            };
            head.append(th);
        }
        table.append(head);
        let entries = L.rows;
        if (tableSort && tableSort.sig === sig)
            entries = [...entries].sort((a, b) =>
                tableSort.dir * (a.args[tableSort.key] ?? "").localeCompare(b.args[tableSort.key] ?? "", undefined, { numeric: true }));
        for (const e of entries) {
            const tr = document.createElement("tr");
            e.args.forEach((a, c) => {
                const td = document.createElement("td");
                td.className = c === 0 ? "cell-name" : "cell-value";
                td.textContent = a;
                if (badLines.has(e.line)) td.classList.add("cell-bad");
                if (declFile.has(a)) { td.style.cursor = "pointer"; td.onclick = () => jumpTo(a); }
                tr.append(td);
            });
            table.append(tr);
        }
        host.append(table);
    }
    for (const group of groups) {
        const h = document.createElement("h3");
        h.textContent = group.conformances.join(", ") + " · " + group.rows.length + " rows";
        h.style.cursor = "pointer";
        h.onclick = () => jumpTo(group.rows[0].name);
        host.append(h);
        const table = document.createElement("table");
        const sig = group.conformances.join("+") + group.keys.join(",");
        const mark = (k) => tableSort && tableSort.sig === sig && tableSort.key === k
            ? ' <span class="dir">' + (tableSort.dir > 0 ? "↓" : "↑") + "</span>" : "";
        const head = document.createElement("tr");
        for (const key of ["name", ...group.keys]) {
            const th = document.createElement("th");
            th.innerHTML = key + mark(key);
            th.onclick = () => {
                const dir = tableSort && tableSort.sig === sig && tableSort.key === key ? -tableSort.dir : 1;
                tableSort = { sig, key, dir }; buildTables();
            };
            head.append(th);
        }
        table.append(head);
        let rows = group.rows;
        if (tableSort && tableSort.sig === sig) {
            const val = (d) => tableSort.key === "name" ? d.name : (d.aliases.get(tableSort.key)?.target ?? "");
            rows = [...rows].sort((a, b) => tableSort.dir * val(a).localeCompare(val(b), undefined, { numeric: true }));
        }
        for (const d of rows) {
            const tr = document.createElement("tr");
            const name = document.createElement("td");
            name.className = "cell-name"; name.textContent = d.name;
            name.title = "go to line " + d.line; name.onclick = () => jumpTo(d.name);
            tr.append(name);
            for (const key of group.keys) {
                const td = document.createElement("td");
                td.className = "cell-value";
                td.textContent = d.aliases.get(key)?.target ?? "";
                if (badLines.has(d.line)) td.classList.add("cell-bad");
                tr.append(td);
            }
            table.append(tr);
        }
        host.append(table);
    }
}

// ── one row of views over the same file: Full · Bare · Table (· Canvas one
// day). Not two switches of one state — three views of one truth. ──
let mode = "full";
const esc = (s) => s.replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));

// Bare: the bare form — the facts with the language's ceremony gone. No enum,
// no typealias, no public, no braces; scope is indentation, the way Python
// scopes. Read-only, but a full view: highlighted, every name a link to its
// declaration, an unresolved name waving the way the editor waves.
function nameTokens(raw) {
    // wrap each Capitalized identifier: a declared name jumps, an unresolved
    // name waves, a word after a dot is an axis, the rest is a known name
    return esc(raw).replace(/(\.?)\b([A-Z][A-Za-z0-9_]*)\b/g, (m, dot, name) => {
        if (dot === ".") return dot + '<span class="known">' + name + "</span>";
        if (unresolved.has(name)) return '<span class="known bad">' + name + "</span>";
        if (layoutOrActive().has(name)) return '<span class="jump" data-jump="' + name + '">' + name + "</span>";
        return '<span class="known">' + name + "</span>";
    });
}
function bareForm(parsed) {
    const badLines = new Set(lastRefusals.map(r => r.line));
    const order = parsed.order || [...parsed.declarations.keys()];
    const out = [];
    const declSpan = (name, line, bad) =>
        '<span class="decl' + (bad ? " bad" : "") + '" data-jump="' + name + '">' + esc(name) + "</span>";
    for (const name of order) {
        const d = parsed.declarations.get(name);
        if (!d) continue;
        const bad = badLines.has(d.line);
        const conf = d.conformances.length ? '<span class="conf">: </span>' + nameTokens(d.conformances.join(", ")) : "";
        out.push('<span class="' + (bad ? "row-bad" : "") + '">' + declSpan(name, d.line, bad) + conf + "</span>");
        for (const [k, v] of d.aliases)
            out.push("    " + esc(k) + " = " + nameTokens(v.target));
        for (const e of (d.entries || [])) {
            const args = e.args && e.args.length ? "<" + e.args.join(", ") + ">" : "";
            out.push("    " + nameTokens(e.head + args));
        }
        if (d.aliases.size || (d.entries || []).length) out.push("");
    }
    for (const [name, a] of (parsed.topAliases || new Map()))
        out.push(declSpan(name, a.line, false) + " = " + nameTokens(a.target));
    return out.join("\n");
}
// one delegated handler: a name in the bare view jumps to its declaration
document.getElementById("bare").addEventListener("click", (e) => {
    const t = e.target.closest("[data-jump]");
    if (t) jumpTo(t.dataset.jump);
});

function setMode(m) {
    mode = m;
    document.getElementById("editor-host").style.display = m === "full" ? "" : "none";
    document.getElementById("bare").style.display = m === "bare" ? "block" : "none";
    document.getElementById("table-host").style.display = m === "table" ? "block" : "none";
    document.querySelectorAll("#view-seg button").forEach(b => b.classList.toggle("on", b.dataset.m === m));
    if (m === "bare" && lastParsed) document.getElementById("bare").innerHTML = bareForm(lastParsed);
    if (m === "table") buildTables();
    if (m === "full") cm.refresh();
}
document.querySelectorAll("#view-seg button").forEach(b => b.onclick = () => setMode(b.dataset.m));

// No buffer of our own: an edit goes to the working-copy file, and git is the
// only state. But ONLY a holding world is written — a refused (invalid) world
// never reaches the file, so git reflects only worlds that hold. The invalid
// state lives only in the editor buffer until it holds again. A programmatic
// load (setValue) judges without writing.
let timer = null;
cm.on("change", (_, change) => {
    clearTimeout(timer);
    const userEdit = change.origin && change.origin !== "setValue";
    // offer names while somebody types, and only then
    const typed = change.origin === "+input" ? change.text.join("") : null;
    if (typed !== null && /^[\w =]+$/.test(typed)) offerCompletion();
    else hideCompletion();
    timer = setTimeout(() => tick(userEdit), userEdit ? 400 : 150);
});
cm.on("blur", () => setTimeout(hideCompletion, 120));
cm.on("cursorActivity", () => { if (!compEl.hidden && !compFrom) hideCompletion(); });
async function tick(write) {
    await render();                         // judges the buffer first
    const holds = lastRefusals.length === 0;
    if (write && holds) {
        await fetch("/world?f=" + encodeURIComponent(active), { method: "PUT", body: editor.value });
        refreshGit();
    } else if (write) {
        // invalid: withhold the write, say so plainly
        const el = document.getElementById("gitstate");
        el.className = "modified";
        el.innerHTML = '<span class="g"></span>refused: nothing written';
        el.title = "The judge refused this text, so it was not written to the file. "
                 + "Your edit is here in the editor until it holds again.";
    }
}

async function siblings() {
    siblingNames = new Set(); layoutDecls = new Map(); declFile = new Map();
    for (const f of files) {
        const t = f === active ? editor.value : await (await fetch("/world?f=" + encodeURIComponent(f))).text();
        const parsed = judge(f, t).parsed;
        if (f !== active) namesOf(parsed).forEach(n => siblingNames.add(n));
        for (const [name, d] of parsed.declarations) if (!layoutDecls.has(name)) { layoutDecls.set(name, d); declFile.set(name, f); }
    }
}
async function loadFile(name) {
    cm.setOption("readOnly", false);
    active = name;
    document.getElementById("fname").textContent = name;
    buildRail();
    const t = await (await fetch("/world?f=" + encodeURIComponent(name))).text();
    editor.value = t;   // setValue: judged, not written
    await siblings();
    render();
    refreshGit();
}

// ── the file rail is a panel you can drag, like the others. The limit is the
// window, not a number somebody picked: drag it wide to read the journal, drag
// it away to read the code. Double-click returns it. ──
function makeSplit(el, panel, min, maxOf) {
    let drag = null, frame = null;
    el.addEventListener("pointerdown", (e) => {
        drag = { fromX: e.clientX, fromW: panel.getBoundingClientRect().width };
        el.classList.add("dragging"); try { el.setPointerCapture(e.pointerId); } catch {} e.preventDefault();
    });
    el.addEventListener("pointermove", (e) => {
        if (!drag) return; drag.lastX = e.clientX;
        if (frame) return;
        frame = requestAnimationFrame(() => {
            frame = null; if (!drag) return;
            const max = typeof maxOf === "function" ? maxOf() : maxOf;
            const w = Math.max(min, Math.min(max, drag.fromW + (drag.lastX - drag.fromX)));
            panel.style.flex = "0 0 " + w + "px";
        });
    });
    const done = () => { drag = null; el.classList.remove("dragging"); };
    el.addEventListener("pointerup", done); el.addEventListener("pointercancel", done);
    el.addEventListener("dblclick", () => { panel.style.flex = ""; });
}
makeSplit(document.getElementById("split-rail"), document.getElementById("rail"),
          120, () => Math.max(360, window.innerWidth - 320));

// ── the rail remembers how you left it: which sections are open, and how wide.
// Nothing here is a fact about the world, so it lives in the browser, not in git.
const LAYOUT = "gate.bench.layout";
function layout() {
    try { return JSON.parse(localStorage.getItem(LAYOUT) || "{}"); } catch { return {}; }
}
function saveLayout(patch) {
    try { localStorage.setItem(LAYOUT, JSON.stringify({ ...layout(), ...patch })); } catch { }
}
function applyFold(name, shut) {
    const head = document.querySelector('h3[data-fold="' + name + '"]');
    const body = head.nextElementSibling;
    head.classList.toggle("shut", shut);
    body.classList.toggle("shut", shut);
    head.title = shut ? "Show " + name : "Hide " + name;
}
for (const head of document.querySelectorAll("h3.fold")) {
    const name = head.dataset.fold;
    applyFold(name, !!layout()["shut_" + name]);
    head.onclick = () => {
        const shut = !head.classList.contains("shut");
        applyFold(name, shut);
        saveLayout({ ["shut_" + name]: shut });
    };
}
{   // the width you dragged it to, next time as well
    const rail = document.getElementById("rail"), w = layout().railWidth;
    if (w) rail.style.flex = "0 0 " + w + "px";
    const split = document.getElementById("split-rail");
    split.addEventListener("pointerup", () =>
        saveLayout({ railWidth: Math.round(rail.getBoundingClientRect().width) }));
    split.addEventListener("dblclick", () => saveLayout({ railWidth: 0 }));
}

(async () => {
    {
        const v = await (await fetch("/vocabulary")).json().catch(() => ({}));
        vocabulary = v.names || {}; conformers = v.conformers || {}; axisOf = v.axes || {};
    }
    const fl = await (await fetch("/files")).json().catch(() => ({ files: [] }));
    files = fl.files || []; personalFile = fl.personal || null; personalEmpty = !!fl.personal_empty;
    // the rail carries files AND the journal, so it shows for any clone

        ? "Every claim in these files is judged as you type. A lie cannot be saved."
        : "Reading this repository's history. Nothing here is judged yet.";
    document.getElementById("rail").style.display = "flex";
    document.getElementById("split-rail").style.display = "block";
    document.getElementById("fname").style.display = "none";
buildRail();
    await buildJournal();
    if (!files.length) return showEmpty();   // no world here yet
    await loadFile(files[0] || "gate.swift");
})();

// ── no world yet: the journal on the left is already live, and these are the
// two ways to get one. Nobody is asked to read a manual first. ──
function showEmpty() {
    document.getElementById("editor-host").style.display = "none";
    document.getElementById("verdict-panel").style.display = "none";
    document.getElementById("view-seg").style.display = "none";
    document.querySelector("#rail h3").style.display = "none";   // no files, no heading
    const host = document.getElementById("table-host");
    host.style.display = "block";
    // say only what is true HERE: a repository with no commits has no journal
    const lead = journalCommits.length
        ? "The journal on the left is already reading this repository: every commit, who wrote "
          + "it, whether it is merged. That needs no translation at all."
        : "This repository has no commits yet, so there is nothing to read on the left either. "
          + "A world is the place to start.";
    host.innerHTML =
        '<div class="empty"><h2>No world here yet</h2><p>' + lead + "</p>"
        + '<div class="door"><code>gate demo</code><span>Run this in a terminal: it builds a world of people and grants, with a lie already in it. Thirty seconds.</span></div>'
        + '<div class="door"><code>cp your.csv tables/ &amp;&amp; gate status</code><span>Drop a table you already export into tables/, and your own rows become a world the judge can read.</span></div>'
        + "</div>";
}
