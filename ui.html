<!-- gate ui — the world bench, v2: the playground's shell, faithfully.
     CodeMirror editor with declared-name highlighting; the Code · Table
     surface switch (Table projects the world as sortable relations, click a
     name to jump); Full · Bare (the same editor, ceremony collapsed from
     view — full Swift, fully editable); a draggable file rail (the declared
     layout); the verdict docked at the bottom, Xcode-style; cross-file
     judgement over unsaved text. -->
<meta charset="utf-8"><title>gate · world bench</title>
<!-- zero egress, enforced by the browser as well as by the code: the bench may
     talk to its own loopback server and to nothing else. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; form-action 'none'; base-uri 'none'">
<link rel="stylesheet" href="/codemirror.css">
<script>
// The theme is a declaration, not a toggle — and the declaration lives in the
// world, which is read a third of a second after the first paint. Painting the
// operating system's preference in the meantime is a guess, and a guess that
// disagrees with the declaration is watched being corrected. So this machine
// remembers what the world last DECLARED here and paints that at once; with no
// memory yet the operating system still stands, so a dark machine never flashes
// white. The memory is never a second truth about the world: it holds only a
// declaration the world itself made, the world overwrites it on every read, and
// it is dropped the moment the world stops declaring one.
(function () {
    var remembered = null;
    try { remembered = localStorage.getItem("gate.theme.declared"); } catch (e) {}
    document.documentElement.setAttribute("data-theme", remembered
        || (window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"));
})();
</script>
<!-- ── WHAT THIS PAGE PAINTS WITH AND SPACES ITSELF BY, served from the worlds
     that declare them. Every colour and every step used to be written here a
     second time — `color(xyz-d65 calc(307/1000) …)` beside a record already
     saying 307, `calc(var(--u)*6)` beside a step already named Apart — with a
     check standing between the copies to keep them equal. A check is what you
     reach for when a single source is out of reach; here it was not. This page
     now holds no colour and no length of its own: it names them, and what it
     names is what the judge holds. ── -->
<link rel="stylesheet" href="/ladder.css">
<style>
/* ── the palette, generated from the judged stdlib/bench-palette.swift: the hex
   is the sRGB fallback, and color(xyz-d65 …) carries the SAME numbers the atom
   states and its contrast certificates hold to. Lower a colour here and the
   file's slack stops settling — the palette cannot drift from what was judged.
   Do not hand-edit; regenerate from the atoms. ── */
:root{color-scheme:light; font-size:13px;
  /* the reading line is the base of every distance: an instrument for reading
     measures its spacing in the letter it sets. --u is one fifth of the line,
     and every gap is a multiple of it — one ladder, no length off it. */
  --textline: 1.45rem; --u: calc(var(--textline) / 10);
  /* a shadow is light taken away, so it is cast toward nothing in either theme.
     Cast in --ink it followed the text instead, and in the dark theme the ink is
     the LIGHT end: every raised thing wore a halo. This one belongs to no theme
     and is overridden by neither. */
  --shade: #000; --shade: color(xyz-d65 0 0 0);
}
:root[data-theme="dark"]{color-scheme:dark}
*{box-sizing:border-box}
/* ── REGISTERS: material is a function of the wire (MiC at the pixel). A register
   is declared ONCE here; an element only names it, and no rule restates what the
   wire already said. Font tells WHAT a thing is (mono = judged data; system =
   speech); ink tells WHETHER it is judged (ink = judged/primary; muted =
   observed/secondary). Two accents own their colour alone: the verdict (ok/bad)
   and the hand (action). Full is exempt — raw source, all mono, no projection. ── */
.fact{font:var(--fact);color:var(--ink)}
.observed{font:var(--fact);color:var(--muted)}
.speech{font:var(--speech);color:var(--ink)}
.caption{font:var(--caption);color:var(--muted)}
.verdict{font-weight:600}
.verdict.ok{color:var(--ok)}
.verdict.bad{color:var(--bad)}
.gesture{color:var(--action);cursor:pointer}
body{font:var(--speech);margin:0;color:var(--ink);background:var(--paper);display:flex;height:100vh;overflow:hidden}
#rail{flex:0 0 250px;display:none;flex-direction:column;overflow:auto;min-width:0}
#rail h3{font:var(--rubric);letter-spacing:.08em;text-transform:uppercase;margin:0;padding:calc(var(--u)*6) calc(var(--u)*7) calc(var(--u)*4)}
.file{display:flex;align-items:center;gap:calc(var(--u)*3);padding:calc(var(--u)*2) calc(var(--u)*7);cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.file:hover{background:var(--mist)}
.file.on{background:var(--mist);font:var(--factfirm)}
.file .dot{flex:0 0 var(--apart);width:var(--apart);height:var(--apart);border-radius:50%;background:transparent}
/* where it hurts, seen without opening: the same wave a name wears when it
   resolves to nothing, on the file that carries the refusal */
.file.bad{color:var(--bad)}
.file.bad .dot{background:var(--bad)}
.file.bad .name{text-decoration:underline wavy var(--bad);text-underline-offset:var(--near)}
/* what a name overrules is answered at the name, in the table of the world that
   declares it — a panel carrying facts about worlds has stopped being a door */
.cell-value.observed{color:var(--muted)}
.folder{padding:var(--near) calc(var(--u)*7) 0}
/* a file in a folder hangs one edge past the heading it sits under —
   `Indent` is what that step is called, and it means exactly this */
.file.nested{padding-left:var(--indent)}
.file .mine{margin-left:auto;background:var(--mist);border-radius:var(--wide);padding:0 calc(var(--u)*3);flex:none}
.file.on .mine{background:var(--paper)}
.split{flex:0 0 5px;cursor:col-resize;background:transparent;transition:background .1s}
.split:hover,.split.dragging{background:color-mix(in srgb,var(--action) 45%,transparent)}
.line-flash{background:color-mix(in srgb,var(--action) 22%,transparent)}
#next{margin-left:auto;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:52%}
/* ── THE LAST MILE. The step was a sentence to read, and a sentence gets
   retyped — with somebody's own path, slightly wrong. The command stands ready
   as it is, one click to the clipboard, and the Enter is theirs in their own
   terminal. This bench does not run things: a page that executes in a
   repository holding other people's files is an attack surface we would have
   built ourselves, and what it can promise today is that it breaks nothing. ── */
#next .run{font-family:var(--mono);color:var(--action);cursor:pointer;
  border-bottom:1px dashed var(--action);padding-bottom:var(--tight)}
#next .run:hover{background:var(--mist)}
#next .run.took{color:var(--ok);border-bottom-color:var(--ok)}
#rail h3.fold{cursor:pointer;display:flex;flex-wrap:wrap;align-items:flex-start;gap:calc(var(--u)*3);user-select:none}
#rail h3.fold:hover{color:var(--ink)}
/* open or shut is two marks, not one mark turned. Rotating a triangle spins it
   about the middle of its box while the glyph's own weight sits low, so it
   wobbles off its line for the length of the animation and lands somewhere
   slightly else. There is a character for each state; the state is what the
   reader is being told. */
#rail h3.fold i{flex:none;width:var(--wide);margin-top:var(--u);font-style:normal;line-height:1}
#rail h3.fold i::before{content:"▾"}
#rail h3.fold.shut i::before{content:"▸"}
#rail h3.fold .obs{flex:1 1 100%;padding-left:calc(var(--u)*7)}
/* the revision is a fact, not a heading: it keeps its own case and its own face */
/* ── ONE LIST OF WHAT WAS TAKEN, and the judge is a row of it. It had a
   section to itself, which said it was a different kind of thing — and under
   the claim law it is not: it is theirs, taken at a revision, exactly like the
   other side of a seam. A privileged entity in the rail is a privileged entity
   in the head, and there is nothing here that earns one. ── */
#judge-row{padding:calc(var(--u)*2) calc(var(--u)*7) 0;text-transform:none;letter-spacing:0}
#judge-row b{color:var(--ink);font-weight:600}
#judge-row .at{font-family:var(--mono);color:var(--seam)}
#rail h3.fold.shut .obs{display:none}
/* except the revision: it is the one dependency here, and a shut list is
   exactly when an operator wants it stated rather than hunted for */
.foldable.shut{display:none}
#keys-btn{border:none;background:transparent;color:var(--muted);font:var(--control);width:20px;height:20px;border-radius:5px;cursor:pointer;padding:0}
#keys-btn:hover{background:var(--mist);color:var(--ink)}
#keys-panel{position:fixed;top:38px;right:14px;z-index:30;width:min(360px,86vw);background:var(--paper);border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 28px color-mix(in srgb,var(--shade) 18%,transparent);padding:calc(var(--u)*6) calc(var(--u)*7)}
#keys-panel h4{margin:0 0 calc(var(--u)*4);font:var(--headsmall)}
#keys-panel p{margin:calc(var(--u)*4) 0 0;font:var(--captionloose);color:var(--muted)}
.krow{display:flex;gap:calc(var(--u)*4);align-items:baseline;padding:var(--u) 0;font:var(--captionline)}
.krow kbd{flex:0 0 5.6em;font:var(--keycap);color:var(--ink);background:var(--mist);border-radius:5px;padding:var(--u) calc(var(--u)*2);text-align:center}
.krow span{color:var(--muted)}
#completion{position:absolute;z-index:32;background:var(--paper);border:1px solid var(--line);border-radius:8px;box-shadow:0 6px 22px color-mix(in srgb,var(--shade) 16%,transparent);padding:calc(var(--u)*2);min-width:11em;max-height:15em;overflow:auto}
.crow{padding:var(--u) calc(var(--u)*4);border-radius:5px;cursor:pointer;white-space:nowrap}
/* ── A GESTURE IS NOT A SOURCE. The chosen row was washed with the action
   colour, and that hue sits between `mine` and `theirs` on the same axis, so
   picking an item looked like the item changing whose it was: the one thing a
   name's colour answers here. Selection is the ceremony grey the editor
   already selects text with, and the name keeps saying where it came from. */
.crow.on{background:var(--select)}
.crow .cmine{color:var(--localtype)}
.crow .ctheirs{color:var(--knownname)}
.crow:hover{background:var(--mist)}
.cnote{padding:calc(var(--u)*2) calc(var(--u)*4) var(--u);border-top:0.5px solid var(--line);margin-top:calc(var(--u)*2)}
#inspect{flex:none;padding:calc(var(--u)*3) calc(var(--u)*8) calc(var(--u)*2);border-bottom:0.5px solid var(--line);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#inspect:empty::before{content:"the cursor on a name says what it is";opacity:.5}
/* an answer to something you did is spoken in ink, where the reading of a name
   under the cursor stays quiet: same line, two voices, neither of them floating */
#inspect[data-answer]{color:var(--ink)}
#inspect .run{margin-left:calc(var(--u)*2)}
#brand{padding:calc(var(--u)*7) calc(var(--u)*7) calc(var(--u)*3)}
#brand b{display:block;font:var(--brand);letter-spacing:-.01em}
#brand span{display:block;margin-top:calc(var(--u)*2)}
#main{flex:1;display:flex;flex-direction:column;min-width:0;border-left:0.5px solid var(--line)}
#bar{display:flex;gap:calc(var(--u)*5);align-items:center;padding:calc(var(--u)*3) calc(var(--u)*6);border-bottom:0.5px solid var(--line);flex:none}
#bar b{font-weight:600}
.seg{display:inline-flex;background:var(--mist);border-radius:8px;padding:var(--u);gap:var(--u)}
.seg button{border:none;border-radius:5px;margin:0;background:transparent;color:var(--muted);font:var(--control);padding:calc(var(--u)*2) calc(var(--u)*6);cursor:pointer}
.seg button:hover{color:var(--ink)}
.seg button.on{background:var(--paper);color:var(--ink);box-shadow:0 1px 2px color-mix(in srgb,var(--shade) 12%,transparent)}
.seg button:disabled{opacity:.3;cursor:default}
.seg button:disabled:hover{color:var(--muted)}
#nav-seg button{padding:calc(var(--u)*2) calc(var(--u)*5);font-size:15px;line-height:1}
#gitstate{font-family:var(--mono);margin-left:auto;display:flex;align-items:center;gap:calc(var(--u)*3)}
#gitstate .g{width:7px;height:7px;border-radius:50%;background:var(--muted)}
#gitstate.modified{color:var(--law)}
#gitstate.modified .g{background:var(--law)}
#gitstate.committed{color:var(--muted)}
#gitstate.committed .g{background:var(--muted)}
#write{border:none;background:color-mix(in srgb,var(--action) 12%,transparent);color:var(--action);padding:calc(var(--u)*2) calc(var(--u)*6);border-radius:5px;font:inherit;cursor:pointer}
#write:disabled{opacity:.4;cursor:default}
#surface{flex:1;position:relative;min-height:0}
#editor-host{position:absolute;inset:0}
.CodeMirror{height:100%;font:var(--source);background:var(--paper);color:var(--ink)}
/* the code stands off from its index by a named step, not by the four pixels the
   vendored sheet happens to give: the gutter is scaffolding and the text needs
   air from it. Written at the vendor's own weight, or the vendor wins. */
.CodeMirror pre.CodeMirror-line,.CodeMirror pre.CodeMirror-line-like{padding:0 calc(var(--u)*4)}
.CodeMirror-linenumber{color:var(--seam)}
.CodeMirror-cursor{border-left-color:var(--ink)}
/* the borrowed sheet draws this one at 1px while every other line on this
   page is half that — so the divider nearest the reading eye was the
   heaviest thing on screen. We had overridden its colour and inherited its
   width, which is the same silence as an unoverridden token colour. */
.CodeMirror-gutters{background:var(--paper);border-right:0.5px solid var(--line)}
.CodeMirror-selected,.CodeMirror-focused .CodeMirror-selected{background:var(--select)}
.CodeMirror-line::selection,.CodeMirror-line>span::selection,.CodeMirror-line>span>span::selection{background:var(--select)}
/* the editor's tokens speak the same table. Ceremony — public, enum, typealias,
   extension, where, an @attribute, .self — carries no meaning of the world: it is
   the SEAM, the colour of the brackets, at the weight of ordinary text. Full stops
   shouting with form; the facts stand out, and the two views converge. A literal is
   a value, never red: red is the verdict's alone. */
.cm-s-default .cm-keyword,.cm-s-default .cm-attribute{color:var(--seam)}
.cm-s-default .cm-string{color:var(--knownname)}
.cm-s-default .cm-comment{color:var(--muted)}
.cm-localtype{color:var(--localtype)}
.cm-knownname{color:var(--knownname)}
/* weight says SUBJECT: a declaration line holds two names, the one it declares
   and the one it answers to, and the eye must land on the first. An axis name
   is neither a fact nor a stranger — it is the label of a slot — so it is set
   in plain ink, the way the bare view has always set it. */
.cm-declname{font-weight:600}
.cm-axisname{color:var(--ink)}
/* a hole's label in the bare view is the same hole the editor paints in ink */
.hole-label{color:var(--ink)}
.CodeMirror.holding .cm-jumpable{text-decoration:underline;text-underline-offset:2px;cursor:pointer}
.cm-badname{text-decoration:underline wavy var(--bad);text-underline-offset:3px}
.cm-ghost{color:var(--seam)}
.line-flag-bad{background:color-mix(in srgb,var(--bad) 6%,transparent)}
.gutter-flag-bad .CodeMirror-linenumber{color:var(--bad);font-weight:700}
.flag-note{font:var(--captionloose);color:var(--bad);background:color-mix(in srgb,var(--bad) 8%,transparent);padding:var(--u) calc(var(--u)*5) var(--u) calc(var(--u)*14)}
#bare{position:absolute;inset:0;overflow:auto;background:var(--paper);margin:0;padding:calc(var(--u)*6) calc(var(--u)*8) calc(var(--u)*40);display:none;font:var(--source);color:var(--ink);white-space:pre}
#bare .conf{color:var(--muted)}
#bare .decl{color:var(--localtype);font-weight:600;cursor:pointer}
#bare .jump{color:var(--localtype);cursor:pointer}
#bare .decl:hover,#bare .jump:hover{text-decoration:underline}
#bare .known{color:var(--knownname)}
/* the one string a record is allowed: it spells a name, so it is set as the
   text it is rather than as a value of some axis */
#bare .lit{color:var(--muted)}
/* THE SEAMS THIS WORLD IS PARTY TO. Same registers as everywhere: an address is
   a fact and set in mono, what it means is speech and set in the system face,
   the category of the line is a caption. Nothing here is a verdict — a seam is a
   standing account of who owes whom a word, and the court over it is `gate
   seam`. */
/* THE SEAMS THIS FOLDER IS PARTY TO, in the rail's own grammar: one row per
   item, the address a fact, the kind a badge, and WHY IT IS THERE in the title —
   the same way the journal wears its state, and the same way this bench has
   always answered `what is this` on demand rather than printing it nine times
   down a narrow column. Nothing new is measured here: the rows are commits'
   rows, so the ladder is the one already judged. */
#shelf-host{padding-bottom:calc(var(--u)*3)}
/* a seam's state at its claim: the same two poles the verdict uses, and the
   quiet register for everything in between — waiting is a conversation */
.seam-line td{padding-left:var(--wide)}
/* the cell becomes the field: same face, same size, no box drawn around an
   answer that is standing exactly where the value was */
.cell-input{font:var(--fact);color:var(--ink);background:transparent;border:0;
  outline:0;width:6ch;padding:0;margin:0}
.seam-where{color:var(--seam)}
.stale{color:var(--law)}
/* ── PROSE IS READ AS PROSE. A comment is somebody talking, and Bare had been
   setting each source LINE as its own block inside a `pre` — so one paragraph
   came out a column of fragments with a blank line between every one of them,
   and the hard wrap of the file leaked into the reading. A run of comment lines
   is one paragraph now: speech register, wrapped to the pane, and the air goes
   between paragraphs where it belongs rather than inside one. ── */
#bare .note{display:block;white-space:normal;max-width:62ch;
  font:var(--prose);color:var(--muted)}
/* ── AND EVERY GAP HERE IS A NAMED STEP, which it had not been. Records were
   held apart by a blank line of text — the font's line-height, some eight and a
   fifth units, a number nobody declared and nobody could defend. The law of
   proximity says what these gaps are: a record with its axes is a GROUP, so
   groups stand `Apart`; a note and the record it speaks for are PARTS OF ONE
   THING, so they sit `Near`, closer than rows stand from each other. Read the
   ladder and the spacing states the kinship instead of guessing at it. ── */
#bare .rec{display:block;margin-bottom:var(--apart)}
#bare .note.said{margin:0 0 var(--near)}
#bare .note.free{margin:0}
/* ── A SECTION AND A BLOCK SET AS WRITTEN, in registers this page already
   declares. A heading is `headsmall` — the voice the keys panel speaks its own
   sections in — and a block the writer indented keeps its lines and its face,
   because a command whose continuation was folded into the paragraph is no
   longer a command. Neither is a new word: no register is added here, two get
   a second speaker. ── */
#bare .head{display:block;font:var(--headsmall);color:var(--ink);margin:0 0 var(--near)}
#bare .set{display:block;white-space:pre;overflow-x:auto;font:var(--source);
  color:var(--muted);margin:0}
#bare .note code{font:var(--codeinline);color:var(--ink)}
#bare .note .known{font:var(--codeinline)}
#bare .slot{cursor:pointer;border-bottom:1px dashed var(--line)}
#bare .slot.elsewhere{cursor:default;border-bottom-style:none}
/* a hole already says it three ways — the word, the dashes, the quiet register —
   so the amber it wore was a third hue answering a question the scene does not
   ask (С9: unearned; Р3: taxed). What is owed is not a warning, it is a row. */
#bare .slot.hole{border-bottom-style:dashed;border-color:var(--muted)}
/* a gesture inside the code fabric is known by its form, its place and the
   cursor — never by chroma. The hand reads all three before colour, and the
   scene has only two questions to spend a hue on: where a name is from, and
   what the verdict is. Blue stays outside the fabric, where it answers to the
   page rather than to the world's own text (Р2, Р3). */
/* THE HAND'S TARGET IS A STEP OF THE LADDER (Р1). Reaching a target costs time
   that grows with distance and falls with its size, so a target has a floor —
   and the floor is not borrowed from a phone: it is ONE READING LINE, the base
   every distance here is measured in. What you can read, you can hit. Vertical
   padding grows the hit area of an inline mark without touching the rhythm of
   the lines around it. Said plainly, not derived: this bench is driven by a
   mouse, not a finger. */
#bare .slot,#bare .add{padding-top:var(--u);padding-bottom:var(--u)}
/* a name in Bare stands in a dense column, so its target is the line itself and
   not a padding that would reach into the lines above and below: one more step
   of hit area would overlap its neighbours and make the click ambiguous. The
   floor is stated as the step, and the mark is given exactly that. */
#bare .decl,#bare .jump{display:inline-block;min-height:calc(var(--u)*10)}
#bare .cut{padding:calc(var(--u)*2) calc(var(--u)*3)}
#bare .add{display:inline-block;cursor:pointer;color:var(--muted)}
#bare .add:hover{color:var(--ink)}
#bare .cut{cursor:pointer;color:var(--muted);visibility:hidden}
#bare span:hover > .cut,#bare .cut:hover{visibility:visible}
#bare .namerow{display:flex;gap:var(--u);align-items:baseline;padding:calc(var(--u)*2) 0}
#bare .namerow input{font:inherit;color:var(--ink);background:var(--mist);border:1px solid var(--line);border-radius:5px;padding:0 calc(var(--u)*2)}
#bare .bad{text-decoration:underline wavy var(--bad);text-underline-offset:3px}
/* where it hurts, in the view you write in: the same wave a file wears in the
   panel and a name wears when it resolves to nothing. A tinted backing was
   the marker we took off the refusal rows this morning — one thing, one
   mark, or the page teaches two words for one state. */
#bare .row-bad{text-decoration:underline wavy var(--bad);text-underline-offset:var(--near)}
.empty{max-width:34em;padding:calc(var(--u)*20) 0 0 calc(var(--u)*10);color:var(--ink)}
.empty h2{font:var(--headline);margin:0 0 calc(var(--u)*4)}
.empty p{font:var(--proseloose);color:var(--muted);margin:0 0 calc(var(--u)*10)}
.door{display:flex;flex-direction:column;gap:calc(var(--u)*2);padding:calc(var(--u)*6) calc(var(--u)*7);margin-bottom:calc(var(--u)*5);border:1px solid var(--line);border-radius:8px}
.door code{font:var(--factbare);color:var(--action)}
.door span{font:var(--controlsmall);color:var(--muted)}
#table-host{position:absolute;inset:0;overflow:auto;background:var(--paper);padding:calc(var(--u)*6) calc(var(--u)*8) calc(var(--u)*40);font-size:12.5px;display:none}
#table-host h3{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin:calc(var(--u)*10) 0 calc(var(--u)*3);font-weight:600}
#table-host h3:first-child{margin-top:calc(var(--u)*2)}
/* ── A TABLE FALLS LEFT. Stretched to the pane it put two short words at
   opposite ends of a wide screen — `Emp9000` here, `Finance` eight hundred
   pixels away — and reading a row became a journey across empty space. Air is
   worth having; a void is not the same thing. Columns take the width their
   content needs and the table ends where its content ends, so a row is read in
   one glance and the page cascades down the left. The reading measure is the
   same bound the prose keeps. ── */
#table-host table{border-collapse:collapse;width:auto;max-width:100%;table-layout:auto}
#table-host td,#table-host th{white-space:nowrap}
#table-host th{text-align:left;font-weight:500;padding:calc(var(--u)*2) calc(var(--u)*5) calc(var(--u)*2) calc(var(--u)*3);border-bottom:0.5px solid var(--line);position:sticky;top:0;background:var(--paper);cursor:pointer;user-select:none}
#table-host th:hover{color:var(--ink)}
#table-host th .dir{color:var(--ink)}

// ── the file rail: the declared layout, the same list the judge runs over ──
function buildRail() {
    const list = document.getElementById("filelist");
    list.innerHTML = "";
    // ── A WORLD MAY BE LAID OUT IN FOLDERS, and the rail said otherwise. A
    // declared layout is allowed to put files in directories — that is most of
    // what declaring a layout is for — and this list showed a flat column of
    // full paths, so the shape a person gave their own world was invisible in
    // the one place that is meant to be an account of it. The folder is a
    // heading; the file keeps its own name under it.
    let folder = null;
    for (const f of files) {
        const cut = f.lastIndexOf("/");
        const dir = cut < 0 ? "" : f.slice(0, cut);
        if (dir !== folder) {
            folder = dir;
            if (dir) {
                const head = document.createElement("div");
                head.className = "folder caption";
                head.textContent = dir + "/";
                list.appendChild(head);
            }
        }
        const row = document.createElement("div");
        row.className = "file fact" + (cut < 0 ? "" : " nested")
            + (f === active ? " on" : "") + (badFiles.has(f) ? " bad" : "");
        // your personal world stands apart: it is in your own git, and the
        // shared repository does not have it
        row.innerHTML = '<span class="dot"></span><span class="name">'
            + (cut < 0 ? f : f.slice(cut + 1)) + "</span>"
            + (f === personalFile
            // every file under this heading is mine, so the badge must say the
            // thing that is different about this one: it is not in the repository
            ? '<span class="mine caption" title="Your personal world. It lives in your own git at ~/.gate/me and is never in the shared repository.">not shared</span>' : "");
        row.onclick = () => {
            const from = navHere();       // opening a file from the rail is a jump too
            loadFile(f); recordJump(from); // loadFile sets `active` before it awaits
        };
        list.appendChild(row);
    }
    // and the sides of a seam, under their own word: declared by this layout,
    // judged where they meet this world and nowhere else, opened to READ
    if (seamRows.length) {
        const head = document.createElement("div");
        head.className = "folder caption";
        head.textContent = "seams";
        list.appendChild(head);
        for (const s of seamRows) {
            const r = document.createElement("div");
            r.className = "file fact nested" + (viewingShelf === s ? " on" : "");
            r.title = "One side of a seam, as its own side wrote it. Judged where it meets your "
                    + "world and nowhere else: `gate seam` is the court over the pair.";

                + esc(s.split("/").pop()) + "</span>";

// the journal shows. Edit it in the bench and the journal follows — one truth,

// what a commit did, read as facts: `Rank: Manager → Lead`, not a wall of
// git plumbing. It opens UNDER the commit, in the rail — nothing is covered
// and nothing dims, because a diff is something you glance at.
// ── completion: the names this world allows, offered while you type. The
// pool is not a dictionary of ours — it is what the files themselves declare,
// so what it offers is what the judge will accept. ──
let compItems = [], compChosen = 0, compFrom = null;

// ── WHERE THE CURSOR IS, IN THE GRAMMAR ──
// A world has four places, and each one allows a different thing. Everything
// the bench offers comes from this one reading; nothing is a special case
// added because somebody noticed it missing.
//
//   top level          a declaration may begin, and after `:` its protocols
//   inside one         the axes it owes, and the values each of them takes
//   inside a body      the gates that may be claimed, and their arguments
//   after a dot        the axes of whatever stands to the left
function placeAt(cur) {
    let host = null, inBody = false, depth = 0;
    for (let i = cur.line; i >= 0; i--) {
        const code = (cm.getLine(i) || "").split("//")[0];
        if (i < cur.line) depth += (code.match(/\}/g) || []).length - (code.match(/\{/g) || []).length;
        if (/var\s+body\s*:\s*some\s+Structure\s*\{/.test(code) && depth <= 0) inBody = true;
        const m = /^\s*(?:public\s+)?enum\s+(\w+)\s*:\s*([\w,\s]+?)\s*\{/.exec(code);
        if (m && depth <= 0) {
            host = { name: m[1], conformances: m[2].split(",").map(x => x.trim()).filter(Boolean) };
            break;
        }
        if (/^\}/.test(code) && i < cur.line) break;     // a closed declaration above
    }
    return { host, inBody };

        Object.assign(out, protoAxes[proto] || {});

// through an axis this record already has — `Sex = Given.Sex`
function fillersFor(kind, host, slotName) {
    if (!kind) return null;
    const out = [...(conformers[kind] || [])];
    for (const [name, d] of layoutDecls)
        if ((d.conformances || []).includes(kind)) out.push(name);
    for (const [axis, axisKind] of Object.entries(axesOfHost(host))) {
        if (axis === slotName) continue;         // a slot cannot be filled by itself
        for (const [inner, innerKind] of Object.entries(protoAxes[axisKind] || {}))
            if (innerKind === kind) out.push(axis + "." + inner);
    }
    return out.length ? [...new Set(out)] : null;

    const m = /(\w+)\.(\w*)$/.exec(before);
    if (!m) return null;
    const kind = axesOfHost(host)[m[1]] || axisOf[m[1]];
    const out = Object.entries(protoAxes[kind] || {})
        .filter(([, k]) => !wanted || k === wanted).map(([a]) => a);
    return out.length ? { items: out, back: m[2].length } : null;
}

// WHAT MAY BE WRITTEN HERE — the whole of it, in one place
function allowedAt(cur) {
    const line = cm.getLine(cur.line) || "";
    const before = line.slice(0, cur.ch);
    const { host, inBody } = placeAt(cur);

    // an axis slot: `typealias Sex = `
    const slot = /typealias\s+(\w+)\s*=\s*[\w.]*$/.exec(before);
    const wanted = slot ? (axesOfHost(host)[slot[1]] || axisOf[slot[1]] || null) : null;

    const dotted = afterDot(before, host, wanted);
    if (dotted) return { items: dotted.items, back: dotted.back,
                         kind: wanted ? "this axis takes " + wanted : "what stands here", closed: true };

    if (slot) {
        // a slot is a closed question: only what its kind allows, and if the
        // forms state no kind for it, nothing — never a name of another kind
        const f = wanted ? fillersFor(wanted, host, slot[1]) : null;
        return { items: f || [], kind: wanted ? "this axis takes " + wanted : "an axis", closed: true };
    }

    // the head of a declaration: `public enum Emp9007: `
    const head = /^\s*(?:public\s+)?enum\s+\w+\s*:\s*([\w,\s]*)$/.exec(before);
    if (head) {
        const already = new Set(head[1].split(",").map(x => x.trim()).filter(Boolean));
        const protos = Object.keys(protoAxes).filter(p => !already.has(p));
        return protos.length ? { items: protos, kind: "what this record is", closed: true } : null;
    }

    // inside a body: the gates that may be claimed here
    if (inBody && /^\s*\w*$/.test(before)) {
        const forms = Object.keys(gates);
        return forms.length ? { items: forms, kind: "a claim this body may hold", closed: true } : null;
    }
    // an argument of a gate: `VerifiedView<\n  Emp9001,\n  ` — the kind is stated
    if (inBody) {
        for (let i = cur.line; i >= 0 && i > cur.line - 6; i--) {
            const m = /(\w+)\s*<\s*$/.exec((cm.getLine(i) || "").split("//")[0]);
            if (m && gates[m[1]]) {
                const kinds = gates[m[1]];
                const nth = cur.line - i - 1;
                const k = kinds[Math.min(nth, kinds.length - 1)];
                const f = fillersFor(k, host);
                return f ? { items: f, kind: "this argument takes " + k, closed: true } : null;
            }
        }
    }

    // inside a declaration, at the start of a line: the axes it still owes
    if (host && !inBody && /^\s*(?:p(?:u(?:b(?:l(?:i(?:c)?)?)?)?)?)?$/.test(before)) {
        const stated = new Set();
        for (let i = cur.line - 1; i >= 0; i--) {
            const code = (cm.getLine(i) || "").split("//")[0];
            const t = /typealias\s+(\w+)/.exec(code);
            if (t) stated.add(t[1]);
            if (/enum\s+\w+\s*:/.test(code)) break;
        }
        const owed = Object.keys(axesOfHost(host)).filter(a => !stated.has(a));
        if (owed.length)
            return { items: owed.map(a => "public typealias " + a + " = "),
                     scaffold: owed, kind: "axes this record still owes", closed: false };
    }
    return null;
}

    if (pending && pending.what === "claim") { hideCompletion(); return claimStep(name); }

        const cur = cm.getCursor();
        const indent = (cm.getLine(cur.line).match(/^\s*/) || [""])[0] || "    ";
        const lines = compScaffold.map(a => indent + "public typealias " + a + " = ");
        cm.replaceRange(lines.join("\n"), { line: cur.line, ch: 0 }, cur, "+input");
        cm.setCursor({ line: cur.line, ch: lines[0].length });   // in the first slot
        hideCompletion();
        offerCompletion();                                       // now offer its value
        return;
    }
    cm.replaceRange(name, compFrom, cm.getCursor(), "+input");
    hideCompletion();
}

function offerCompletion() {
    const cur = cm.getCursor();
    const line = cm.getLine(cur.line) || "";
    const before = line.slice(0, cur.ch);
    const here = allowedAt(cur);
    if (!here) return hideCompletion();     // no grammar here means no offer
    const m = /([A-Za-z_]\w*)$/.exec(before);
    const word = m ? m[1] : "";
    const low = word.toLowerCase();
    const back = here.back !== undefined ? here.back : word.length;
    let items = word ? here.items.filter(n => n.toLowerCase().includes(low) && n !== word) : here.items;
    items.sort((a, b) => {
        const pa = a.toLowerCase().startsWith(low), pb = b.toLowerCase().startsWith(low);
        return pa === pb ? a.localeCompare(b) : (pa ? -1 : 1);
    });
    // the whole record, offered first when a slot is fresh: fill every axis it
    // owes at once, then land in the first. It is the same owed set, one grain up.
    compScaffold = null;
    if (here.scaffold && here.scaffold.length > 1 && word.length <= 1) {
        compScaffold = here.scaffold;
        items = ["\u25B8 fill in " + here.scaffold.join(", "), ...items];
    }
    compItems = items.slice(0, 8);
    compChosen = 0;
    if (!compItems.length) return hideCompletion();
    compFrom = { line: cur.line, ch: cur.ch - back };
    compEl.dataset.kind = here && here.kind ? here.kind : "";
    drawCompletion(true);
}

// a one-line note, for the moments the tool has something to say back
// ── AN ANSWER GOES WHERE THE EYE ALREADY IS, AND STAYS THERE. This was a bar that
// floated for 3.2 seconds and then took itself away, which is fine for answering a
// keystroke and was carrying three other things as well: a paragraph with a command
// in it, a label about the view, and a refusal. Eighty words in three seconds is
// unreadable by arithmetic. The line under the editor is where this page already
// says what you are looking at, so an answer to something you did belongs there: it
// is replaced by the next thing the cursor lands on, never by a timer.
function say(text) {
    const el = document.getElementById("inspect");
    el.textContent = text;
    el.dataset.answer = "1";
}

// ── the shortcuts, behind a quiet ?. Nothing here is new to learn: they are
// the keys this editor already answers to, written down. ──
const KEYS = [

];
{
    // built on first use: everything it needs is defined by then

document.addEventListener("keydown", (e) => {

// What this file DECLARES, which is not what it mentions. A record it writes is
// its own; the kinds it conforms to, the axes it answers and the forms it uses
// are all declared on the shelf, and colouring them as local said the world had
// authored its own forms. The question (an axis) and the answer (a value) came
// out one colour for that reason: both were "mentioned here".
function namesOf(parsed) {
    const out = new Set();
    for (const [name] of parsed.declarations) out.add(name);
    for (const [name] of (parsed.topAliases || new Map())) out.add(name);
    return out;
}

function clearFlags() {
    widgets.forEach(w => w.clear()); widgets = [];
    for (let i = 0; i < cm.lineCount(); i++) {
        cm.removeLineClass(i, "background", "line-flag-bad");
        cm.removeLineClass(i, "gutter", "gutter-flag-bad");
    }
}
function applyFlags(refusals) {
    for (const ref of refusals) {
        if ((ref.file || active) !== active) continue;
        const i = ref.line - 1;
        if (i < 0 || i >= cm.lineCount()) continue;
        cm.addLineClass(i, "background", "line-flag-bad");
        cm.addLineClass(i, "gutter", "gutter-flag-bad");
        const note = document.createElement("div");
        note.className = "flag-note"; note.textContent = ref.premise;
        widgets.push(cm.addLineWidget(i, note));
    }
}

let paintedKey = "";
function repaintNames(parsed, refusals) {
    localNames = new Set([...namesOf(parsed), ...siblingNames]);
    slotNames = new Set(Object.keys(axisOf || {}));
    for (const m of [layoutDecls, parsed && parsed.declarations])
        for (const [, d] of (m || new Map()))
            for (const a of (d.params || [])) slotNames.add(a);
    for (const axes of Object.values(protoAxes || {}))
        for (const a of Object.keys(axes)) slotNames.add(a);
    jumpable = new Set([...layoutDecls.keys(), ...Object.keys(vocabulary),
                        ...Object.keys(language.names || {})]);
    unresolved = new Set();
    // nothing in the layout resolves to a world name, and marking it all as
    // unknown would paint the operator's own document as a mistake
    for (const ref of (active === layoutFile ? [] : refusals || [])) {
        const m = ref.premise.match(/\b([A-Z]\w*)(?:\.\w+)? resolves to nothing|the name ([A-Z]\w*) resolves/);
        if (m) unresolved.add(m[1] || m[2]);
    }
    const key = [...localNames].sort().join(",") + "|" + [...unresolved].sort().join(",");
    if (key !== paintedKey) { paintedKey = key; cm.setOption("mode", "gate-swift"); }
}

async function render() {
    const text = editor.value;
    // ── WHICH COURT READS THIS FILE IS WHAT THE ROW SAYS, and the page had one
    // reading for everything. The plain court reads a world of facts and refuses
    // a typealias standing outside every declaration — correctly, and the CLI
    // does the same. The `where` court reads certificates, so top-level names
    // are its whole subject. Reading a forms file with the plain court gave a
    // parse with no names in it at all: the palette's hundred and eighty-three
    // records came back as zero, and every one of them as a refusal nobody saw
    // because a shelf file is read rather than judged.
    // The layout is in the same position: its court is the guards, not the plain
    // one — it declares protocols, which the plain court refuses on sight — and
    // reading it plainly threw away the one thing its rows are made of, the
    // `typeName` string that says which file each claim is about.
    const byWhere = viewingShelf !== null || formsFiles.has(active) || active === layoutFile;
    const local = judge(active || "gate.swift", text,
                        byWhere ? { seeds: new Set(), generics: new Set() } : undefined);
    lastParsed = local.parsed;
    if (viewingShelf) {
        repaintNames(local.parsed, []);          // names highlight; nothing refuses
        clearFlags();
        badFiles = new Set(); buildRail();
        document.getElementById("status").innerHTML = refLabel
            ? refLabel
            : "<b>" + viewingShelf + ".swift</b> · a printout of what the judge carries, theirs, read-only";
        document.getElementById("chips").innerHTML =
            '<span class="chip" style="background:var(--mist);color:var(--muted)">reference</span>';
        document.getElementById("next").textContent = "";
        document.getElementById("verdicts").innerHTML = "";
        applyMyBench();
        return;
    }
    let r;
    if (files.length > 1) {
        r = await (await fetch("/verdict?f=" + encodeURIComponent(active), { method: "POST", body: text })).json();
        // the width travels with the verdict: `holds` over three files says
        // nothing until it says over how much
        r.wide = r.premises; r.declarations = files.length + " files";
        r.premises = "judged together"; r.milliseconds = r.judge_ms || 0;
        r.refusals = r.refusals.map(x => { const [f, line] = x.address.split(":"); return { file: f, line: +line, premise: x.claim }; });
    } else {
        r = local; r.refusals = r.refusals.map(x => ({ file: active, line: x.line, premise: x.premise }));
    }
    lastRefusals = r.refusals;
    repaintNames(local.parsed, r.refusals);
    document.getElementById("status").innerHTML =
        (files.length > 1
            ? "<b>" + r.declarations + "</b> " + r.premises
              + (r.wide ? " · <b>" + r.wide + "</b> claims checked" : "")
            : "<b>" + r.declarations + "</b> declarations · <b>" + r.premises + "</b> claims checked")
        + " · " + (+r.milliseconds).toFixed(1) + " ms"
        + (benchStale ? '<span class="stale">' + benchStale + "</span>" : "");
    const pending = r.refusals.filter(x => /states none/.test(x.premise));
    const broken = r.refusals.filter(x => !/states none/.test(x.premise));
    // a refusal and a decision are different things and neither hides the other.
    // One chip that showed whichever came first made the slots waiting on you
    // vanish the moment something broke — which is exactly when there is most to
    // decide.
    const waits = pending.length
        ? '<span class="chip" style="background:color-mix(in srgb,var(--law) 15%,transparent);color:var(--law)" title="'
            + pending.length + ' slots are not filled in yet. Nothing disagrees, the record is just unfinished.">'
            + pending.length + ' to fill</span>'
        : "";
    // ── ONE HOLDER, BECAUSE THE VERDICT IS SOMETIMES TWO CHIPS. This replaced
    // the element with the id by TWO elements and only the first kept the id,
    // so every later render replaced the verdict and left the previous `to
    // fill` standing beside it — thirteen of them across the bar after thirteen
    // keystrokes, each one a truthful count of the same five slots. Writing
    // into a holder replaces everything that was said, which is what saying it
    // again should mean.
    document.getElementById("chips").innerHTML = (broken.length
        ? '<span class="chip bad" title="' + broken.length
            + ' claims disagree with the rest. Each is listed below, with its line.">refuses '
            + broken.length + '</span>'
        : '<span class="chip ok" title="Every claim in these files agrees with every other one.">holds</span>')
        + waits;
    clearFlags(); applyFlags(r.refusals);
    showNext();
    badFiles = new Set(r.refusals.map(x => x.file || active).filter(Boolean));
    buildRail();
    // the verdict list, docked at the bottom (Xcode status): disagreements
    // first, then the slots still to fill, calmer
    const v = document.getElementById("verdicts");
    v.innerHTML = "";
    const rowFor = (ref, cls) => {
        const row = document.createElement("div");
        row.className = cls;
        // a "states none" claim reads plainly: which record owes which axis
        const m = /requires (\w+): (\w+) states none/.exec(ref.premise);
        const label = m ? m[2] + " · " + m[1] + " is not filled in yet" : ref.premise;
        // the address is a fact like any other address; the judge's sentence is
        // speech, and a slot still to fill speaks in the second voice — it is
        // not a disagreement, so it never wears the first
        row.innerHTML = '<code class="fact">' + (ref.file || active) + ":" + ref.line
            + '</code><span class="' + (cls === "pending" ? "caption" : "speech") + '">' + label + "</span>";
        row.onclick = async () => {
            navFrom = navHere();
            const target = ref.file && files.includes(ref.file) ? ref.file : active;
            if (target !== active) await loadFile(target);
            reveal(ref.line);
        };
        return row;
    };
    for (const ref of broken) v.appendChild(rowFor(ref, "refusal"));
    if (pending.length) {
        const head = document.createElement("div");
        head.className = "pending-head caption";
        head.textContent = pending.length + (pending.length === 1 ? " slot" : " slots") + " to fill";
        v.appendChild(head);
        for (const ref of pending) v.appendChild(rowFor(ref, "pending"));
    }
    const guards = benchGuards();
    if (guards.length) {
        const head = document.createElement("div");
        head.className = "pending-head caption";
        head.textContent = "the bench's own forms";
        v.appendChild(head);
        for (const g of guards) {
            const row = document.createElement("div");
            row.className = "pending";   // guarded, not judged: addressed, calm, never the red a fact earns
            row.innerHTML = '<code class="fact">' + g.file + ":" + g.line + '</code><span class="caption">' + esc(g.decl + "." + g.axis)
                + " = " + esc(g.value) + " · the bench's own forms state " + esc(g.allowed) + "</span>";
            row.onclick = async () => {
                navFrom = navHere();
                if (g.file !== active && files.includes(g.file)) await loadFile(g.file);
                reveal(g.line);
            };
            v.appendChild(row);
        }
    }
    if (mode === "table") buildTables();
    if (mode === "bare") document.getElementById("bare").innerHTML = bareForm(lastParsed, cm.getValue());
    applyMyBench();     // and so does the theme
}

// the one step that comes next, chosen by what this repository already has —
// the same sentence the CLI ends with, so the bench and the terminal agree
let nextShown = "";
async function showNext() {
    try {
        const st = await (await fetch("/status")).json();
        const line = st.next || "";
        if (line === nextShown) return;
        nextShown = line;
        const host = document.getElementById("next");
        host.textContent = line ? "next: " + line : "";
        // the command the CLI already worked out, ready to carry away. It is
        // the same string the terminal would want, with what this run knew
        // already filled in — copied, never run: the Enter belongs to whoever
        // owns the repository, in the tools they already have open.
        const ready = st.command_to_run;
        if (!ready) return;
        const at = host.textContent.indexOf(ready);
        if (at < 0) return;
        const before = host.textContent.slice(0, at);
        const after = host.textContent.slice(at + ready.length);
        host.textContent = before;
        const chip = document.createElement("span");
        chip.className = "run"; chip.textContent = ready;
        chip.title = "Copy this. It runs in your terminal, not here: the bench "
            + "reads and judges, and nothing it shows you can change your repository.";
        chip.onclick = async () => {
            try { await navigator.clipboard.writeText(ready); } catch { return; }
            chip.classList.add("took");
            setTimeout(() => chip.classList.remove("took"), 1200);
        };
        host.appendChild(chip);
        host.appendChild(document.createTextNode(after));
    } catch { }
}

// the honest state: has the working-copy file drifted from git, or is it committed
async function refreshGit() {
    const el = document.getElementById("gitstate");
    try {
        const g = (await (await fetch("/gitstatus?f=" + encodeURIComponent(active))).json()).git;
        el.className = g === "committed" ? "committed" : "modified";
        el.innerHTML = '<span class="g"></span>' + (g === "committed" ? "committed"
            : g === "untracked" ? "not in git yet" : "not committed yet");
    } catch { el.className = ""; el.textContent = ""; }
}

// ── the Table surface: the ACTIVE file projected as relations, so all three
// views (Full · Bare · Table) show the same file. Cross-file names still jump
// (declFile) and the wave still respects siblings; only the projection is
// per-file, matching the code. ──
function activeDecls() { return lastParsed ? lastParsed.declarations : new Map(); }
function tableGroups() {
    if (!lastParsed) return [];
    const buckets = new Map();
    for (const d of activeDecls().values()) {
        if (d.aliases.size === 0) continue;
        const keys = [...d.aliases.keys()].sort();
        const sig = d.conformances.join("+") + " · " + keys.join(",");
        if (!buckets.has(sig)) buckets.set(sig, { conformances: d.conformances, keys, rows: [] });
        buckets.get(sig).rows.push(d);
    }
    const groups = [...buckets.values()].filter(g => g.rows.length >= 2);
    for (const g of groups) g.rows.sort((a, b) => a.line - b.line);
    groups.sort((a, b) => a.rows[0].line - b.rows[0].line);
    return groups;
}
function layoutOrActive() { return layoutDecls.size ? layoutDecls : (lastParsed ? lastParsed.declarations : new Map()); }

// the ledgers: declarations whose body is a list of gate entries (VerifiedView,
// VerifiedInDepartment …). Each becomes a table of the entry's arguments.
function ledgerGroups() {
    const out = [];
    for (const [name, d] of activeDecls()) {
        const entries = (d.entries || []).filter(e => e.args && e.args.length);
        if (entries.length < 2) continue;
        const byHead = new Map();
        for (const e of entries) {
            if (!byHead.has(e.head)) byHead.set(e.head, []);
            byHead.get(e.head).push(e);
        }
        for (const [head, es] of byHead)
            if (es.length >= 2) out.push({ owner: name, head, cols: es[0].args.length, rows: es });
    }
    return out;
}

// the landing is visible: the whole line selected, a brief flash, scrolled with margin
let navBack = [], navForward = [], navMuted = false, navFrom = null, compScaffold = null;
// a place is a file, a view, and a spot in it — the view is part of where you were
function navHere() { return { file: active, mode, pos: cm.getCursor() }; }
function updateNavButtons() {
    const b = document.getElementById("nav-back"), f = document.getElementById("nav-fwd");
    if (b) b.disabled = !navBack.length;
    if (f) f.disabled = !navForward.length;
}
function recordJump(from) {
    // a real jump only: same spot is not history
    if (navMuted) return;
    if (from && (from.file !== active || Math.abs(from.pos.line - cm.getCursor().line) > 1)) {
        navBack.push(from); navForward = [];
    }
    updateNavButtons();
}
async function navGo(stackFrom, stackTo) {
    if (!stackFrom.length) return;
    stackTo.push(navHere());
    const there = stackFrom.pop();
    navMuted = true;
    if (there.file && there.file !== active && files.includes(there.file)) await loadFile(there.file);
    setMode(there.mode || "full");          // restore the view before the spot in it
    cm.setCursor(there.pos);
    if (there.mode !== "bare" && there.mode !== "table") { cm.scrollIntoView(there.pos, 120); cm.focus(); }
    navMuted = false;
    updateNavButtons();
}

function reveal(line) {
    const from = navFrom || navHere();      // set before a file switch, if any
    navFrom = null;
    setMode("full");
    const local = Math.max(0, Math.min(line - 1, cm.lineCount() - 1));
    cm.focus();
    cm.setSelection({ line: local, ch: 0 }, { line: local, ch: cm.getLine(local).length });
    cm.scrollIntoView({ line: local, ch: 0 }, 120);
    cm.addLineClass(local, "background", "line-flash");
    setTimeout(() => cm.removeLineClass(local, "background", "line-flash"), 1200);
    recordJump(from);
}

async function jumpTo(name) {
    navFrom = navHere();
    const f = declFile.get(name);
    if (f && f !== active) await loadFile(f);   // a name in another file opens that file
    const d = layoutOrActive().get(name);
    if (d) return reveal(d.line);
    const mod = vocabulary[name];               // a name from a forms file: open the forms file
    if (mod) return openShelf(mod, name);
    // and the floor: a word of the language, declared in the corpus at the
    // revision the judge was built from. The file is not here — gate fetches
    // nothing — so what is said is exactly where it is and how to get it.
    const at = (language.names || {})[name];
    if (at) return language.present ? openLanguage(name, at) : sayLanguage(name, at);
}

// shown, for whoever has the corpus: the declaration itself, read-only, in the
// register everything of somebody else's wears here
async function openLanguage(name, line) {
    const text = await (await fetch("/language?f=" + encodeURIComponent(language.file))).text()
        .catch(() => null);
    if (text === null) return sayLanguage(name, line);
    // read as theirs: nothing here is this world's to be judged for
    active = ""; viewingShelf = language.file;
    refLabel = "<b>" + esc(language.file.split("/").pop()) + "</b> · the language, declared in the "
        + "corpus" + (language.short ? " at " + esc(language.short) : "") + " · theirs, read-only";
    document.getElementById("fname").textContent = language.file.split("/").pop();
    document.getElementById("fname").style.display = "";
    cm.setValue(text);
    cm.setOption("readOnly", true);
    buildRail();
    reveal(line);   // a line was asked for, so this one takes Full and says so
    say(esc(name) + " is a word of the language, declared here: "
        + esc(language.file) + ":" + line + ", in the corpus this judge was built from"
        + (language.short ? " (" + esc(language.short) + ")" : "")
        + ". Read-only: nothing of theirs is this world's to edit.");
}

// a word of the language, named rather than opened: which file, which line,
// which revision, and the command that brings the corpus to this machine
// ── AND THE ANSWER THAT CARRIES A COMMAND IS NOT AN ANSWER THAT CAN EXPIRE. This
// was five hundred characters on a three-second timer, with the command escaped as
// markup into a sink that prints text, so a reader saw `<code>` and had no time to
// read the rest. The sentence goes where the cursor speaks and stays; the command
// goes where every other command on this page goes, one click to the clipboard.
function sayLanguage(name, line) {
    const el = document.getElementById("inspect");
    el.textContent = name + " is a word of the language, declared in "
        + language.file + ":" + line
        + (language.short ? " of the corpus at " + language.short : " of the corpus")
        + ". gate fetches nothing, so that file is not here:";
    el.dataset.answer = "1";
    const chip = document.createElement("span");
    chip.className = "run"; chip.textContent = language.command;
    chip.title = "Copy this. It runs in your terminal, not here.";
    chip.onclick = async () => {
        try { await navigator.clipboard.writeText(language.command); } catch { return; }
        chip.classList.add("took");
        setTimeout(() => chip.classList.remove("took"), 1200);
    };
    el.append(" ", chip);
}

// the shelf, read-only: where the names your world speaks are declared
async function openShelf(mod, name) {
    const text = await (await fetch("/shelf?m=" + encodeURIComponent(mod))).text();
    active = ""; viewingShelf = mod; refLabel = null;   // reference, not one of your files
    document.getElementById("fname").textContent = mod + ".swift";
    document.getElementById("fname").style.display = "";
    // ── AND THE VIEW IS THE READER'S. Opening somebody's page threw the reader back
    // to Full whatever they had been reading in: pick Bare or Table, click a shelf
    // page or a seam side, and the choice was gone. The page keeps whatever view is
    // open, and a page that states its own first view still gets it. Only following
    // a name to a line takes Full, because a line is what was asked for, and the way
    // back restores the view with the place.
    setMode(opensAs[mod] || opensAs[mod + ".swift"] || mode);
    cm.setValue(text);
    cm.setOption("readOnly", true);
    buildRail();
    // the bar already says what this is; the line says the one thing the bar
    // cannot fit — that a copy of it is not a source
    say("Your world speaks these words with no file of this name beside it, and editing a "
        + "copy adds none to the language. `gate stdlib materialize " + mod + "` to read it offline.");
    if (name) {
        const i = text.split("\n").findIndex(l => new RegExp("\\b" + name + "\\b").test(l)
            && /^\s*(public\s+)?(enum|protocol|struct|typealias)/.test(l));
        if (i >= 0) reveal(i + 1);
    }
}

// one side of a seam, read-only: it belongs to whoever declared it, and this
// world is not the place to edit somebody's word about an agreement
async function openSeamSide(file, name) {
    const text = await (await fetch("/seamside?f=" + encodeURIComponent(file))).text();
    active = ""; viewingShelf = file;
    refLabel = "<b>" + esc(file) + "</b> · one side of a seam, as its own side wrote it "
        + "· theirs, read-only";
    document.getElementById("fname").textContent = file;
    document.getElementById("fname").style.display = "";
    setMode(opensAs[file] || mode);
    cm.setValue(text);
    cm.setOption("readOnly", true);
    buildRail();
    if (name) {
        const i = text.split("\n").findIndex(l => new RegExp("· " + name + "$").test(l));
        if (i >= 0) reveal(i + 2);
    }
}

// the answer itself: a closed question with one kind of answer, asked where the
// value stands. No dialog, no second place to look — the cell becomes the field.
async function sayValue(name, now, cell) {
    const box = document.createElement("input");
    box.type = "text"; box.value = String(now); box.className = "fact cell-input";
    cell.textContent = ""; cell.appendChild(box); box.focus(); box.select();
    const done = async (commit) => {
        const want = box.value.trim();
        box.remove(); cell.textContent = String(now);
        if (!commit || want === String(now) || !/^\d+$/.test(want)) return;
        const r = await fetch("/value?name=" + encodeURIComponent(name) + "&to=" + want,
                              { method: "PUT" });
        const said = await r.json().catch(() => ({}));
        // ── AND A REFUSAL DOES NOT TAKE ITSELF AWAY. This one went into a bar that
        // vanished after three seconds, in a tool whose whole claim is that a refusal
        // is an address you can point at and read twice. It goes where every other
        // refusal on this page goes, and the cell it is about wears the mark.
        if (!r.ok) {
            cell.classList.add("cell-bad");
            const v = document.getElementById("verdicts");
            v.innerHTML = '<div class="refusal"><code>' + esc(name) + "</code> · "
                + esc(said.note || "that value could not be written") + "</div>";
            return;
        }
        // and it is judged from here, like everything else typed on this page:
        // the file it was written in opens at the line, with the verdict under it
        try {
            const fl = await (await fetch("/files")).json();
            files = fl.files || []; overridden = fl.overridden || {};
            formsFiles = new Set(fl.forms || []);
            opensAs = fl.opens || {};
            seamRows = fl.seams || [];
        } catch { }
        buildRail();
        await loadFile(said.file);
        reveal(said.line);
    };
    box.onkeydown = (e) => {
        if (e.key === "Enter") { e.preventDefault(); done(true); }
        if (e.key === "Escape") { e.preventDefault(); done(false); }
    };
    box.onblur = () => done(false);
}

    const badLines = new Set(lastRefusals.map(r => r.line));
    const groups = tableGroups();

    if (!groups.length && !ledgers.length && !values.length) {
        host.innerHTML = '<h3>no relations to project</h3>'; return;
    }
    // ── THE VALUES OF THIS WORLD, WHICH ARE RECORDS LIKE ANY OTHER. A world of
    // numbers — a palette, a ladder, a set of registers — says them as names at
    // file scope, and the table had no row for that shape, so opening the
    // palette said "no relations to project" about a hundred and eighty-three
    // facts. And the answer to "why is this different here" is owed AT the
    // value: where somebody's own declaration stands in place of the one that
    // shipped, the row says what it was and whose shelf it came from. That is a
    // column on a form that already exists, not a badge somewhere else.

            // it" clean off the right edge with the spelling of the answer. What

            // hand. Answering here writes the declaration in that file — never
            // in the world that shipped the name, which is not this world's to

        const head = document.createElement("tr");

        // stood under nothing at all. It had been that way since the note column
        // arrived, because a table with a note in it is rare and nobody looked.
        //
        // A check would have caught it once. This cannot happen again: there is
        // one list, and the head and the row both walk it — a disagreement is no
        // longer a bug to notice, it is a thing there is no way to write. Which
        // is what this whole tool sells, turned on its own page.
        //
        // The hand goes last, and that is the order to want as well: a note is
        // read far more often than a record is removed, and a destructive
        // control had been standing between the facts and the sentence.
        // ── AND WHETHER A SEAM HOLDS, AT THE CLAIM THAT CONCLUDED IT. A seam is
        // a file this world took, so it is a row here like any other, and its
        // state is a fact about that row rather than a zone in a side panel:

                td.textContent = shownTerm(raw);
                if (td.textContent !== raw) td.title = raw;
                if (badLines.has(d.line)) td.classList.add("cell-bad");
                // the same closed question the bare view asks, in a cell: the kind
                // comes from the group's own signature, so a column offers exactly

                const a = d.aliases.get(key);
                if (a) {
                    td.classList.add("slot");
                    td.onclick = () => {

            table.append(tr);
            // WHAT THE COUNT COUNTS, one click below it. Not another view and not
            // a panel: the rows the number is about, under the row that carries
            // the number, each opening the side that WROTE it — the contract
            // where the contract stated it, the library where the library
            // claimed it. Neither side is this world's to edit from here.
            const s = seamRow(d);
            if (s && openSeam === d.name && !s.alone) {
                // THREE OF THESE ARE STATES AND TWO ARE NOT. `parted` and the two
                // words are the three counts an address can have — nothing fits,
                // one thing fits, anything fits — read from whichever end owes
                // the sentence. `taken as given` is not a state at all: it is
                // somebody SUPPLYING the agreement the two sides never derived,
                // by hand, with the thing they cited standing as its term. And
                // `came back` is that term expiring — the supplied premise
                // withdrawn, so the address stands at whatever it always was.
                const items = [
                    ...(s.expired || []).map(x => [x, "came back"]),
                    ...(s.parted || []).map(x => [x, "parted"]),
                    ...(s.waits_on_you || []).map(x => [x, "your word"]),

                    "your word": "The other side states this. This side has not said whether it "
                        + "carries it, so anything would still fit, and that is what makes it "
                        + "open rather than broken.",
                    "their word": "This side carries this. The other side has never stated it.",
                    "taken as given": "Neither side changed. Somebody supplied the agreement by "
                        + "hand and cited something that can close, which is what gives this a "
                        + "term. When the thing cited closes, the exception is gone.",
                    "came back": "It was taken as given, and the thing that was cited has "
                        + "closed. The supplied agreement is withdrawn, so this stands again.",
                };
                {
                    // how much of the agreement is actually held, which is what
                    // being integrated with somebody amounts to — a count, not a

                    // anywhere: a seam has two ends and neither is above the other.
                    const r = document.createElement("tr");

                    r.className = "seam-line";
                    const a = document.createElement("td");
                    a.className = "fact"; a.colSpan = Math.max(1, columns.length - 1);
                    // the field is the thing spoken of and stands in ink; the

                    const cut = x.address.lastIndexOf(" · ");
                    a.innerHTML = (cut < 0 ? "" :
                        '<span class="seam-where">' + esc(x.address.slice(0, cut + 3)) + "</span>")
                        + esc(cut < 0 ? x.address : x.address.slice(cut + 3));
                    a.style.cursor = "pointer";
                    a.onclick = () => openSeamSide(kind === "your word" ? s.contract_file : s.carrier_file,
