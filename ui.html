<!-- gate ui — the world bench, v1: the playground's editor shell moved in.
     CodeMirror with the Xcode-light mode, declared-name highlighting (an
     undeclared name gets the wave), gutter flags and under-line notes on
     refusals, click-to-jump cards, the Full·Bare view pill, the declared
     file layout, and the cross-file verdict over unsaved text. -->
<meta charset="utf-8"><title>gate · world bench</title>
<link rel="stylesheet" href="/codemirror.css">
<style>
:root{--ok:#248A3D;--bad:#C4453B;--action:#007AFF;--line:#d2d2d7;--mist:#f5f5f7;--ink:#1d1d1f;color-scheme:light}
body{font:14px/1.45 -apple-system,sans-serif;margin:0;color:var(--ink);background:#fff;display:flex;height:100vh}
#rail{flex:0 0 176px;display:none;flex-direction:column;border-right:1px solid var(--line);overflow:auto;min-width:0}
#rail h3{font:600 10.5px/1 -apple-system,sans-serif;letter-spacing:.08em;text-transform:uppercase;color:#8e8e93;margin:0;padding:1em 1.1em .6em}
.file{display:flex;align-items:center;gap:.5em;padding:.32em 1.1em;cursor:pointer;font:13px/1.4 ui-monospace,Menlo,monospace;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.file:hover{background:var(--mist)}
.file.on{background:var(--mist);font-weight:600}
.file .dot{flex:0 0 6px;width:6px;height:6px;border-radius:50%;background:transparent}
.file.bad{color:var(--bad)}
.file.bad .dot{background:var(--bad)}
#left{flex:0 0 46%;display:flex;flex-direction:column;border-right:1px solid var(--line);min-width:0}
#bar{display:flex;gap:.6em;align-items:center;padding:.5em .8em;border-bottom:1px solid var(--line)}
#bar b{font-weight:600}
#save{margin-left:auto;border:none;background:color-mix(in srgb,var(--action) 12%,transparent);color:var(--action);padding:.35em .9em;border-radius:6px;font:inherit;cursor:pointer}
#save:disabled{opacity:.4;cursor:default}
#editor-host{flex:1;min-height:0}
.CodeMirror{height:100%;font:12.5px/19px ui-monospace,Menlo,monospace}
.CodeMirror-linenumber{color:#8e8e93}
.cm-keyword{color:#9B2393;font-weight:600}
.cm-string{color:#C41A16}
.cm-comment{color:#5D6C79}
.cm-attribute{color:#947100}
.cm-localtype{color:#0B4F79}
.cm-knownname{color:#3900A0}
.cm-badname{text-decoration:underline wavy var(--bad);text-underline-offset:3px}
.cm-ghost{color:#a6a6ab}
.line-flag-bad{background:color-mix(in srgb,var(--bad) 6%,transparent)}
.gutter-flag-bad .CodeMirror-linenumber{color:var(--bad);font-weight:700}
.flag-note{font:11px/1.5 -apple-system,sans-serif;color:var(--bad);background:color-mix(in srgb,var(--bad) 8%,transparent);padding:.1em .8em .1em 2.4em}
#bare{flex:1;display:none;font:12.5px/19px ui-monospace,Menlo,monospace;padding:.8em;white-space:pre;overflow:auto;margin:0;color:#3a3a3c}
#view .v{border:1px solid var(--line);background:#fff;font:inherit;padding:.15em .7em;cursor:pointer}
#view .v.on{background:var(--mist);font-weight:600}
#view .v:first-child{border-radius:6px 0 0 6px}#view .v:last-child{border-radius:0 6px 6px 0;border-left:none}
#right{flex:1;overflow:auto;padding:1em 1.2em}
#verdict{margin:.2em 0 1em}
.chip{display:inline-block;padding:.25em .8em;border-radius:99px;font-weight:600}
.chip.ok{background:color-mix(in srgb,var(--ok) 12%,transparent);color:var(--ok)}
.chip.bad{background:var(--bad);color:#fff}
.card{border:1px solid var(--bad);border-radius:8px;padding:.5em .8em;margin:.5em 0;cursor:pointer}
.card code{color:var(--bad)}
table{border-collapse:collapse;margin:.4em 0 1.2em}
td,th{border:1px solid var(--line);padding:.25em .7em;text-align:left}
th{background:var(--mist);font-weight:600}
tr.bad td{color:var(--bad)}
h2{font-size:1em;margin:1em 0 .2em}
#meta{color:#6e6e73;font-size:.85em}
</style>
<div id="rail"><h3>files</h3><div id="filelist"></div></div>
<div id="left">
  <div id="bar"><b id="fname">world.swift</b><span id="view"><button class="v on" data-v="full">Full</button><button class="v" data-v="bare">Bare</button></span><span id="meta"></span><button id="save" disabled>Save</button></div>
  <div id="editor-host"></div>
  <pre id="bare"></pre>
</div>
<div id="right">
  <div id="verdict"></div>
  <div id="cards"></div>
  <h2>People</h2><div id="people"></div>
  <h2>Grants</h2><div id="grants"></div>
</div>
<script src="/codemirror.js"></script>
<script src="/judge.js"></script>
<script>
const keywordSet = new Set(["public", "enum", "protocol", "typealias", "extension",
    "where", "static", "var", "some", "associatedtype", "import", "struct", "let", "func"]);
let localNames = new Set();     // declared across ALL layout files
let unresolved = new Set();     // names the JUDGE reports resolve to nothing — the wave is its voice, not a vocabulary

CodeMirror.defineMode("gate-swift", () => ({
    token: (stream) => {
        if (stream.match("//")) { stream.skipToEnd(); return "comment"; }
        if (stream.match('"')) {
            while (!stream.eol()) { if (stream.next() === '"') break; }
            return "string";
        }
        if (stream.match(/^@[A-Za-z]+/)) return "attribute";
        if (stream.match(/^[A-Za-z_][A-Za-z0-9_]*/)) {
            const word = stream.current();
            if (word === "self" || keywordSet.has(word)) return "keyword";
            if (/^[A-Z]/.test(word)) {
                if (unresolved.has(word)) return "badname";   // only what the judge could not resolve
                if (stream.string[stream.start - 1] === ".") return "knownname";
                if (localNames.has(word)) return "localtype";
                return "knownname";   // external/kit names are known, not broken
            }
            return null;
        }
        if (stream.match(/^[<>,.]/)) return "ghost";
        stream.next();
        return null;
    },
}));

const cm = CodeMirror(document.getElementById("editor-host"), {
    value: "", mode: "gate-swift", lineNumbers: true, indentUnit: 4,
    viewportMargin: Infinity, dragDrop: false,
});
const editor = {   // the playground's shim: every reader stays honest
    get value() { return cm.getValue(); },
    set value(next) { cm.setValue(next); },
};
const saveBtn = document.getElementById("save");
let clean = "";
let files = [];
let active = "";
let badFiles = new Set();      // files the judge names a refusal in — the rail's dot
let siblingNames = new Set();  // declarations of the OTHER layout files
let layoutDecls = new Map();   // declarations across the WHOLE layout, for the tables
let widgets = [];

function buildRail() {
    const list = document.getElementById("filelist");
    list.innerHTML = "";
    for (const f of files) {
        const row = document.createElement("div");
        row.className = "file" + (f === active ? " on" : "") + (badFiles.has(f) ? " bad" : "");
        row.innerHTML = '<span class="dot"></span>' + f;
        row.onclick = () => loadFile(f);
        list.appendChild(row);
    }
}

function namesOf(parsed) {
    const out = new Set();
    for (const [name, d] of parsed.declarations) {
        out.add(name);
        for (const c of d.conformances) out.add(c);
        for (const [k] of d.aliases) out.add(k);
        for (const e of (d.entries || [])) { out.add(e.head); (e.arguments || []).forEach(a => out.add(a)); }
    }
    for (const [name] of (parsed.topAliases || new Map())) out.add(name);
    return out;
}

function clearFlags() {
    widgets.forEach(w => w.clear());
    widgets = [];
    for (let i = 0; i < cm.lineCount(); i++) {
        cm.removeLineClass(i, "background", "line-flag-bad");
        cm.removeLineClass(i, "gutter", "gutter-flag-bad");
    }
}

function applyFlags(refusals) {
    for (const ref of refusals) {
        if ((ref.file || active) !== active) continue;
        const i = ref.line - 1;
        if (i < 0 || i >= cm.lineCount()) continue;
        cm.addLineClass(i, "background", "line-flag-bad");
        cm.addLineClass(i, "gutter", "gutter-flag-bad");
        const note = document.createElement("div");
        note.className = "flag-note";
        note.textContent = ref.premise;
        widgets.push(cm.addLineWidget(i, note));
    }
}

let paintedKey = "";
function repaintNames(parsed, refusals) {
    localNames = new Set([...namesOf(parsed), ...siblingNames]);
    // the wave speaks the judge: a name waves iff a refusal says it resolves to nothing
    unresolved = new Set();
    for (const ref of (refusals || [])) {
        const m = ref.premise.match(/\b([A-Z]\w*)(?:\.\w+)? resolves to nothing|the name ([A-Z]\w*) resolves/);
        if (m) unresolved.add(m[1] || m[2]);
    }
    const key = [...localNames].sort().join(",") + "|" + [...unresolved].sort().join(",");
    if (key !== paintedKey) { paintedKey = key; cm.setOption("mode", "gate-swift"); }
}

async function render() {
    const text = editor.value;
    let r;
    const local = judge(active || "world.swift", text);
    if (files.length > 1) {
        r = await (await fetch("/verdict?f=" + encodeURIComponent(active), { method: "POST", body: text })).json();
        r.declarations = "list of " + files.length; r.premises = "cross-file";
        r.milliseconds = r.judge_ms || 0;
        r.refusals = r.refusals.map(x => {
            const [f, line] = x.address.split(":");
            return { file: f, line: parseInt(line), premise: x.claim };
        });
        r.parsed = local.parsed;
    } else {
        r = local;
        r.refusals = r.refusals.map(x => ({ file: active, line: x.line, premise: x.premise }));
    }
    repaintNames(local.parsed, r.refusals);
    document.getElementById("meta").textContent =
        r.declarations + " declarations · " + r.premises + " premises · " + (+r.milliseconds).toFixed(1) + " ms";
    const v = document.getElementById("verdict");
    v.innerHTML = r.refusals.length
        ? '<span class="chip bad">refuses ' + r.refusals.length + '</span>'
        : '<span class="chip ok">holds: every claim checked</span>';
    clearFlags();
    applyFlags(r.refusals);
    badFiles = new Set(r.refusals.map(x => x.file || active).filter(Boolean));
    buildRail();
    const cards = document.getElementById("cards");
    cards.innerHTML = "";
    const badLines = new Set();
    for (const ref of r.refusals) {
        if ((ref.file || active) === active) badLines.add(ref.line);
        const c = document.createElement("div");
        c.className = "card";
        c.innerHTML = "<code>" + (ref.file || active) + " : " + ref.line + "</code> · " + ref.premise;
        c.onclick = async () => {
            const target = ref.file && files.includes(ref.file) ? ref.file : active;
            if (target !== active) await loadFile(target);
            cm.setCursor({ line: ref.line - 1, ch: 0 });
            cm.scrollIntoView({ line: ref.line - 1, ch: 0 }, 120);
            cm.focus();
        };
        cards.appendChild(c);
    }
    // tables draw from the whole layout (people may live in another file)
    const decls = layoutDecls.size ? layoutDecls : r.parsed.declarations;
    const axes = ["Rank", "Home", "Site", "Given", "Family", "Born"];
    let ph = "<table><tr><th>id</th>" + axes.map(a => "<th>" + a.toLowerCase() + "</th>").join("") + "</tr>";
    for (const [name, d] of decls) {
        if (!d.conformances.includes("Employee")) continue;
        ph += "<tr" + (near(badLines, d.line, 9) ? ' class="bad"' : "") + "><td>" + name + "</td>" +
              axes.map(a => "<td>" + ((d.aliases.get(a) || {}).target || "") + "</td>").join("") + "</tr>";
    }
    document.getElementById("people").innerHTML = ph + "</table>";
    let gh = "<table><tr><th>who</th><th>doc</th></tr>";
    for (const [, d] of decls) for (const e of (d.entries || [])) {
        if (e.head !== "VerifiedView" || !e.arguments || e.arguments.length < 2) continue;
        gh += "<tr" + (near(badLines, e.line, 4) ? ' class="bad"' : "") + "><td>" +
              e.arguments[0] + "</td><td>" + e.arguments[1] + "</td></tr>";
    }
    document.getElementById("grants").innerHTML = gh + "</table>";
    saveBtn.disabled = editor.value === clean;
    if (bareEl.style.display === "block") bareEl.textContent = bareOf(editor.value);
}

function near(badLines, line, span) {
    for (const b of badLines) if (Math.abs(b - line) <= span) return true;
    return false;
}

// bare Swift: the same language with the ceremony stripped — a VIEW over
// the single source, never a second file (read-only projection, v0)
function bareOf(text) {
    const out = [];
    for (let line of text.split("\n")) {
        const t = line.trim();
        if (t === "}" || t === "" || t.startsWith("@") || t.startsWith("static var body")
            || t.startsWith("public static var body")) continue;
        line = line.replace(/\bpublic /, "");
        let m;
        if ((m = line.match(/^enum (\w+): ([\w, ]+) \{\}?$/)))
            out.push(m[1] + ": " + m[2]);
        else if ((m = line.match(/^protocol (\w+)(: [\w, ]+)? \{\}?$/)))
            out.push(m[1] + (m[2] || "") + " (protocol)");
        else if ((m = line.match(/^\s*(associatedtype|typealias) (\w+)( = .*)?$/)))
            out.push("  " + m[2] + (m[3] || ""));
        else if ((m = line.match(/^\s*([A-Z]\w*(?:<[^;]*)?)\.self;?\s*$/)))
            out.push("  " + m[1]);
        else if ((m = line.match(/^extension (\w+): (\w+)$/)))
            out.push(m[1] + ": " + m[2]);
        else if (t.startsWith("where "))
            out.push("  " + t);
        else if (t.startsWith("//"))
            out.push(t);
        else if (t.length)
            out.push(line);
    }
    return out.join("\n");
}

const bareEl = document.getElementById("bare");
document.querySelectorAll("#view .v").forEach(b => b.onclick = () => {
    document.querySelectorAll("#view .v").forEach(x => x.classList.remove("on"));
    b.classList.add("on");
    const bare = b.dataset.v === "bare";
    document.getElementById("editor-host").style.display = bare ? "none" : "";
    bareEl.style.display = bare ? "block" : "none";
    if (bare) bareEl.textContent = bareOf(editor.value);
});

let timer = null;
cm.on("change", () => { clearTimeout(timer); timer = setTimeout(render, 150); });

saveBtn.onclick = async () => {
    const r = await fetch("/world?f=" + encodeURIComponent(active), { method: "PUT", body: editor.value });
    if (!r.ok) { saveBtn.textContent = "save failed: " + r.status; return; }
    saveBtn.textContent = "Saved";
    setTimeout(() => { saveBtn.textContent = "Save"; }, 1200);
    clean = editor.value; render();
};

async function siblings() {
    // the declared layout, read whole: sibling names keep the wave honest, and
    // the tables draw from every file, not just the active one
    siblingNames = new Set();
    layoutDecls = new Map();
    for (const f of files) {
        const t = f === active ? editor.value
            : await (await fetch("/world?f=" + encodeURIComponent(f))).text();
        const parsed = judge(f, t).parsed;
        if (f !== active) namesOf(parsed).forEach(n => siblingNames.add(n));
        for (const [name, d] of parsed.declarations) if (!layoutDecls.has(name)) layoutDecls.set(name, d);
    }
}

async function loadFile(name) {
    active = name;
    document.getElementById("fname").textContent = name;
    buildRail();
    const t = await (await fetch("/world?f=" + encodeURIComponent(name))).text();
    editor.value = t; clean = t;
    await siblings();
    render();
}

(async () => {
    files = await (await fetch("/files")).json().catch(() => []);
    if (files.length > 1) {
        // the rail is the declared layout: File atoms of the manifest, the
        // same list the judge runs over
        document.getElementById("rail").style.display = "flex";
        document.getElementById("fname").style.display = "none";
        buildRail();
    }
    await loadFile(files[0] || "world.swift");
})();
</script>
