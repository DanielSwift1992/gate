                        ? " Cited: " + x.because + (x.state ? " (" + x.state.toLowerCase() + ")" : "")
                          + ", said by " + (x.declared_by || "somebody") + "."
                        : "") + (x.why ? " " + x.why + "." : "");
                    r.append(a, k); table.append(r);
                }
                if (!items.length) {
                    const r = document.createElement("tr");
                    r.className = "seam-line";
                    const a = document.createElement("td");
                    a.className = "caption observed"; a.colSpan = columns.length;
                    a.textContent = "nothing waits on either side";
                    r.append(a); table.append(r);
                }
            }
        }
        host.append(table);
        // add row: the form is the group's own signature, so a new row is born
        // wearing exactly the shape the rows beside it wear
        const add = document.createElement("div");
        add.className = "add caption"; add.textContent = "+ add row";
        add.onclick = () => askName(group.conformances.join(", "));
        host.append(add);
    }
}

// ── one row of views over the same file: Full · Bare · Table (· Canvas one
// day). Not two switches of one state — three views of one truth. ──
let mode = "full";
const esc = (s) => s.replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));

// Bare: the bare form — the facts with the language's ceremony gone. No enum,
// no typealias, no public, no braces; scope is indentation, the way Python
// scopes. Read-only, but a full view: highlighted, every name a link to its
// declaration, an unresolved name waving the way the editor waves.
function nameTokens(raw) {
    // wrap each Capitalized identifier: a declared name jumps, an unresolved
    // name waves, a word after a dot is an axis, the rest is a known name
    return esc(raw).replace(/(\.?)\b([A-Z][A-Za-z0-9_]*)\b/g, (m, dot, name) => {
        if (dot === ".") return dot + '<span class="known">' + name + "</span>";
        if (unresolved.has(name)) return '<span class="known bad">' + name + "</span>";
        if (layoutOrActive().has(name)) return '<span class="jump" data-jump="' + name + '">' + name + "</span>";
        return '<span class="known">' + name + "</span>";
    });
}
// ── THE ONE BRIDGE from a parsed fact to a place in the text. Everything the
// bench writes goes through here, so a slot becomes a position exactly one way
// and there is no second way to drift from. What it cannot place it refuses to
// place: the slot stays read-only and says where to go instead, because a range
// guessed at is a range overwritten. A target is never emptied on the way —
// the value is replaced whole, so `typealias X = ` never exists in the buffer.
let bareSlots = [];
function locateSlot(slot) {
    const line = slot.line - 1;                       // the parse counts from one
    if (line < 0 || line >= cm.lineCount()) return null;
    if (slot.kind === "alias") {
        const text = cm.getLine(line), eq = text.indexOf("=");
        if (eq < 0) return null;
        const m = text.slice(eq + 1).match(/^(\s*)([A-Za-z_][\w.]*)/);
        if (!m) return null;                          // no whole value to replace
        const at = eq + 1 + m[1].length;
        return { from: { line, ch: at }, to: { line, ch: at + m[2].length } };
    }
    // whole units, so nothing is ever half-removed. The same bridge: a unit is a
    // place in the text exactly the way a value is, and there is still one way to
    // find it. What the removal breaks is not guessed at either — the judge reads
    // the file again and names every reader by address, which is the honest answer.
    const wholeLines = (a, b) => b + 1 <= cm.lineCount() - 1
        ? { from: { line: a, ch: 0 }, to: { line: b + 1, ch: 0 } }
        : { from: { line: Math.max(a - 1, 0), ch: a ? (cm.getLine(a - 1) || "").length : 0 },
            to: { line: b, ch: (cm.getLine(b) || "").length } };
    if (slot.kind === "axis") return wholeLines(line, line);
    if (slot.kind === "record") {
        let depth = 0;
        for (let l = line; l < cm.lineCount(); l++) {
            for (const c of (cm.getLine(l) || "")) { if (c === "{") depth++; else if (c === "}") depth--; }
            if (depth <= 0) return wholeLines(line, l);
        }
        return null;
    }
    if (slot.kind === "entry") {
        let l = line;
        while (l < cm.lineCount() && !/\.self\s*;?\s*$/.test(cm.getLine(l) || "")) l++;
        return l < cm.lineCount() ? wholeLines(line, l) : null;
    }
    if (slot.kind === "arg") {
        let seen = -1, depth = 0, open = false;
        for (let l = line; l < cm.lineCount() && l < line + 40; l++) {
            const str = cm.getLine(l);
            for (let i = 0; i < str.length;) {
                const c = str[i];
                if (c === "<") { depth++; open = true; i++; continue; }
                if (c === ">") { depth--; if (open && depth <= 0) return null; i++; continue; }
                if (open && depth > 0 && /[A-Za-z_]/.test(c)) {
                    const w = str.slice(i).match(/^[A-Za-z_][\w.]*/)[0];
                    if (++seen === slot.index)
                        return { from: { line: l, ch: i }, to: { line: l, ch: i + w.length } };
                    i += w.length; continue;
                }
                i++;
            }
        }
    }
    return null;
}

// a chosen value goes in whole, the judge reads the file again, and the view is
// drawn from what it said — never from what we hoped it would say
// what a record still owes: the axes its kinds ask for and it has not answered.
// The same reading the offer uses, so the bench cannot show a hole the judge
// does not see, nor miss one it does — the judge says it in words of its own
// ("Person requires Site: Emp9000 states none").
function holesOf(d) {
    const stated = new Set(d.aliases.keys());
    return Object.entries(axesOfHost(d)).filter(([a]) => !stated.has(a));
}

// a hole is not text yet: nothing is written until a whole line can be written.
// The line goes in complete — axis, `=` and value together — so the buffer never
// holds `typealias X = ` for even one keystroke (I2).
function fillHole(slot, value) {
    // the line numbers must come from the SAME reading the slot was drawn from.
    // layoutDecls is a snapshot of every file and its lines go stale the moment
    // the buffer changes; taking them from there once put a whole line outside
    // the body, and the judge said so at the next keystroke.
    const d = (lastParsed && lastParsed.declarations.get(slot.host)) || layoutOrActive().get(slot.host);
    if (!d) return;
    const lines = [...d.aliases.values()].map(v => v.line);
    const anchor = (lines.length ? Math.max(...lines) : d.line) - 1;
    const at = cm.getLine(anchor);
    if (at === undefined) return;
    const head = cm.getLine(d.line - 1) || "";
    const lead = (head.match(/^\s*/) || [""])[0];
    const body = lead + "    public typealias " + slot.axis + " = " + value;
    if (!lines.length && /\{\s*\}\s*$/.test(head)) {          // an empty body opens up
        const k = head.lastIndexOf("{");
        cm.replaceRange("{\n" + body + "\n" + lead + "}",
            { line: d.line - 1, ch: k }, { line: d.line - 1, ch: head.length }, "+input");
    } else {
        cm.replaceRange("\n" + body, { line: anchor, ch: at.length }, { line: anchor, ch: at.length }, "+input");
    }
    render();
}

// ── the combinations the world has actually lived, most travelled first, and
// the forms file's own kinds after them. A new record is offered the shapes its
// neighbours already have before it is offered a shape nobody wears. ──
function livedCombos() {
    const seen = new Map();
    for (const [, d] of layoutOrActive()) {
        const c = (d.conformances || []).filter(x => protoAxes[x] || conformers[x]);
        if (!c.length) continue;
        const key = c.join(", ");
        seen.set(key, (seen.get(key) || 0) + 1);
    }
    const lived = [...seen.entries()].sort((a, b) => b[1] - a[1]).map(([k]) => k);
    const single = Object.keys(protoAxes).filter(p => !lived.includes(p));
    return [...lived, ...single];
}

// A name is the one free birth in a closed world, so it is the one place the
// bench cannot offer a list — but it can refuse: a name already declared, or one
// the judge already carries, is not written at all. Nothing enters the file
// until it is whole and free.
function nameTaken(n) {
    if (!/^[A-Z][A-Za-z0-9_]*$/.test(n)) return "a record's name begins with a capital";
    if (layoutOrActive().has(n)) return "the world already declares " + n;
    if (vocabulary[n]) return "the judge already carries " + n;
    return null;
}

let pending = null;      // the form being filled: conformances, then a name

function addRecordFlow(anchorEl) {
    compItems = livedCombos(); compChosen = 0; compSlot = null;
    compRect = anchorEl.getBoundingClientRect();
    compEl.dataset.kind = "what the record is";
    pending = { what: "record" };
    drawCompletion(true);
}

function askName(conformances) {
    const host = document.getElementById("bare");
    const row = document.createElement("div");
    row.className = "namerow";
    row.innerHTML = '<span class="caption">a name for this ' + esc(conformances) + ': </span>'
        + '<input class="fact" spellcheck="false"><span class="why caption"></span>';
    host.append(row);
    const inp = row.querySelector("input"), why = row.querySelector(".why");
    inp.focus();
    const check = () => { const w = nameTaken(inp.value.trim()); why.textContent = inp.value ? (w || "free") : ""; return !w; };
    inp.oninput = check;
    inp.onkeydown = (e) => {
        if (e.key === "Escape") { row.remove(); return; }
        if (e.key !== "Enter") return;
        if (!check()) return;                       // only a whole, free name is written
        const name = inp.value.trim();
        row.remove();
        const last = cm.lineCount() - 1;
        cm.replaceRange("\npublic enum " + name + ": " + conformances + " {}\n",
            { line: last, ch: (cm.getLine(last) || "").length },
            { line: last, ch: (cm.getLine(last) || "").length }, "+input");
        render();                                   // and its holes appear, asked one by one
    };
}

// a claim goes into a body that already exists: the form is closed, every
// argument is closed, and the whole entry is written in one edit — v1 opens no
// new bodies, it only adds to the ones the world already keeps
function addClaimFlow(host, anchorEl) {
    // only a form whose arguments have STATED kinds can be a closed question: a
    // certificate on the shelf takes bare numbers, and the bench would have
    // nothing to offer for them. What cannot be asked closed is not offered.
    compItems = Object.keys(gates).filter(g => (gates[g] || []).length && gates[g].every(Boolean));
    compChosen = 0; compSlot = null;
    compRect = anchorEl.getBoundingClientRect();
    compEl.dataset.kind = "a claim this body may hold";
    // the form keeps its own anchor: accepting a step hides the offer and clears
    // the caret's, and the next question must still open at the same place
    pending = { what: "claim", host, args: [], rect: compRect };
    drawCompletion(true);
}

function claimStep(chosen) {
    if (!pending.head) pending.head = chosen; else pending.args.push(chosen);
    const kinds = gates[pending.head] || [];
    if (pending.args.length < kinds.length) {
        const kind = kinds[pending.args.length];
        const items = fillersFor(kind, null, null) || [];
        compItems = items; compChosen = 0; compRect = pending.rect;
        compEl.dataset.kind = "a " + kind;
        drawCompletion(true);
        return;
    }
    const d = (lastParsed && lastParsed.declarations.get(pending.host)) || layoutOrActive().get(pending.host);
    // the end of the body is the brace that closes the head, and the search for a
    // place to write may NEVER pass it: a world prints `>.self` with no semicolon
    // where nothing is separated, so a scan that insisted on one ran off the end
    // of the file and wrote the claim outside every declaration. The judge said
    // so at once — "outside the fragment" — which is how this was found.
    const body = locateSlot({ kind: "record", line: d.line });
    const lastLine = body ? body.to.line - 1 : cm.lineCount() - 1;
    const entries = d.entries || [];
    let at = entries.length ? entries[entries.length - 1].line - 1 : d.line - 1;
    while (at < lastLine && !/\.self\s*;?\s*$/.test(cm.getLine(at) || "")) at++;
    if (at >= lastLine) at = Math.max(d.line - 1, lastLine - 1);   // inside, always
    const lead = ((cm.getLine(at) || "").match(/^\s*/) || [""])[0] || "            ";
    const text = "\n" + lead + pending.head + "<" + pending.args.join(", ") + ">.self";
    cm.replaceRange(text, { line: at, ch: (cm.getLine(at) || "").length },
        { line: at, ch: (cm.getLine(at) || "").length }, "+input");
    pending = null;
    render();
}

// removal is by whole units only: a record, an axis it states, a claim it holds.
// One edit, one unit — and then the judge, not the bench, says what it cost.
function removeUnit(slot) {
    const at = locateSlot(slot);
    if (!at) return;
    cm.replaceRange("", at.from, at.to, "+input");
    render();
}

function fillSlot(slot, value) {
    const at = locateSlot(slot);
    if (!at) return;
    cm.replaceRange(value, at.from, at.to, "+input");
    render();
}

// ── A note belongs to a record, not to a line. Consecutive /// lines standing
// directly above a declaration, with no blank line between, are what you wrote
// about that record; anything else breaks the run. Read off the text by the
// parse's own line numbers: the port's parse is not touched, so the judge's
// reading of the file and the bench's stay one reading. A note is read and not
// judged, so it wears the register that means exactly that. ──
function attachNotes(text, parsed) {
    const lines = text.split("\n"), notes = new Map();
    const above = (line) => {
        const out = [];
        for (let i = line - 2; i >= 0; i--) {
            const t = (lines[i] || "").trim();
            if (!t.startsWith("///")) break;      // a blank line, or code, ends the run
            out.unshift(t.slice(3).trim());
        }
        return out;
    };
    if (!parsed) return notes;
    for (const [name, d] of parsed.declarations) {
        const n = above(d.line); if (n.length) notes.set(name, n);
    }
    for (const [name, a] of (parsed.topAliases || new Map())) {
        const n = above(a.line); if (n.length) notes.set(name, n);
    }
    return notes;
}

// the comments that belong to no record: they are the document's own, and Bare
// keeps them where the document put them
function freeComments(text, notes, parsed) {
    const lines = text.split("\n"), taken = new Set(), out = [];
    const claim = (line) => { for (let i = line - 2; i >= 0; i--) {
        const t = (lines[i] || "").trim();
        if (!t.startsWith("///")) break; taken.add(i);
    } };
    if (parsed) {
        for (const [, d] of parsed.declarations) claim(d.line);
        for (const [, a] of (parsed.topAliases || new Map())) claim(a.line);
    }
    // A RUN OF LINES IS ONE PARAGRAPH. The file wraps where the file wraps;
    // that is a fact about the text, not about what is being said, and letting
    // it through turned a paragraph into a column of fragments. A blank line —
    // or anything that is not a comment — ends the run, because that is where
    // the writer themselves stopped.
    // AND TWO MARKS THE WRITER ALREADY MAKES. A section rule — `── one ──` —
    // is a heading everywhere in this repository's own source, and lines the
    // writer INDENTED inside a comment are set, not flowed: a command with its
    // continuation, a list of verbs in columns. Run through the paragraph rule
    // both were destroyed — the heading became a sentence with dashes in it and
    // the command lost the line break that made it a command. Nothing new is
    // invented here; the page reads the marks that are on the page.
    let run = null;
    lines.forEach((raw, i) => {
        const t = raw.trim();
        if (t.startsWith("//") && !taken.has(i)) {
            const body = raw.replace(/^\s*\/+/, "");
            const said = body.trim();
            // a bare `//` is where the writer stopped: it ends the paragraph
            // without ending the comment, and it is the only mark of that
            if (!said) { run = null; return; }
            // A FILE'S OWN HEADER IS NOT SOMETHING IT SAYS TO YOU. `role:` and
            // `opens:` are how a file tells this tool what it is and how it
            // asks to be met; read out as prose they became the letter's first
            // sentence — machine words in the reader's face, at the top.
            if (/^(role|opens):/i.test(said)) { run = null; return; }
            const head = said.match(/^──+\s*(.+?)\s*──+$/);
            if (head) {
                run = null;
                out.push({ line: i + 1, text: head[1], kind: "head" });
                return;
            }
            if (/^\s{4,}/.test(body)) {
                if (run && run.kind === "set") run.text += "\n" + body.replace(/^\s{1,4}/, "");
                else { run = { line: i + 1, text: body.replace(/^\s{1,4}/, ""), kind: "set" }; out.push(run); }
                return;
            }
            if (run && run.kind === "prose") run.text += " " + said;
            else { run = { line: i + 1, text: said, kind: "prose" }; out.push(run); }
        } else if (run && !t.startsWith("//")) {
            run = null;
        }
    });
    return out.filter(c => c.text);
}

// ── WHAT THE TEXT ALREADY SAYS, shown rather than spelled. A note written for
// this world names things in it, in the notation the corpus itself uses:
// `single` for a literal, ``double`` for a name. Rendering those in the name's
// own register is not decoration — it is the same fact the prose states, read
// twice. Nothing else is interpreted: a view may not add what the text lacks.
function noteProse(text) {
    return esc(text)
        .replace(/``([A-Za-z_]\w*)``/g, (_, n) => '<span class="known">' + n + "</span>")
        .replace(/`([^`]+)`/g, (_, c) => "<code>" + c + "</code>");
}

// where a record stops: the next declaration begins. Nothing else in the parse
// says it, and a record that owns the rest of the file owns other people's lines.
function recordEnd(parsed, d) {
    let end = Infinity;
    for (const [, o] of parsed.declarations)
        if (o.line > d.line && o.line < end) end = o.line;
    for (const [, a] of (parsed.topAliases || new Map()))
        if (a.line > d.line && a.line < end) end = a.line;
    return end;
}

function bareForm(parsed, text) {
    const badLines = new Set(lastRefusals.map(r => r.line));
    const src = text || "";
    const notes = attachNotes(src, parsed);
    const declSpan = (name, line, bad) =>
        '<span class="decl' + (bad ? " bad" : "") + '" data-jump="' + name + '">' + esc(name) + "</span>";
    bareSlots = [];
    const slotSpan = (slot, value) => {
        const placeable = !!locateSlot(slot);
        const i = bareSlots.push(slot) - 1;
        return '<span class="slot' + (placeable ? "" : " elsewhere") + '" data-slot="' + i
            + '" title="' + (placeable ? "choose a value" : "edit in Full") + '">'
            + nameTokens(value) + "</span>";
    };
    // a note that belongs to a record is one paragraph too, and it stands
    // against the record rather than floating a line away from it
    // A NOTE IS NOT A LINE OF THE STREAM. It is a block, and the newline that
    // joined it to the code below was still a character in a `pre` — so it drew
    // a whole empty line and put a reading-line of air between a note and the
    // record it speaks for, however tight the declared margin was. The gap was
    // honest and the join was not. It rides outside the join now.
    const noteOf = (name) => {
        const said = (notes.get(name) || []).join(" ").trim();
        return said ? '<span class="note said">' + noteProse(said) + "</span>" : "";
    };
    // one stream, in the order the document has it: a record with its note above
    // it, and the comments that belong to nobody where they were written
    const items = [];
    for (const [name, d] of parsed.declarations) {
        const bad = badLines.has(d.line);
        // ── AND THE HOLES A GATE OPENS, beside the name that opens them. A gate
        // is the one form whose whole content is its parameters — `Enter<Who:
        // Keeper, Into: Room>` says nothing else at all — and this view printed
        // the name alone. The parse now carries them for a head written down
        // the page as well as across one, which is how every gate in the shelf
        // is written.
        const conf = d.conformances.length ? '<span class="conf">: </span>' + nameTokens(d.conformances.join(", ")) : "";
        const cut = (slot, what) => {
            const i = bareSlots.push(slot) - 1;
            return '<span class="cut" data-cut="' + i + '" title="remove this ' + what + '">\u00d7</span>';
        };
        // ── AND THE CONDITION THE WHOLE VERDICT TURNS ON. A gated form conforms
        // only when its clause holds — that clause is the record's entire
        // content, and this view showed the name, then the holes, and stopped
        // one word short of what they are for.
        const when = d.whereText
            ? '<span class="conf"> when </span>' + nameTokens(d.whereText) : "";
        const block = ['<span class="' + (bad ? "row-bad" : "") + '">' + declSpan(name, d.line, bad) + conf + when
                + cut({ kind: "record", line: d.line, host: name }, "record") + "</span>"];
        // ── AND THE ONE STRING A RECORD IS ALLOWED. `typeName` is what spells a
        // name — which file a layout row is about, which revision a take was
        // taken at — and this view dropped it, so the manifest showed rows with
        // their columns and nothing saying what any row was ABOUT. The document
        // says so in its own second paragraph, and the view of it disagreed.
        const lit = parsed.literals && parsed.literals.get(name);
        if (lit) block.push('    <span class="lit">"' + esc(lit.value) + '"</span>');
        for (const [k, v] of d.aliases)
            block.push("    " + esc(k) + " = "
                + slotSpan({ kind: "alias", line: v.line, host: name, axis: k }, v.target)
                + cut({ kind: "axis", line: v.line, host: name, axis: k }, "axis"));
        // ── AND WHAT THIS RECORD ASKS OF OTHERS. A protocol declares axes —
        // `Keeper` opens `Post: Realm` and `Key` — and this view showed the
        // name alone: `Keeper×`, a record with nothing in it, beside a source
        // line that opens two holes for everybody who conforms. The parse has
        // held these all along (`axes`, `axisKinds`); nothing read them here.
        // Bare is the record without ceremony, never the record without its
        // content, and a form that asks for two things and appears to ask for
        // none is the emptiest thing this page could have printed.
        // ── ONE SHAPE FOR ONE THING. A gate's parameter and an `associatedtype`
        // are the same act written two ways — `Enter<Who: Keeper>` opens a hole
        // and `associatedtype Post: Realm` opens a hole — and this view showed
        // one with a colon inside angle brackets and the other as a sentence on
        // its own line. Two notations for one thing is the reader doing work the
        // page should have done. Every hole is a line, and the line says what
        // may fill it.
        for (const [axis, kind] of [...(d.params || []).map((a, i) => [a, (d.paramKinds || [])[i]]),
                                    ...(d.axes || []).map(a => [a, (d.axisKinds || {})[a]])])
            block.push("    " + '<span class="hole-label">' + esc(axis) + "</span>"
                + '<span class="conf"> asks for </span>'
                + (kind ? nameTokens(kind) : '<span class="caption">anything</span>'));
        for (const [axis, kind] of holesOf(d)) {
            const i = bareSlots.push({ kind: "hole", line: d.line, host: name, axis, of: kind }) - 1;
            block.push('    ' + esc(axis) + ' = <span class="slot hole caption" data-slot="' + i
                + '" title="choose a value">to fill</span>');
        }
        // A CLAIM OWNS THE LINES IT IS WRITTEN ON. A claim is written down the
        // page — its head, then an argument a line — and the judge points at the
        // line of the argument that failed, never at the head. Matching those
        // two numbers matched nothing, ever: the mark was written, hung on a
        // line no refusal names, and never appeared once.
        const starts = (d.entries || []).map(e => e.line).sort((a, b) => a - b);
        const hurt = new Set();
        // and a record owns only its OWN lines: the last claim in a record has
        // no claim after it, so without this it swallowed every refusal below —
        // three marks for two refusals, one of them in the next record entirely.
        const ends = recordEnd(parsed, d);
        for (const ln of badLines) {
            if (ln < d.line || ln >= ends) continue;
            let owner = null;
            for (const s of starts) if (s <= ln) owner = s; else break;
            if (owner !== null && ln < (starts.find(s => s > owner) ?? ends)) hurt.add(owner);
        }
        for (const e of (d.entries || [])) {
            const args = (e.args || []).map((a, i) =>
                slotSpan({ kind: "arg", line: e.line, host: name, head: e.head, index: i }, a));
            // ── AND A REFUSAL IS VISIBLE WHERE THE EDIT WAS MADE. This view is
            // one you WRITE in — slots, add claim, add record — and when what
            // you wrote stopped holding, nothing here said so: the chip counted
            // two, the footer carried two addresses, and the record they were
            // about looked exactly like the ones that hold. The mark existed
            // and was hung on the record's own line, while a refusal lands on
            // the CLAIM inside it, so it never once matched.
            block.push('<span class="' + (hurt.has(e.line) ? "row-bad" : "") + '">'
                + "    " + nameTokens(e.head) + (args.length ? "&lt;" + args.join(", ") + "&gt;" : "")
                + cut({ kind: "entry", line: e.line, host: name }, "claim") + "</span>");
        }
        if ((d.entries || []).length)
            block.push('    <span class="add caption" data-add-claim="' + name + '">+ add claim</span>');
        items.push({ line: d.line, note: noteOf(name), block });
    }
    // ── AND A VALUE READS AS ITS VALUE HERE TOO. The same walk the table uses:
    // this surface had been printing the spelling — `Twice<W65536>` — which is
    // how the number is built and not what it is. Both surfaces show a world;
    // showing it two different ways was the page having two opinions about one
    // record. The spelling stays a hover away, because it is still the thing on
    // the line underneath.
    for (const [name, a] of (parsed.topAliases || new Map())) {
        const shown = shownTerm(a.target);
        const said = shown === a.target ? nameTokens(a.target)
            : '<span title="' + esc(a.target) + '">' + nameTokens(shown) + "</span>";
        // ── AND A CERTIFICATE SHOWS WHEN IT IS THE ONE THAT BROKE. This passed
        // `false` for hurt, always. A certificate is a top-level alias and the
        // where court refuses nothing else, so EVERY refusal that court makes
        // was invisible in this view: ownership, the palette, a seam. The
        // letter's own lesson lands on one, in the view the letter opens in,
        // and the reader was told to look at a line that carried no mark.
        items.push({ line: a.line, note: noteOf(name),
                     block: [declSpan(name, a.line, badLines.has(a.line)) + " = " + said] });
    }
    for (const c of freeComments(src, notes, parsed))
        items.push({ line: c.line, block: [],
            note: c.kind === "head"
                ? '<span class="head">' + esc(c.text) + "</span>"
                : c.kind === "set"
                ? '<span class="set">' + esc(c.text) + "</span>"
                : '<span class="note free">' + noteProse(c.text) + "</span>" });
    items.sort((a, b) => a.line - b.line);
    // each item is a block of its own, so the gap between them is a declared
    // length rather than whatever line-height the font happens to carry
    return items.map(i => '<span class="rec">' + (i.note || "") + i.block.join("\n") + "</span>").join("")
        + '<span class="add caption" data-add-record="1">+ add record</span>';
}
// one delegated handler: a name in the bare view jumps to its declaration
document.getElementById("bare").addEventListener("click", (e) => {
    // a slot is a closed question: the same offer the editor uses, anchored to
    // the slot's own box, and it asks the grammar what may stand there
    const sl = e.target.closest("[data-slot]");
    if (sl) {
        const slot = bareSlots[+sl.dataset.slot];
        if (!slot) return;
        if (slot.kind !== "hole" && !locateSlot(slot)) return;   // read-only: edit in Full
        const host = (lastParsed && lastParsed.declarations.get(slot.host)) || layoutOrActive().get(slot.host);
        const kind = slot.kind === "alias" ? axesOfHost(host)[slot.axis]
            : slot.kind === "hole" ? slot.of
            : ((gates[slot.head] || [])[slot.index]);
        const items = fillersFor(kind, host, slot.axis);
        if (!items) return;
        compItems = items; compSlot = slot;
        compChosen = slot.kind === "hole" ? 0 : offerIndex(items, sl.textContent);
        compRect = sl.getBoundingClientRect();
        compEl.dataset.kind = kind ? "a value of " + kind : "";
        drawCompletion(true);
        return;
    }
    const cx = e.target.closest("[data-cut]");
    if (cx) return removeUnit(bareSlots[+cx.dataset.cut]);
    const ar = e.target.closest("[data-add-record]");
    if (ar) return addRecordFlow(ar);
    const ac = e.target.closest("[data-add-claim]");
    if (ac) return addClaimFlow(ac.dataset.addClaim, ac);
    const t = e.target.closest("[data-jump]");
    if (t) jumpTo(t.dataset.jump);
});

// undo belongs to the file, not to the view: in Bare the keystroke reaches the
// same buffer the editor edits, and the view is drawn again from the judge
document.addEventListener("keydown", (e) => {
    if (mode !== "bare") return;
    if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "z") { e.preventDefault(); undoEdit(); render(); }
});

// ── an offer is a question, and looking away answers it. It closes on a press
// outside itself, on Escape, and when the ground it is pinned to scrolls out
// from under it: the list is placed at a box's coordinates and holds them, so a
// scrolled table would leave it hanging over a row it no longer belongs to.
// This lives outside any one view because the offer does — the editor, the bare
// form and the table all open the same list, and only the editor used to be
// able to dismiss it.
const awayFromOffer = (e) =>
    !compEl.hidden && !(e.target instanceof Node && compEl.contains(e.target));
document.addEventListener("mousedown", (e) => {
    if (awayFromOffer(e)) hideCompletion();
}, { capture: true, passive: true });
// only the box-anchored offer closes on a scroll. The one that follows the
// caret is the editor's own, and CodeMirror scrolls its lines as you type — it
// would shut the list on the keystroke that opened it.
for (const ev of ["wheel", "scroll"])
    document.addEventListener(ev, (e) => {
        if (compRect && awayFromOffer(e)) hideCompletion();
    }, { capture: true, passive: true });
document.addEventListener("keydown", (e) => {
    if (e.key === "Escape" && !compEl.hidden) { e.preventDefault(); hideCompletion(); }
}, true);

function setMode(m) {
    mode = m;
    document.getElementById("editor-host").style.display = m === "full" ? "" : "none";
    document.getElementById("bare").style.display = m === "bare" ? "block" : "none";
    document.getElementById("table-host").style.display = m === "table" ? "block" : "none";
    document.querySelectorAll("#view-seg button").forEach(b => b.classList.toggle("on", b.dataset.m === m));
    if (m === "bare" && lastParsed) document.getElementById("bare").innerHTML = bareForm(lastParsed, cm.getValue());
    if (m === "table") buildTables();
    if (m === "full") cm.refresh();
}

// ── WHAT WAITS FOR A WORD, and from whom. Not what changed — git keeps that,
// and anybody can arrange it for themselves. A debt does not live in commits, it
// lives in seams: an unanswered axis sits with whoever owes the answer, so this
// one view reads the same from either side of a pair.
// Nothing here is a verdict. A seam is an account, and the court over it is
// `gate seam`; what this shows is who is waiting on whom, and what somebody has
// set aside on purpose — with the thing they cited, so that when it closes the
// exception comes back on its own and nobody has to remember.
async function buildSeams() {
    // ── A SEAM'S STATE IS A FACT ABOUT A CLAIM, AND IT LIVES AT THE CLAIM. This
    // used to be a zone in the left panel: a heading, a held count, a row per
    // waiting field, an empty-state sentence — an instrument, standing beside
    // the file list and telling a world's story for it. But a seam is a file
    // this world took, so it is a row in the manifest like every other taken
    // file, and its state is a column on that row: `holds`, or `parted at 3`
    // with the three addresses one click below. The panel is a door to worlds;
    // a door that narrates is a door that has stopped opening.
    //
    // What is left here is the reading itself, because the table needs it.
    try { seams = (await (await fetch("/attention")).json()).seams || []; }
    catch { seams = []; }
    const host = document.getElementById("seam-host");
    if (host) host.hidden = true;
    if (mode === "table") buildTables();
}
document.querySelectorAll("#view-seg button").forEach(b => b.onclick = () => setMode(b.dataset.m));
// the bar's arrows are the keyboard jump history made visible — the same navGo,
// no second stack. Xcode wears Ctrl-Cmd-arrows; the browser and VS Code, Alt.
document.getElementById("nav-back").onclick = () => navGo(navBack, navForward);
document.getElementById("nav-fwd").onclick = () => navGo(navForward, navBack);
{
    const combo = MAC ? "⌃⌘" : "Alt+";
    document.getElementById("nav-back").title = "Step back to where you jumped from  (" + combo + "←)";
    document.getElementById("nav-fwd").title = "Step forward to where you jumped  (" + combo + "→)";
}
updateNavButtons();

// No buffer of our own: an edit goes to the working-copy file, and git is the
// only state. But ONLY a holding world is written — a refused (invalid) world
// never reaches the file, so git reflects only worlds that hold. The invalid
// state lives only in the editor buffer until it holds again. A programmatic
// load (setValue) judges without writing.
let timer = null;
cm.on("change", (_, change) => {
    clearTimeout(timer);
    const userEdit = change.origin && change.origin !== "setValue";
    // offer while somebody edits a word — typing it or deleting back into it:
    // after a delete the hole is the same hole, and the grammar answers it
    if (change.origin === "+input" && /^[\w =.]+$/.test(change.text.join(""))) offerCompletion();
    else if (change.origin === "+delete") offerCompletion();
    else hideCompletion();
    timer = setTimeout(() => tick(userEdit), userEdit ? 400 : 150);
});
cm.on("blur", () => setTimeout(hideCompletion, 120));
cm.on("cursorActivity", () => { if (!compEl.hidden && !compFrom) hideCompletion(); });

// ── the cursor on a name says what it is: a declaration here and what it
// conforms to, a value and its kind, an axis and what it takes, a gate and
// its arguments. Every word of it is read from the world and the forms file, so a
// client's own domain describes itself with no dictionary of ours. ──
function describeName(name) {
    const d = layoutDecls.get(name);
    if (d && d.conformances && d.conformances.length) {
        const kinds = d.conformances.filter(c => protoAxes[c]);
        const plain = d.conformances.filter(c => !protoAxes[c]);
        if (gates[name]) return name + " · a gate: " + name + "&lt;" + gates[name].join(", ") + "&gt;";
        return name + " · " + (plain.length ? "a " + plain.join(", ") + " " : "") + "record"
            + (kinds.length ? ", of kind " + kinds.join(", ") : "");
    }
    if (d) return name + " · declared here";
    if (gates[name]) return name + " · a gate: takes " + gates[name].join(", ");
    for (const [kind, atoms] of Object.entries(conformers))
        if (atoms.includes(name)) return name + " · a value of kind " + kind
            + (vocabulary[name] ? " (from " + vocabulary[name] + ")" : "");
    if (protoAxes[name]) return name + " · a kind, with " + Object.keys(protoAxes[name]).join(", ")
        + (vocabulary[name] ? " (from " + vocabulary[name] + ")" : "");
    if (vocabulary[name]) return name + " · declared in " + vocabulary[name];
    return null;
}

function describeAxis(host, axis) {
    const kind = host ? axesOfHost(host)[axis] : (axisOf[axis]);
    if (!kind) return null;
    return axis + " · an axis, takes " + kind;
}

let inspectFrame = 0;
function scheduleInspect() {
    if (inspectFrame) return;
    inspectFrame = requestAnimationFrame(() => { inspectFrame = 0; inspect(); });
}
function inspect() {
    const el = document.getElementById("inspect");
    // the answer to something you did holds this line until the cursor lands on a
    // name, which is the next thing you did
    delete el.dataset.answer;
    const cur = cm.getCursor();
    const tok = cm.getTokenAt(cur, true);
    const name = (tok.string || "").trim();
    if (!/^[A-Z]\w*$/.test(name)) { el.textContent = ""; return; }
    const line = cm.getLine(cur.line) || "";
    const isAxis = new RegExp("typealias\\s+" + name + "\\s*=").test(line)
        || new RegExp("associatedtype\\s+" + name + "\\b").test(line);
    const { host } = placeAt(cur);
    const text = (isAxis && describeAxis(host, name)) || describeName(name);
    if (!text) { el.textContent = ""; return; }
    el.innerHTML = text + (jumpable.has(name) ? " · " + (MAC ? "\u2318" : "Ctrl") + "-click opens it" : "");
}
cm.on("cursorActivity", scheduleInspect);
async function tick(write) {
    await render();                         // judges the buffer first
    // ── AND WHAT STOPS THE WRITE IS THIS FILE, NOT THE WHOLE WORLD. A refusal
    // in a file you are not editing cannot be caused by what you typed and
    // cannot be fixed by it either, and blocking on one froze the bench whole:
    // the first scene ships with exactly one refusal on purpose, so every edit
    // anywhere in it answered `refused: nothing written` and the offer under
    // every value looked broken. Your file is judged before it is written; the
    // rest of the world is judged, and shown, and not held against you.
    const holds = !lastRefusals.some(r => !r.file || r.file === active);
    if (write && holds) {
        await fetch("/world?f=" + encodeURIComponent(active), { method: "PUT", body: editor.value });
        refreshGit();
    } else if (write) {
        // invalid: withhold the write, say so plainly
        const el = document.getElementById("gitstate");
        el.className = "modified";
        el.innerHTML = '<span class="g"></span>refused: nothing written';
        el.title = "The judge refused this text, so it was not written to the file. "
                 + "Your edit is here in the editor until it holds again.";
    }
}

async function siblings() {
    siblingNames = new Set(); layoutDecls = new Map(); declFile = new Map();
    for (const f of files) {
        if (f === layoutFile) continue;          // its names are the layout's, not the world's
        const t = f === active ? editor.value : await (await fetch("/world?f=" + encodeURIComponent(f))).text();
        const parsed = judge(f, t).parsed;
        if (f !== active) namesOf(parsed).forEach(n => siblingNames.add(n));
        for (const [name, d] of parsed.declarations) if (!layoutDecls.has(name)) { layoutDecls.set(name, d); declFile.set(name, f); }
    }
}
async function loadFile(name) {
    cm.setOption("readOnly", false); viewingShelf = null; refLabel = null;
    active = name;
    document.getElementById("fname").textContent = name;
    buildRail();
    const t = await (await fetch("/world?f=" + encodeURIComponent(name))).text();
    // ── AND THE NAMES ARE KNOWN BEFORE THE TEXT IS PAINTED. CodeMirror
    // tokenises the moment the value is set, and the name set it consulted
    // still belonged to the file you just left: every name of the new file fell
    // through to `theirs` and the whole document came up purple, then repainted
    // a beat later when the parse arrived. A view that shows the wrong world
    // first and corrects itself is a view you cannot read at a glance.
    const early = judge(name, t, formsFiles.has(name) || name === layoutFile
                                ? { seeds: new Set(), generics: new Set() } : undefined);
    repaintNames(early.parsed, []);
    editor.value = t;   // setValue: judged, not written
    // ── AND OPENING A FILE IS NOT SOMETHING TO UNDO. Setting the text is a change
    // like any other to the editor, so the file you had just opened sat at the
    // bottom of the undo stack: two presses of the undo key emptied the buffer, and
    // write-on-holds then saved the emptiness, because a world with nothing in it
    // has nothing to refuse. Found by doing it, on a fixture, while chasing why undo
    // walked the cursor back. The loaded text is the floor now: there is nothing
    // before it to unwrite.
    cm.clearHistory();
    await siblings();
    worldRead = true;
    render();
    refreshGit();
}

// ── the file rail is a panel you can drag, like the others. The limit is the
// window, not a number somebody picked: drag it wide to read the journal, drag
// it away to read the code. Double-click returns it. ──
function makeSplit(el, panel, min, maxOf) {
    let drag = null, frame = null;
    el.addEventListener("pointerdown", (e) => {
        drag = { fromX: e.clientX, fromW: panel.getBoundingClientRect().width };
        el.classList.add("dragging"); try { el.setPointerCapture(e.pointerId); } catch {} e.preventDefault();
    });
    el.addEventListener("pointermove", (e) => {
        if (!drag) return; drag.lastX = e.clientX;
        if (frame) return;
        frame = requestAnimationFrame(() => {
            frame = null; if (!drag) return;
            const max = typeof maxOf === "function" ? maxOf() : maxOf;
            const w = Math.max(min, Math.min(max, drag.fromW + (drag.lastX - drag.fromX)));
            panel.style.flex = "0 0 " + w + "px";
        });
    });
    const done = () => { drag = null; el.classList.remove("dragging"); };
    el.addEventListener("pointerup", done); el.addEventListener("pointercancel", done);
    el.addEventListener("dblclick", () => { panel.style.flex = ""; });
}
makeSplit(document.getElementById("split-rail"), document.getElementById("rail"),
          120, () => Math.max(360, window.innerWidth - 320));

// ── the rail remembers how you left it: which sections are open, and how wide.
// Nothing here is a fact about the world, so it lives in the browser, not in git.
const LAYOUT = "gate.bench.layout";
function layout() {
    try { return JSON.parse(localStorage.getItem(LAYOUT) || "{}"); } catch { return {}; }
}
function saveLayout(patch) {
    try { localStorage.setItem(LAYOUT, JSON.stringify({ ...layout(), ...patch })); } catch { }
}
function applyFold(name, shut) {
    const head = document.querySelector('h3[data-fold="' + name + '"]');
    const body = head.nextElementSibling;
    head.classList.toggle("shut", shut);
    body.classList.toggle("shut", shut);
    head.title = shut ? "Show " + name : "Hide " + name;
}
for (const head of document.querySelectorAll("h3.fold")) {
    const name = head.dataset.fold;
    // THE RAIL OPENS ON WHAT IS YOURS. Your files and your seams are the work;
    // the judge's own words are reference, and eight rows of them above the
    // journal made the reference look like the subject. Shut until asked for —
    // and once you have said either way, your word is the one that is kept.
    const stored = layout()["shut_" + name];
    applyFold(name, stored === undefined ? name === "shelf" : !!stored);
    head.onclick = () => {
        const shut = !head.classList.contains("shut");
        applyFold(name, shut);
        saveLayout({ ["shut_" + name]: shut });
    };
}
{   // the width you dragged it to, next time as well
    const rail = document.getElementById("rail"), w = layout().railWidth;
    if (w) rail.style.flex = "0 0 " + w + "px";
    const split = document.getElementById("split-rail");
    split.addEventListener("pointerup", () =>
        saveLayout({ railWidth: Math.round(rail.getBoundingClientRect().width) }));
    split.addEventListener("dblclick", () => saveLayout({ railWidth: 0 }));
}

// ── one reader: the bench builds its vocabulary from the SAME judge that judges
// the world, run over the shelf's own text. What each name is, what it conforms
// to, the axes each protocol owes with their kind, and the parameters each gate
// takes are all read from that parse — no second regex on the server beside the
// judge in the browser. Names use each declaration's own short name: a one-line
// enum body leaves its opener on the parse stack, so a later gate is read as its
// child, but the short name is the one the world speaks. ──
async function loadVocabulary() {
    vocabulary = {}; conformers = {}; axisOf = {}; protoAxes = {}; gates = {};
    const list = await (await fetch("/shelf")).json().catch(() => ({}));
    // WHAT THIS WORLD PRESENTS COMES FIRST, because it is what this world is
    // written in. Reading only the shelf left the bench offering the ranks it
    // was born knowing while the operator's own file, sitting right there in
    // their repository, had just declared another one.
    const sources = [];
    for (const f of formsFiles)
        sources.push([f, await (await fetch("/world?f=" + encodeURIComponent(f))).text()]);
    for (const mod of (list.modules || []))
        sources.push([mod, await (await fetch("/shelf?m=" + encodeURIComponent(mod))).text()]);
    for (const [mod, text] of sources) {
        // reading the shelf, not judging a world: the extras parse (a truthy
        // vocabulary turns it on) reads a forms file's top-level certificates as
        // vocabulary instead of refusing them the way the plain world judge
        // must. The world judge stays plain — its parity is with the CLI.
        const READ = { seeds: new Set(), generics: new Set() };
        const read = judge(mod + ".swift", text, READ);
        // AND THE VALUES THOSE WORLDS HOLD, on the same pass that reads their
        // words. A number is spelled on its own world's ladder from Unit, so a
        // file that says `Plus<W8, W16>` is only readable beside the world that
        // says what W8 is — and my file is judged against worlds it does not
        // repeat. One walk, one map, no second request.
        for (const [n, a] of read.parsed.topAliases)
            if (!worldAliases.has(n)) worldAliases.set(n, a);
        for (const d of read.parsed.declarations.values()) {
            if (!(d.name in vocabulary)) vocabulary[d.name] = mod;
            if (d.axes) {                                   // a protocol: the axes it owes, and of what kind
                for (const [axis, kind] of Object.entries(d.axisKinds || {})) {
                    (protoAxes[d.name] || (protoAxes[d.name] = {}))[axis] = kind;
                    if (!(axis in axisOf)) axisOf[axis] = kind;
                }
            } else if (d.params && d.params.length) {       // a gate: what each parameter takes, in order
                gates[d.name] = d.paramKinds || [];
            } else {                                        // a plain atom: what it stands in for
                for (const conf of d.conformances) {
                    const c = conf.trim();
                    // one name, one entry: the presented file and the shelf may
                    // say the same word, and an offer that lists it twice is a
                    // list that has stopped being an account of what there is
                    if (c && !(conformers[c] || (conformers[c] = [])).includes(d.name))
                        conformers[c].push(d.name);
                }
            }
        }
    }
}

// what a world is made of, read from the one place that says: the layout. One
// reader, used at load and again whenever the layout itself is saved.
async function readFiles() {
    const fl = await (await fetch("/files")).json().catch(() => ({ files: [] }));
    files = fl.files || []; personalFile = fl.personal || null; personalEmpty = !!fl.personal_empty;
    layoutFile = fl.layout || null;
    formsFiles = new Set(fl.forms || []);
    opensAs = fl.opens || {};
    seamRows = fl.seams || [];
    overridden = fl.overridden || {};
    judgeClaimAt = fl.judge_claim || null;
    buildRail();
    return fl;
}

(async () => {
    // what this world presents has to be known before the vocabulary is built,
    // or the bench reads the shelf and misses the file sitting next to the world
    const fl = await readFiles();
    try { language = await (await fetch("/language")).json(); } catch { }
    wireJudgeRow();
    await loadVocabulary();
    // the rail carries files AND the journal, so it shows for any clone
    // the line says what is true HERE: with a world, the judge is at work;
    // without one, only the history is being read
    document.getElementById("brandline").textContent = files.length
        // ── A GREETING HOLDS, IT DOES NOT THREATEN. `A lie cannot be saved`
        // was true of nothing and wrong about everything: a file that does not
        // hold saves here perfectly well, and what cannot happen is a lie being
        // COMMITTED, only where somebody wired the hook. Worse, the two words a
        // stranger met first were `lie` and `cannot`, which is the voice of
        // supervision, and this is not that. What is said first is what is
        // being kept; the mechanism comes second, as an event with an address
        // and no blame in it.
        ? "Your word, held as you type. A claim that breaks is named by its line."
        : "Reading this repository's history. Nothing here is judged yet.";
    document.getElementById("rail").style.display = "flex";
    document.getElementById("split-rail").style.display = "block";
    document.getElementById("fname").style.display = "none";
buildRail();
    await buildJournal();
    if (!files.length) return showEmpty();   // no world here yet
    // ── AND A LAYOUT IS NOT A GREETING, EVEN WHEN IT IS ALL THERE IS. A world
    // whose every declared row is a seam side has no bench file but the layout
    // and your own empty page, so the bench opened on the accounting document —
    // in the one scene that is entirely about two declarations, neither of them
    // shown. The first thing the layout declares that a reader can read is the
    // door; here that is a side of the seam, opened to READ like any other.
    const readable = files.filter(f => f !== layoutFile && f !== personalFile);
    if (!readable.length && seamRows.length) await openSeamSide(seamRows[0], null);
    else {
        const first = files[0] || "gate.swift";
        if (opensAs[first]) setMode(opensAs[first]);
        await loadFile(first);
    }
    // ── AND THE EDITOR IS MEASURED ONCE THE PAGE HAS A LAYOUT. CodeMirror
    // measures itself when it is built, and it is built while the rail is still
    // hidden and the panes have no width: everything lands in the DOM and the
    // first paint comes out EMPTY until something forces a re-measure. Seen on
    // the seam bench, which opens straight into Full — a full document, a
    // selected file, a verdict bar, and a blank pane. One frame later there is a
    // layout to measure against, and this runs on every way in rather than on
    // the one that happened to be walked.
    requestAnimationFrame(() => { if (mode === "full") cm.refresh(); });
})();

// ── no world yet: the journal on the left is already live, and these are the
// two ways to get one. Nobody is asked to read a manual first. ──
function showEmpty() {
    document.getElementById("editor-host").style.display = "none";
    document.getElementById("verdict-panel").style.display = "none";
    document.getElementById("view-seg").style.display = "none";
    document.querySelector("#rail h3").style.display = "none";   // no files, no heading
    const host = document.getElementById("table-host");
    host.style.display = "block";
    // ── AND AN EMPTY BENCH SAYS WHAT THIS PLACE IS FOR, NOT WHAT IT LACKS.
    // `No world here yet` names an absence and hands over two commands, which
    // is a form to fill in; the same screen can say the thing this repository
    // is missing in its own terms. git keeps its bytes honest and nobody keeps
    // its words honest: that sentence is true of every clone on earth and it is
    // true of this one, and it is what the two doors are for.
    const lead = journalCommits.length
        ? "This repository's history is already readable: `gate log` gives every commit, who "
          + "wrote it and whether it is merged, with nothing translated. What no clone has "
          + "yet is a world: the words this repository runs on, said where they can be read "
          + "again every time they are touched."
        : "Nothing has been committed here yet, so there is neither a history to read nor a "
          + "world to judge. Both start the same way.";
    // a backtick means the same thing here as everywhere else on this page: the
    // word inside it is a thing you type. Written raw it was punctuation.
    host.innerHTML =
        '<div class="empty"><h2>Your words are not held here yet</h2><p>' + noteProse(lead) + "</p>"
        + '<div class="door"><code>gate demo</code>'
        + "<span>" + noteProse("This is where you will see it happen to somebody else first: a "
        + "repository with a CODEOWNERS, one owner reaching past their zone, and the line named "
        + "for it. Thirty seconds, and `git checkout .` is the whole way back.") + "</span></div>"
        + '<div class="door"><code>gate import codeowners CODEOWNERS --tree .</code>'
        + "<span>" + noteProse("This is where your own repository starts answering. Who owns "
        + "which paths is a fact you already keep, in a file that cannot say whether an owner "
        + "still exists or whether a pattern still matches anything.") + "</span></div>"
        + "</div>";
}
</script>
