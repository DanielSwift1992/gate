     CodeMirror editor with declared-name highlighting; the Code · Table
     surface switch (Table projects the world as sortable relations, click a
     name to jump); Full · Bare (the same editor, ceremony collapsed from
     view — full Swift, fully editable); a draggable file rail (the declared
     layout); the verdict docked at the bottom, Xcode-style; cross-file
     judgement over unsaved text. -->

     talk to its own loopback server and to nothing else. -->

// The theme is a declaration, not a toggle. Before the world is read, follow the
// operating system so a dark machine never flashes white; a MyBench in your
// personal world refines it a moment later.
document.documentElement.setAttribute("data-theme",
    window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");

        if (stream.match(/^@[A-Za-z]+/)) return "attribute";
        if (stream.match(/^[A-Za-z_][A-Za-z0-9_]*/)) {
            const word = stream.current();
            if (word === "self" || keywordSet.has(word)) return "keyword";
            if (/^[A-Z]/.test(word)) {
                if (unresolved.has(word)) return "badname";
                const home = jumpable.has(word) ? " jumpable" : "";
                if (stream.string[stream.start - 1] === ".") return "knownname" + home;
                if (localNames.has(word)) return "localtype" + home;
                return "knownname" + home;

function toggleComment(cm) {
    // Xcode's ⌘/ over the selected lines: comment them, or take it back
    const from = cm.getCursor("from").line, to = cm.getCursor("to").line;
    let lines = [];
    for (let i = from; i <= to; i++) lines.push(cm.getLine(i));
    const meaty = lines.filter(l => l.trim());
    const commented = meaty.length && meaty.every(l => l.trim().startsWith("//"));
    for (let i = from; i <= to; i++) {
        const line = cm.getLine(i);
        if (!line.trim()) continue;
        const next = commented
            ? line.replace(/^(\s*)\/\/ ?/, "$1")

function noSave(cm) {

const cm = CodeMirror(document.getElementById("editor-host"), {

{

let files = [], active = "", personalFile = null, personalEmpty = false, viewingShelf = null;
let badFiles = new Set(), siblingNames = new Set(), layoutDecls = new Map(), declFile = new Map();
let lastParsed = null, lastRefusals = [], widgets = [], tableSort = null;

// ── the file rail: the declared layout, the same list the judge runs over ──
function buildRail() {
    const list = document.getElementById("filelist");
    list.innerHTML = "";
    for (const f of files) {
        const row = document.createElement("div");
        row.className = "file fact" + (f === active ? " on" : "") + (badFiles.has(f) ? " bad" : "");
        // your personal world stands apart: it is in your own git, and the
        // shared repository does not have it
        row.innerHTML = '<span class="dot"></span>' + f + (f === personalFile
            ? '<span class="mine caption" title="Your personal world. It lives in your own git at ~/.gate/me and is never in the shared repository.">mine</span>' : "");
        row.onclick = () => {
            const from = navHere();       // opening a file from the rail is a jump too

// ── the journal VIEW: git's own history, projected. A pure function of the
// clone — no server state, no hosting; whoever can read the repo sees it.
// Observed, never judged (open/closed is reachability, not a verdict). ──
let journalCommits = [], authorFilter = null, journalLimit = 60, journalScope = "world";
let journalMe = "", myJournalKey = "";
async function buildJournal() {
    try {
        const j = await (await fetch("/log?n=" + journalLimit + "&scope=" + journalScope)).json();
        journalCommits = j.commits || []; journalWorld = j.world_files || []; journalMe = j.me || "";
    } catch { journalCommits = []; }

}

// ── the theme is a declaration too. The default follows the operating system;
// MyBench in your personal world overrides it, and the page repaints when either
// changes. No toggle: a button that duplicates a declaration is forbidden. ──
const darkMedia = window.matchMedia("(prefers-color-scheme: dark)");
let declaredTheme = null;               // a theme the genre names, read from MyBench.Theme
function effectiveTheme() { return declaredTheme || (darkMedia.matches ? "dark" : "light"); }
function paintTheme() { document.documentElement.setAttribute("data-theme", effectiveTheme()); }
darkMedia.addEventListener("change", paintTheme);   // the OS flips, and an undeclared bench follows
function applyMyBench() {
    const d = (active === personalFile && lastParsed ? lastParsed.declarations : layoutDecls).get("MyBench");
    const a = d && d.aliases.get("Theme");
    // only a value the bench genre names sets the theme; a stranger is the
    // guard's to report, and until then the OS default stands
    declaredTheme = a && (conformers["BenchTheme"] || []).includes(a.target) ? a.target.toLowerCase() : null;
    paintTheme();
}

// ── the bench is judged by its own rules. A value on a bench declaration
// (MyBench, MyJournal) that the genre does not name is not silently ignored the
// way a mistyped Scope once fell to a default — it is a guard line, addressed at
// its own line. Guarded, not judged (the theme is not a fact of the world), and
// read from the one source the completion reads: protoAxes and conformers of
// the bench's own genre, so a stranger cannot be mistaken for a value. ──
function benchGuards() {
    const onMine = active === personalFile && lastParsed;
    const decls = onMine ? lastParsed.declarations : layoutDecls;
    const out = [];
    for (const [name, d] of decls) {
        for (const conf of d.conformances) {
            if (vocabulary[conf] !== "bench-atoms") continue;   // only the bench's own genre, never the world's
            for (const [axis, kind] of Object.entries(protoAxes[conf] || {})) {
                const a = d.aliases.get(axis);
                if (a && a.target && !(conformers[kind] || []).includes(a.target))
                    out.push({ file: onMine ? personalFile : (declFile.get(name) || personalFile),
                               line: a.line, decl: name, axis, value: a.target,
                               allowed: (conformers[kind] || []).join(", ") });
            }
        }
    }
    return out;
}

// ── the dashboard is a declaration: MyJournal in your personal world says what
// the journal shows. Edit it in the bench and the journal follows — one truth,
// judged like everything else (a name that does not exist is refused by line).
function applyMyJournal() {
    // while you are editing the personal file, the live parse is the truth;
    // otherwise the layout's copy, read when the file was loaded
    const d = (active === personalFile && lastParsed ? lastParsed.declarations : layoutDecls).get("MyJournal");
    const scope = d && d.aliases.get("Scope") && d.aliases.get("Scope").target === "AllRepo" ? "all" : "world";
    const author = d && d.aliases.get("Author") && d.aliases.get("Author").target === "Me" ? "me" : null;
    const key = scope + "/" + author;
    if (key === myJournalKey) return;
    myJournalKey = key;
    journalScope = scope;
    authorFilter = author === "me" ? (journalMe || null) : null;
    buildJournal();
}
function renderJournal() {

        what + " Read from git: the judge has not checked any of this.";
    if (authorFilter) {

        host.appendChild(note);

    const shown = journalCommits.filter(c => !authorFilter || c.email === authorFilter);
    for (const c of shown) {
        const row = document.createElement("div");
        row.className = "commit" + (c.touches_world ? " touches" : "");
        const when = (c.when || "").slice(0, 10);
        // the badge says reachability, and its title says exactly that — a
        // squash-merged branch reads open until the branch is deleted
        const title = c.closed
            ? "In the default branch: this commit is part of the main line."
            : "On a branch, and not yet in the default branch. A branch merged by squashing reads as open until it is deleted.";
        const badge = c.closed === null ? ""
            : '<span class="badge caption ' + (c.closed ? "closed" : "open") + '" title="' + title + '">' + (c.closed ? "closed" : "open") + "</span>";
        row.innerHTML = '<div class="subj speech">' + (c.touches_world ? '<i class="caret"></i>' : "")
            + esc(c.subject) + "</div><div class=\"meta observed\">" + badge +
            '<span class="who" data-email="' + esc(c.email) + '">' + esc(c.person || c.email) + "</span> · " + when + "</div>";
        row.querySelector(".who").onclick = (e) => {

}
// what a commit did, read as facts: `Rank: Manager → Lead`, not a wall of
// git plumbing. It opens UNDER the commit, in the rail — nothing is covered
// and nothing dims, because a diff is something you glance at.
async function toggleDiff(c, row) {
    // each commit opens and closes on its own: several can stand open at once,
    // and which of them is worth reading together is nobody's business but yours
    const next = row.nextElementSibling;
    if (next && next.classList.contains("cdiff")) {
        next.remove(); row.classList.remove("open"); return;
    }
    row.classList.add("open");
    const box = document.createElement("div");
    box.className = "cdiff";
    box.innerHTML = '<div class="dwait">reading…</div>';
    row.after(box);
    const f = c.files.find(x => (journalWorld || []).includes(x)) || "";
    const d = await (await fetch("/show?hash=" + c.hash + "&f=" + encodeURIComponent(f))).json();
    let body = "";
    for (const file of d.files) {
        if (!file.changes.length) continue;
        const signs = new Set(file.changes.map(x => x.kind === "fact" ? "~" : x.sign));
        const whole = file.changes.length > 24 && signs.size === 1 && !signs.has("~");
        body += '<div class="dfile">' + esc(file.name)
            + (whole ? '<span class="dnote">' + (signs.has("+") ? "written" : "removed")
                + ", " + file.changes.length + " lines</span>" : "") + "</div>";
        if (whole) continue;
        const shown = file.changes.slice(0, 20);
        for (const ch of shown) {
            body += ch.kind === "fact"
                ? '<div class="fact factrow">' + (ch.owner ? '<span class="own">' + esc(ch.owner) + '</span><span class="sep">·</span>' : "")
                    + '<span class="key">' + esc(ch.key) + '</span><span class="was">' + esc(ch.from)
                    + '</span><span class="arrow">→</span><span class="now">' + esc(ch.to) + "</span></div>"
                : '<div class="dline ' + (ch.sign === "+" ? "add" : "del") + '"><span class="sg">'
                    + ch.sign + "</span>" + esc(ch.text) + "</div>";
        }
        if (file.changes.length > shown.length)
            body += '<div class="dmore">' + (file.changes.length - shown.length) + " more lines</div>";
    }
    box.innerHTML = body || '<div class="dmore">no change in these files</div>';
}
function closeDiff() {

let journalWorld = [];
// ── completion: the names this world allows, offered while you type. The
// pool is not a dictionary of ours — it is what the files themselves declare,
// so what it offers is what the judge will accept. ──
let compItems = [], compChosen = 0, compFrom = null;

// ── WHERE THE CURSOR IS, IN THE GRAMMAR ──
// A world has four places, and each one allows a different thing. Everything
// the bench offers comes from this one reading; nothing is a special case
// added because somebody noticed it missing.
//
//   top level          a declaration may begin, and after `:` its protocols
//   inside one         the axes it owes, and the values each of them takes
//   inside a body      the gates that may be claimed, and their arguments
//   after a dot        the axes of whatever stands to the left
function placeAt(cur) {
    let host = null, inBody = false, depth = 0;
    for (let i = cur.line; i >= 0; i--) {
        const code = (cm.getLine(i) || "").split("//")[0];
        if (i < cur.line) depth += (code.match(/\}/g) || []).length - (code.match(/\{/g) || []).length;
        if (/var\s+body\s*:\s*some\s+Structure\s*\{/.test(code) && depth <= 0) inBody = true;
        const m = /^\s*(?:public\s+)?enum\s+(\w+)\s*:\s*([\w,\s]+?)\s*\{/.exec(code);
        if (m && depth <= 0) {
            host = { name: m[1], conformances: m[2].split(",").map(x => x.trim()).filter(Boolean) };
            break;
        }
        if (/^\}/.test(code) && i < cur.line) break;     // a closed declaration above
    }
    return { host, inBody };
}

function axesOfHost(host) {
    const out = {};
    for (const proto of (host ? host.conformances : []))
        Object.assign(out, protoAxes[proto] || {});
    return out;
}

// every way to reach a kind: an atom of it, a declaration of it, or a path
// through an axis this record already has — `Sex = Given.Sex`
function fillersFor(kind, host, slotName) {
    if (!kind) return null;
    const out = [...(conformers[kind] || [])];
    for (const [name, d] of layoutDecls)
        if ((d.conformances || []).includes(kind)) out.push(name);
    for (const [axis, axisKind] of Object.entries(axesOfHost(host))) {
        if (axis === slotName) continue;         // a slot cannot be filled by itself
        for (const [inner, innerKind] of Object.entries(protoAxes[axisKind] || {}))
            if (innerKind === kind) out.push(axis + "." + inner);
    }
    return out.length ? [...new Set(out)] : null;
}

function afterDot(before, host, wanted) {
    const m = /(\w+)\.(\w*)$/.exec(before);
    if (!m) return null;
    const kind = axesOfHost(host)[m[1]] || axisOf[m[1]];
    const out = Object.entries(protoAxes[kind] || {})
        .filter(([, k]) => !wanted || k === wanted).map(([a]) => a);
    return out.length ? { items: out, back: m[2].length } : null;
}

// WHAT MAY BE WRITTEN HERE — the whole of it, in one place
function allowedAt(cur) {
    const line = cm.getLine(cur.line) || "";
    const before = line.slice(0, cur.ch);
    const { host, inBody } = placeAt(cur);

    // an axis slot: `typealias Sex = `
    const slot = /typealias\s+(\w+)\s*=\s*[\w.]*$/.exec(before);
    const wanted = slot ? (axesOfHost(host)[slot[1]] || axisOf[slot[1]] || null) : null;

    const dotted = afterDot(before, host, wanted);
    if (dotted) return { items: dotted.items, back: dotted.back,
                         kind: wanted ? "this axis takes " + wanted : "what stands here", closed: true };

    if (slot) {
        // a slot is a closed question: only what its kind allows, and if the
        // genre states no kind for it, nothing — never a name of another kind
        const f = wanted ? fillersFor(wanted, host, slot[1]) : null;
        return { items: f || [], kind: wanted ? "this axis takes " + wanted : "an axis", closed: true };
    }

    // the head of a declaration: `public enum Emp9007: `
    const head = /^\s*(?:public\s+)?enum\s+\w+\s*:\s*([\w,\s]*)$/.exec(before);
    if (head) {
        const already = new Set(head[1].split(",").map(x => x.trim()).filter(Boolean));
        const protos = Object.keys(protoAxes).filter(p => !already.has(p));
        return protos.length ? { items: protos, kind: "what this record is", closed: true } : null;
    }

    // inside a body: the gates that may be claimed here
    if (inBody && /^\s*\w*$/.test(before)) {
        const forms = Object.keys(gates);
        return forms.length ? { items: forms, kind: "a claim this body may hold", closed: true } : null;
    }
    // an argument of a gate: `VerifiedView<\n  Emp9001,\n  ` — the kind is stated
    if (inBody) {
        for (let i = cur.line; i >= 0 && i > cur.line - 6; i--) {
            const m = /(\w+)\s*<\s*$/.exec((cm.getLine(i) || "").split("//")[0]);
            if (m && gates[m[1]]) {
                const kinds = gates[m[1]];
                const nth = cur.line - i - 1;
                const k = kinds[Math.min(nth, kinds.length - 1)];
                const f = fillersFor(k, host);
                return f ? { items: f, kind: "this argument takes " + k, closed: true } : null;
            }
        }
    }

    // inside a declaration, at the start of a line: the axes it still owes
    if (host && !inBody && /^\s*(?:p(?:u(?:b(?:l(?:i(?:c)?)?)?)?)?)?$/.test(before)) {
        const stated = new Set();
        for (let i = cur.line - 1; i >= 0; i--) {
            const code = (cm.getLine(i) || "").split("//")[0];
            const t = /typealias\s+(\w+)/.exec(code);
            if (t) stated.add(t[1]);
            if (/enum\s+\w+\s*:/.test(code)) break;
        }
        const owed = Object.keys(axesOfHost(host)).filter(a => !stated.has(a));
        if (owed.length)
            return { items: owed.map(a => "public typealias " + a + " = "),
                     scaffold: owed, kind: "axes this record still owes", closed: false };
    }
    return null;
}

function hideCompletion() { compEl.hidden = true; compItems = []; compFrom = null; }

function drawCompletion(reposition) {
    compEl.innerHTML = compItems.map((n, i) =>
        '<div class="crow fact' + (i === compChosen ? " on" : "") + '" data-i="' + i + '">' + esc(n) + "</div>").join("")
        + (compEl.dataset.kind ? '<div class="cnote caption">' + esc(compEl.dataset.kind) + "</div>" : "");
    // anchored to the start of the word, set when the offer opens and held:
    // arrowing through it or a verdict landing must not shift it a pixel
    if (reposition || compEl.hidden) {
        const co = cm.charCoords(compFrom, "page");
        compEl.style.left = co.left + "px";
        compEl.style.top = (co.bottom + 2) + "px";
    }
    compEl.hidden = false;
    for (const row of compEl.querySelectorAll(".crow"))
        row.onmousedown = (e) => { e.preventDefault(); acceptCompletion(+row.dataset.i); };
}

function acceptCompletion(i) {
    const name = compItems[i === undefined ? compChosen : i];
    if (!name || !compFrom) return hideCompletion();
    if (compScaffold && name.startsWith("\u25B8")) {
        const cur = cm.getCursor();
        const indent = (cm.getLine(cur.line).match(/^\s*/) || [""])[0] || "    ";
        const lines = compScaffold.map(a => indent + "public typealias " + a + " = ");
        cm.replaceRange(lines.join("\n"), { line: cur.line, ch: 0 }, cur, "+input");
        cm.setCursor({ line: cur.line, ch: lines[0].length });   // in the first slot
        hideCompletion();
        offerCompletion();                                       // now offer its value
        return;
    }
    cm.replaceRange(name, compFrom, cm.getCursor(), "+input");
    hideCompletion();
}

function offerCompletion() {
    const cur = cm.getCursor();
    const line = cm.getLine(cur.line) || "";
    const before = line.slice(0, cur.ch);
    const here = allowedAt(cur);
    if (!here) return hideCompletion();     // no grammar here means no offer
    const m = /([A-Za-z_]\w*)$/.exec(before);
    const word = m ? m[1] : "";
    const low = word.toLowerCase();
    const back = here.back !== undefined ? here.back : word.length;
    let items = word ? here.items.filter(n => n.toLowerCase().includes(low) && n !== word) : here.items;
    items.sort((a, b) => {
        const pa = a.toLowerCase().startsWith(low), pb = b.toLowerCase().startsWith(low);
        return pa === pb ? a.localeCompare(b) : (pa ? -1 : 1);
    });
    // the whole record, offered first when a slot is fresh: fill every axis it
    // owes at once, then land in the first. It is the same owed set, one grain up.
    compScaffold = null;
    if (here.scaffold && here.scaffold.length > 1 && word.length <= 1) {
        compScaffold = here.scaffold;
        items = ["\u25B8 fill in " + here.scaffold.join(", "), ...items];
    }
    compItems = items.slice(0, 8);
    compChosen = 0;
    if (!compItems.length) return hideCompletion();
    compFrom = { line: cur.line, ch: cur.ch - back };
    compEl.dataset.kind = here && here.kind ? here.kind : "";
    drawCompletion(true);
}

// a one-line note, for the moments the tool has something to say back

{

document.addEventListener("keydown", (e) => {
    if (e.key === "Escape") { closeDiff(); document.getElementById("keys-panel").hidden = true; }
    // the browser must not offer to save the page when a hand reaches for it
    if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "s") {
        e.preventDefault();
        say("There is nothing to save: the file is written whenever the judge holds.");
    }
});

function namesOf(parsed) {
    const out = new Set();
    for (const [name, d] of parsed.declarations) {
        out.add(name);
        for (const c of d.conformances) out.add(c);
        for (const [k] of d.aliases) out.add(k);
        for (const e of (d.entries || [])) { out.add(e.head); (e.args || []).forEach(a => out.add(a)); }
    }
    for (const [name] of (parsed.topAliases || new Map())) out.add(name);
    return out;
}

function clearFlags() {
    widgets.forEach(w => w.clear()); widgets = [];
    for (let i = 0; i < cm.lineCount(); i++) {
        cm.removeLineClass(i, "background", "line-flag-bad");
        cm.removeLineClass(i, "gutter", "gutter-flag-bad");
    }
}
function applyFlags(refusals) {
    for (const ref of refusals) {
        if ((ref.file || active) !== active) continue;
        const i = ref.line - 1;
        if (i < 0 || i >= cm.lineCount()) continue;
        cm.addLineClass(i, "background", "line-flag-bad");
        cm.addLineClass(i, "gutter", "gutter-flag-bad");
        const note = document.createElement("div");
        note.className = "flag-note"; note.textContent = ref.premise;
        widgets.push(cm.addLineWidget(i, note));
    }
}

let paintedKey = "";
function repaintNames(parsed, refusals) {
    localNames = new Set([...namesOf(parsed), ...siblingNames]);
    jumpable = new Set([...layoutDecls.keys(), ...Object.keys(vocabulary)]);
    unresolved = new Set();
    for (const ref of (refusals || [])) {
        const m = ref.premise.match(/\b([A-Z]\w*)(?:\.\w+)? resolves to nothing|the name ([A-Z]\w*) resolves/);
        if (m) unresolved.add(m[1] || m[2]);
    }
    const key = [...localNames].sort().join(",") + "|" + [...unresolved].sort().join(",");
    if (key !== paintedKey) { paintedKey = key; cm.setOption("mode", "gate-swift"); }
}

async function render() {
    const text = editor.value;
    const local = judge(active || "gate.swift", text);
    lastParsed = local.parsed;
    if (viewingShelf) {
        repaintNames(local.parsed, []);          // names highlight; nothing refuses
        clearFlags();
        badFiles = new Set(); buildRail();
        document.getElementById("status").innerHTML =
            "<b>" + viewingShelf + ".swift</b> · on the shelf, judged by <code>gate stdlib</code>";
        document.getElementById("chip").outerHTML =
            '<span class="chip" id="chip" style="background:var(--mist);color:var(--muted)">reference</span>';
        document.getElementById("next").textContent = "";
        document.getElementById("verdicts").innerHTML = "";
        applyMyJournal(); applyMyBench();
        return;
    }
    let r;
    if (files.length > 1) {
        r = await (await fetch("/verdict?f=" + encodeURIComponent(active), { method: "POST", body: text })).json();
        r.declarations = files.length + " files"; r.premises = "judged together"; r.milliseconds = r.judge_ms || 0;
        r.refusals = r.refusals.map(x => { const [f, line] = x.address.split(":"); return { file: f, line: +line, premise: x.claim }; });
    } else {
        r = local; r.refusals = r.refusals.map(x => ({ file: active, line: x.line, premise: x.premise }));
    }
    lastRefusals = r.refusals;
    repaintNames(local.parsed, r.refusals);
    document.getElementById("status").innerHTML =
        (files.length > 1
            ? "<b>" + r.declarations + "</b> " + r.premises
            : "<b>" + r.declarations + "</b> declarations · <b>" + r.premises + "</b> claims checked")
        + " · " + (+r.milliseconds).toFixed(1) + " ms";
    const pending = r.refusals.filter(x => /states none/.test(x.premise));
    const broken = r.refusals.filter(x => !/states none/.test(x.premise));
    document.getElementById("chip").outerHTML = broken.length
        ? '<span class="chip bad" id="chip" title="' + broken.length
            + ' claims disagree with the rest. Each is listed below, with its line.">refuses '
            + broken.length + '</span>'
        : pending.length
        ? '<span class="chip" id="chip" style="background:color-mix(in srgb,var(--law) 15%,transparent);color:var(--law)" title="'
            + pending.length + ' slots are not filled in yet. Nothing disagrees; the record is just unfinished.">'
            + pending.length + ' to fill</span>'
        : '<span class="chip ok" id="chip" title="Every claim in these files agrees with every other one.">holds</span>';
    clearFlags(); applyFlags(r.refusals);
    showNext();
    badFiles = new Set(r.refusals.map(x => x.file || active).filter(Boolean));
    buildRail();
    // the verdict list, docked at the bottom (Xcode status): disagreements
    // first, then the slots still to fill, calmer
    const v = document.getElementById("verdicts");
    v.innerHTML = "";
    const rowFor = (ref, cls) => {
        const row = document.createElement("div");
        row.className = cls;
        // a "states none" claim reads plainly: which record owes which axis
        const m = /requires (\w+): (\w+) states none/.exec(ref.premise);
        const label = m ? m[2] + " · " + m[1] + " is not filled in yet" : ref.premise;
        // the address is a fact like any other address; the judge's sentence is
        // speech, and a slot still to fill speaks in the second voice — it is
        // not a disagreement, so it never wears the first
        row.innerHTML = '<code class="fact">' + (ref.file || active) + ":" + ref.line
            + '</code><span class="' + (cls === "pending" ? "caption" : "speech") + '">' + label + "</span>";
        row.onclick = async () => {
            navFrom = navHere();
            const target = ref.file && files.includes(ref.file) ? ref.file : active;
            if (target !== active) await loadFile(target);
            reveal(ref.line);
        };
        return row;
    };
    for (const ref of broken) v.appendChild(rowFor(ref, "refusal"));
    if (pending.length) {
        const head = document.createElement("div");
        head.className = "pending-head caption";
        head.textContent = pending.length + (pending.length === 1 ? " slot" : " slots") + " to fill";
        v.appendChild(head);
        for (const ref of pending) v.appendChild(rowFor(ref, "pending"));
    }
    const guards = benchGuards();
    if (guards.length) {
        const head = document.createElement("div");
        head.className = "pending-head caption";
        head.textContent = "the bench genre";
        v.appendChild(head);
        for (const g of guards) {
            const row = document.createElement("div");
            row.className = "pending";   // guarded, not judged: addressed, calm, never the red a fact earns
            row.innerHTML = '<code class="fact">' + g.file + ":" + g.line + '</code><span class="caption">' + esc(g.decl + "." + g.axis)
                + " = " + esc(g.value) + " · the bench genre states " + esc(g.allowed) + "</span>";
            row.onclick = async () => {
                navFrom = navHere();
                if (g.file !== active && files.includes(g.file)) await loadFile(g.file);
                reveal(g.line);
            };
            v.appendChild(row);
        }
    }
    if (mode === "table") buildTables();
    if (mode === "bare") document.getElementById("bare").innerHTML = bareForm(lastParsed);
    applyMyJournal();   // the journal follows the declaration, as you edit it
    applyMyBench();     // and so does the theme
}

// the one step that comes next, chosen by what this repository already has —
// the same sentence the CLI ends with, so the bench and the terminal agree
let nextShown = "";
async function showNext() {
    try {
        const st = await (await fetch("/status")).json();
        const line = st.next || "";
        if (line === nextShown) return;
        nextShown = line;
        document.getElementById("next").textContent = line ? "next: " + line : "";
    } catch { }
}

// the honest state: has the working-copy file drifted from git, or is it committed
async function refreshGit() {
    const el = document.getElementById("gitstate");
    try {
        const g = (await (await fetch("/gitstatus?f=" + encodeURIComponent(active))).json()).git;
        el.className = g === "committed" ? "committed" : "modified";
        el.innerHTML = '<span class="g"></span>' + (g === "committed" ? "committed"
            : g === "untracked" ? "not in git yet" : "not committed yet");
    } catch { el.className = ""; el.textContent = ""; }
}

// ── the Table surface: the ACTIVE file projected as relations, so all three
// views (Full · Bare · Table) show the same file. Cross-file names still jump
// (declFile) and the wave still respects siblings; only the projection is
// per-file, matching the code. ──
function activeDecls() { return lastParsed ? lastParsed.declarations : new Map(); }
function tableGroups() {
    if (!lastParsed) return [];
    const buckets = new Map();
    for (const d of activeDecls().values()) {
        if (d.aliases.size === 0) continue;
        const keys = [...d.aliases.keys()].sort();
        const sig = d.conformances.join("+") + " · " + keys.join(",");
        if (!buckets.has(sig)) buckets.set(sig, { conformances: d.conformances, keys, rows: [] });
        buckets.get(sig).rows.push(d);
    }
    const groups = [...buckets.values()].filter(g => g.rows.length >= 2);
    for (const g of groups) g.rows.sort((a, b) => a.line - b.line);
    groups.sort((a, b) => a.rows[0].line - b.rows[0].line);
    return groups;
}
function layoutOrActive() { return layoutDecls.size ? layoutDecls : (lastParsed ? lastParsed.declarations : new Map()); }

// the ledgers: declarations whose body is a list of gate entries (VerifiedView,
// VerifiedInDepartment …). Each becomes a table of the entry's arguments.
function ledgerGroups() {
    const out = [];
    for (const [name, d] of activeDecls()) {
        const entries = (d.entries || []).filter(e => e.args && e.args.length);
        if (entries.length < 2) continue;
        const byHead = new Map();
        for (const e of entries) {
            if (!byHead.has(e.head)) byHead.set(e.head, []);
            byHead.get(e.head).push(e);
        }
        for (const [head, es] of byHead)
            if (es.length >= 2) out.push({ owner: name, head, cols: es[0].args.length, rows: es });
    }
    return out;
}

// the landing is visible: the whole line selected, a brief flash, scrolled with margin
let navBack = [], navForward = [], navMuted = false, navFrom = null, compScaffold = null;
// a place is a file, a view, and a spot in it — the view is part of where you were
function navHere() { return { file: active, mode, pos: cm.getCursor() }; }
function updateNavButtons() {
    const b = document.getElementById("nav-back"), f = document.getElementById("nav-fwd");
    if (b) b.disabled = !navBack.length;
    if (f) f.disabled = !navForward.length;
}
function recordJump(from) {
    // a real jump only: same spot is not history
    if (navMuted) return;
    if (from && (from.file !== active || Math.abs(from.pos.line - cm.getCursor().line) > 1)) {
        navBack.push(from); navForward = [];
    }
    updateNavButtons();
}
async function navGo(stackFrom, stackTo) {
    if (!stackFrom.length) return;
    stackTo.push(navHere());
    const there = stackFrom.pop();
    navMuted = true;
    if (there.file && there.file !== active && files.includes(there.file)) await loadFile(there.file);
    setMode(there.mode || "full");          // restore the view before the spot in it
    cm.setCursor(there.pos);
    if (there.mode !== "bare" && there.mode !== "table") { cm.scrollIntoView(there.pos, 120); cm.focus(); }
    navMuted = false;
    updateNavButtons();
}

function reveal(line) {
    const from = navFrom || navHere();      // set before a file switch, if any
    navFrom = null;
    setMode("full");
    const local = Math.max(0, Math.min(line - 1, cm.lineCount() - 1));
    cm.focus();
    cm.setSelection({ line: local, ch: 0 }, { line: local, ch: cm.getLine(local).length });
    cm.scrollIntoView({ line: local, ch: 0 }, 120);
    cm.addLineClass(local, "background", "line-flash");
    setTimeout(() => cm.removeLineClass(local, "background", "line-flash"), 1200);
    recordJump(from);
}

async function jumpTo(name) {
    navFrom = navHere();
    const f = declFile.get(name);
    if (f && f !== active) await loadFile(f);   // a name in another file opens that file
    const d = layoutOrActive().get(name);
    if (d) return reveal(d.line);
    const mod = vocabulary[name];               // a name from a genre: open the genre
    if (mod) return openShelf(mod, name);
}

// the shelf, read-only: where the names your world speaks are declared
async function openShelf(mod, name) {
    const text = await (await fetch("/shelf?m=" + encodeURIComponent(mod))).text();
    active = ""; viewingShelf = mod;             // reference, not one of your files
    document.getElementById("fname").textContent = mod + ".swift";
    document.getElementById("fname").style.display = "";
    setMode("full");
    cm.setValue(text);
    cm.setOption("readOnly", true);
    buildRail();
    say(mod + ".swift is on the shelf, not in your repository: read it here, or "
        + "`gate stdlib materialize " + mod + "` to make it yours.");
    if (name) {
        const i = text.split("\n").findIndex(l => new RegExp("\\b" + name + "\\b").test(l)
            && /^\s*(public\s+)?(enum|protocol|struct|typealias)/.test(l));
        if (i >= 0) reveal(i + 1);
    }
}

function buildTables() {
    const host = document.getElementById("table-host");
    host.innerHTML = "";
    const badLines = new Set(lastRefusals.map(r => r.line));
    const groups = tableGroups();
    const ledgers = ledgerGroups();
    if (!groups.length && !ledgers.length) { host.innerHTML = '<h3>no relations to project</h3>'; return; }
    // the ledgers first: who → what, one row per entry
    for (const L of ledgers) {
        const h = document.createElement("h3");
        h.textContent = L.owner + " · " + L.head + " · " + L.rows.length + " entries";
        h.style.cursor = "pointer"; h.onclick = () => jumpTo(L.owner);
        host.append(h);
        const table = document.createElement("table");
        const sig = "ledger:" + L.owner + ":" + L.head;
        const mark = (k) => tableSort && tableSort.sig === sig && tableSort.key === k
            ? ' <span class="dir">' + (tableSort.dir > 0 ? "↓" : "↑") + "</span>" : "";
        const head = document.createElement("tr");
        for (let c = 0; c < L.cols; c++) {
            const th = document.createElement("th"); th.className = "caption";
            th.innerHTML = (c === 0 ? "who" : c === 1 ? "what" : "arg " + (c + 1)) + mark(c);
            th.onclick = () => {
                const dir = tableSort && tableSort.sig === sig && tableSort.key === c ? -tableSort.dir : 1;
                tableSort = { sig, key: c, dir }; buildTables();
            };
            head.append(th);
        }
        table.append(head);
        let entries = L.rows;
        if (tableSort && tableSort.sig === sig)
            entries = [...entries].sort((a, b) =>
                tableSort.dir * (a.args[tableSort.key] ?? "").localeCompare(b.args[tableSort.key] ?? "", undefined, { numeric: true }));
        for (const e of entries) {
            const tr = document.createElement("tr");
            e.args.forEach((a, c) => {
                const td = document.createElement("td");
                td.className = "fact " + (c === 0 ? "cell-name" : "cell-value");
                td.textContent = a;
                if (badLines.has(e.line)) td.classList.add("cell-bad");
                if (declFile.has(a)) { td.style.cursor = "pointer"; td.onclick = () => jumpTo(a); }
                tr.append(td);
            });
            table.append(tr);
        }
        host.append(table);
    }
    for (const group of groups) {
        const h = document.createElement("h3");
        h.textContent = group.conformances.join(", ") + " · " + group.rows.length + " rows";
        h.style.cursor = "pointer";
        h.onclick = () => jumpTo(group.rows[0].name);
        host.append(h);
        const table = document.createElement("table");
        const sig = group.conformances.join("+") + group.keys.join(",");
        const mark = (k) => tableSort && tableSort.sig === sig && tableSort.key === k
            ? ' <span class="dir">' + (tableSort.dir > 0 ? "↓" : "↑") + "</span>" : "";
        const head = document.createElement("tr");
        for (const key of ["name", ...group.keys]) {
            const th = document.createElement("th"); th.className = "caption";
            th.innerHTML = key + mark(key);
            th.onclick = () => {
                const dir = tableSort && tableSort.sig === sig && tableSort.key === key ? -tableSort.dir : 1;
                tableSort = { sig, key, dir }; buildTables();
            };
            head.append(th);
        }
        table.append(head);
        let rows = group.rows;
        if (tableSort && tableSort.sig === sig) {
            const val = (d) => tableSort.key === "name" ? d.name : (d.aliases.get(tableSort.key)?.target ?? "");
            rows = [...rows].sort((a, b) => tableSort.dir * val(a).localeCompare(val(b), undefined, { numeric: true }));
        }
        for (const d of rows) {
            const tr = document.createElement("tr");
            const name = document.createElement("td");
            name.className = "fact cell-name"; name.textContent = d.name;
            name.title = "go to line " + d.line; name.onclick = () => jumpTo(d.name);
            tr.append(name);
            for (const key of group.keys) {
                const td = document.createElement("td");
                td.className = "fact cell-value";
                td.textContent = d.aliases.get(key)?.target ?? "";
                if (badLines.has(d.line)) td.classList.add("cell-bad");
                tr.append(td);
            }
            table.append(tr);
        }
        host.append(table);
    }
}

// ── one row of views over the same file: Full · Bare · Table (· Canvas one
// day). Not two switches of one state — three views of one truth. ──
let mode = "full";
const esc = (s) => s.replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));

// Bare: the bare form — the facts with the language's ceremony gone. No enum,
// no typealias, no public, no braces; scope is indentation, the way Python
// scopes. Read-only, but a full view: highlighted, every name a link to its
// declaration, an unresolved name waving the way the editor waves.
function nameTokens(raw) {
    // wrap each Capitalized identifier: a declared name jumps, an unresolved
    // name waves, a word after a dot is an axis, the rest is a known name
    return esc(raw).replace(/(\.?)\b([A-Z][A-Za-z0-9_]*)\b/g, (m, dot, name) => {
        if (dot === ".") return dot + '<span class="known">' + name + "</span>";
        if (unresolved.has(name)) return '<span class="known bad">' + name + "</span>";
        if (layoutOrActive().has(name)) return '<span class="jump" data-jump="' + name + '">' + name + "</span>";
        return '<span class="known">' + name + "</span>";
    });
}
function bareForm(parsed) {
    const badLines = new Set(lastRefusals.map(r => r.line));
    const order = parsed.order || [...parsed.declarations.keys()];
    const out = [];
    const declSpan = (name, line, bad) =>
        '<span class="decl' + (bad ? " bad" : "") + '" data-jump="' + name + '">' + esc(name) + "</span>";
    for (const name of order) {
        const d = parsed.declarations.get(name);
        if (!d) continue;
        const bad = badLines.has(d.line);
        const conf = d.conformances.length ? '<span class="conf">: </span>' + nameTokens(d.conformances.join(", ")) : "";
        out.push('<span class="' + (bad ? "row-bad" : "") + '">' + declSpan(name, d.line, bad) + conf + "</span>");
        for (const [k, v] of d.aliases)
            out.push("    " + esc(k) + " = " + nameTokens(v.target));
        for (const e of (d.entries || [])) {
            const args = e.args && e.args.length ? "<" + e.args.join(", ") + ">" : "";
            out.push("    " + nameTokens(e.head + args));
        }
        if (d.aliases.size || (d.entries || []).length) out.push("");
    }
    for (const [name, a] of (parsed.topAliases || new Map()))
        out.push(declSpan(name, a.line, false) + " = " + nameTokens(a.target));
    return out.join("\n");
}
// one delegated handler: a name in the bare view jumps to its declaration
document.getElementById("bare").addEventListener("click", (e) => {
    const t = e.target.closest("[data-jump]");
    if (t) jumpTo(t.dataset.jump);
});

function setMode(m) {
    mode = m;
    document.getElementById("editor-host").style.display = m === "full" ? "" : "none";
    document.getElementById("bare").style.display = m === "bare" ? "block" : "none";
    document.getElementById("table-host").style.display = m === "table" ? "block" : "none";
    document.querySelectorAll("#view-seg button").forEach(b => b.classList.toggle("on", b.dataset.m === m));
    if (m === "bare" && lastParsed) document.getElementById("bare").innerHTML = bareForm(lastParsed);
    if (m === "table") buildTables();
    if (m === "full") cm.refresh();
}
document.querySelectorAll("#view-seg button").forEach(b => b.onclick = () => setMode(b.dataset.m));
// the bar's arrows are the keyboard jump history made visible — the same navGo,
// no second stack. Xcode wears Ctrl-Cmd-arrows; the browser and VS Code, Alt.
document.getElementById("nav-back").onclick = () => navGo(navBack, navForward);
document.getElementById("nav-fwd").onclick = () => navGo(navForward, navBack);
{
    const combo = MAC ? "⌃⌘" : "Alt+";
    document.getElementById("nav-back").title = "Step back to where you jumped from  (" + combo + "←)";
    document.getElementById("nav-fwd").title = "Step forward to where you jumped  (" + combo + "→)";
}
updateNavButtons();

// No buffer of our own: an edit goes to the working-copy file, and git is the
// only state. But ONLY a holding world is written — a refused (invalid) world
// never reaches the file, so git reflects only worlds that hold. The invalid
// state lives only in the editor buffer until it holds again. A programmatic
// load (setValue) judges without writing.
let timer = null;
cm.on("change", (_, change) => {
    clearTimeout(timer);
    const userEdit = change.origin && change.origin !== "setValue";
    // offer while somebody edits a word — typing it or deleting back into it:
    // after a delete the hole is the same hole, and the grammar answers it
    if (change.origin === "+input" && /^[\w =.]+$/.test(change.text.join(""))) offerCompletion();
    else if (change.origin === "+delete") offerCompletion();
    else hideCompletion();
    timer = setTimeout(() => tick(userEdit), userEdit ? 400 : 150);
});
cm.on("blur", () => setTimeout(hideCompletion, 120));
cm.on("cursorActivity", () => { if (!compEl.hidden && !compFrom) hideCompletion(); });

// ── the cursor on a name says what it is: a declaration here and what it
// conforms to, a value and its kind, an axis and what it takes, a gate and
// its arguments. Every word of it is read from the world and the genre, so a
// client's own domain describes itself with no dictionary of ours. ──
function describeName(name) {
    const d = layoutDecls.get(name);
    if (d && d.conformances && d.conformances.length) {
        const kinds = d.conformances.filter(c => protoAxes[c]);
        const plain = d.conformances.filter(c => !protoAxes[c]);
        if (gates[name]) return name + " · a gate: " + name + "&lt;" + gates[name].join(", ") + "&gt;";
        return name + " · " + (plain.length ? "a " + plain.join(", ") + " " : "") + "record"
            + (kinds.length ? ", of kind " + kinds.join(", ") : "");
    }
    if (d) return name + " · declared here";
    if (gates[name]) return name + " · a gate: takes " + gates[name].join(", ");
    for (const [kind, atoms] of Object.entries(conformers))
        if (atoms.includes(name)) return name + " · a value of kind " + kind
            + (vocabulary[name] ? " (from " + vocabulary[name] + ")" : "");
    if (protoAxes[name]) return name + " · a kind, with " + Object.keys(protoAxes[name]).join(", ")
        + (vocabulary[name] ? " (from " + vocabulary[name] + ")" : "");
    if (vocabulary[name]) return name + " · declared in " + vocabulary[name];
    return null;
}

function describeAxis(host, axis) {
    const kind = host ? axesOfHost(host)[axis] : (axisOf[axis]);
    if (!kind) return null;
    return axis + " · an axis, takes " + kind;
}

let inspectFrame = 0;
function scheduleInspect() {
    if (inspectFrame) return;
    inspectFrame = requestAnimationFrame(() => { inspectFrame = 0; inspect(); });
}
function inspect() {
    const el = document.getElementById("inspect");
    const cur = cm.getCursor();
    const tok = cm.getTokenAt(cur, true);
    const name = (tok.string || "").trim();
    if (!/^[A-Z]\w*$/.test(name)) { el.textContent = ""; return; }
    const line = cm.getLine(cur.line) || "";
    const isAxis = new RegExp("typealias\\s+" + name + "\\s*=").test(line)
        || new RegExp("associatedtype\\s+" + name + "\\b").test(line);
    const { host } = placeAt(cur);
    const text = (isAxis && describeAxis(host, name)) || describeName(name);
    if (!text) { el.textContent = ""; return; }
    el.innerHTML = text + (jumpable.has(name) ? " · " + (MAC ? "\u2318" : "Ctrl") + "-click opens it" : "");
}
cm.on("cursorActivity", scheduleInspect);
async function tick(write) {
    await render();                         // judges the buffer first
    const holds = lastRefusals.length === 0;
    if (write && holds) {
        await fetch("/world?f=" + encodeURIComponent(active), { method: "PUT", body: editor.value });
        refreshGit();
    } else if (write) {
        // invalid: withhold the write, say so plainly
        const el = document.getElementById("gitstate");
        el.className = "modified";
        el.innerHTML = '<span class="g"></span>refused: nothing written';
        el.title = "The judge refused this text, so it was not written to the file. "
                 + "Your edit is here in the editor until it holds again.";
    }
}

async function siblings() {
    siblingNames = new Set(); layoutDecls = new Map(); declFile = new Map();
    for (const f of files) {
        const t = f === active ? editor.value : await (await fetch("/world?f=" + encodeURIComponent(f))).text();
        const parsed = judge(f, t).parsed;
        if (f !== active) namesOf(parsed).forEach(n => siblingNames.add(n));
        for (const [name, d] of parsed.declarations) if (!layoutDecls.has(name)) { layoutDecls.set(name, d); declFile.set(name, f); }
    }
}
async function loadFile(name) {
    cm.setOption("readOnly", false); viewingShelf = null;
    active = name;
    document.getElementById("fname").textContent = name;
    buildRail();
    const t = await (await fetch("/world?f=" + encodeURIComponent(name))).text();
    editor.value = t;   // setValue: judged, not written
    await siblings();
    render();
    refreshGit();
}

// ── the file rail is a panel you can drag, like the others. The limit is the
// window, not a number somebody picked: drag it wide to read the journal, drag
// it away to read the code. Double-click returns it. ──
function makeSplit(el, panel, min, maxOf) {
    let drag = null, frame = null;
    el.addEventListener("pointerdown", (e) => {
        drag = { fromX: e.clientX, fromW: panel.getBoundingClientRect().width };
        el.classList.add("dragging"); try { el.setPointerCapture(e.pointerId); } catch {} e.preventDefault();
    });
    el.addEventListener("pointermove", (e) => {
        if (!drag) return; drag.lastX = e.clientX;
        if (frame) return;
        frame = requestAnimationFrame(() => {
            frame = null; if (!drag) return;
            const max = typeof maxOf === "function" ? maxOf() : maxOf;
            const w = Math.max(min, Math.min(max, drag.fromW + (drag.lastX - drag.fromX)));
            panel.style.flex = "0 0 " + w + "px";
        });
    });
    const done = () => { drag = null; el.classList.remove("dragging"); };
    el.addEventListener("pointerup", done); el.addEventListener("pointercancel", done);
    el.addEventListener("dblclick", () => { panel.style.flex = ""; });
}
makeSplit(document.getElementById("split-rail"), document.getElementById("rail"),
          120, () => Math.max(360, window.innerWidth - 320));

// ── the rail remembers how you left it: which sections are open, and how wide.
// Nothing here is a fact about the world, so it lives in the browser, not in git.
const LAYOUT = "gate.bench.layout";
function layout() {
    try { return JSON.parse(localStorage.getItem(LAYOUT) || "{}"); } catch { return {}; }
}
function saveLayout(patch) {
    try { localStorage.setItem(LAYOUT, JSON.stringify({ ...layout(), ...patch })); } catch { }
}
function applyFold(name, shut) {
    const head = document.querySelector('h3[data-fold="' + name + '"]');
    const body = head.nextElementSibling;
    head.classList.toggle("shut", shut);
    body.classList.toggle("shut", shut);
    head.title = shut ? "Show " + name : "Hide " + name;
}
for (const head of document.querySelectorAll("h3.fold")) {
    const name = head.dataset.fold;
    applyFold(name, !!layout()["shut_" + name]);
    head.onclick = () => {
        const shut = !head.classList.contains("shut");
        applyFold(name, shut);
        saveLayout({ ["shut_" + name]: shut });
    };
}
{   // the width you dragged it to, next time as well
    const rail = document.getElementById("rail"), w = layout().railWidth;
    if (w) rail.style.flex = "0 0 " + w + "px";
    const split = document.getElementById("split-rail");
    split.addEventListener("pointerup", () =>
        saveLayout({ railWidth: Math.round(rail.getBoundingClientRect().width) }));
    split.addEventListener("dblclick", () => saveLayout({ railWidth: 0 }));
}

// ── one reader: the bench builds its vocabulary from the SAME judge that judges
// the world, run over the shelf's own text. What each name is, what it conforms
// to, the axes each protocol owes with their kind, and the parameters each gate
// takes are all read from that parse — no second regex on the server beside the
// judge in the browser. Names use each declaration's own short name: a one-line
// enum body leaves its opener on the parse stack, so a later gate is read as its
// child, but the short name is the one the world speaks. ──
async function loadVocabulary() {
    vocabulary = {}; conformers = {}; axisOf = {}; protoAxes = {}; gates = {};
    const list = await (await fetch("/shelf")).json().catch(() => ({}));
    for (const mod of (list.modules || [])) {
        const text = await (await fetch("/shelf?m=" + encodeURIComponent(mod))).text();
        // reading the shelf, not judging a world: the extras parse (a truthy
        // vocabulary turns it on) reads a genre's top-level certificates as
        // vocabulary instead of refusing them the way the plain world judge
        // must. The world judge stays plain — its parity is with the CLI.
        const READ = { seeds: new Set(), generics: new Set() };
        for (const d of judge(mod + ".swift", text, READ).parsed.declarations.values()) {
            if (!(d.name in vocabulary)) vocabulary[d.name] = mod;
            if (d.axes) {                                   // a protocol: the axes it owes, and of what kind
                for (const [axis, kind] of Object.entries(d.axisKinds || {})) {
                    (protoAxes[d.name] || (protoAxes[d.name] = {}))[axis] = kind;
                    if (!(axis in axisOf)) axisOf[axis] = kind;
                }
            } else if (d.params && d.params.length) {       // a gate: what each parameter takes, in order
                gates[d.name] = d.paramKinds || [];
            } else {                                        // a plain atom: what it stands in for
                for (const conf of d.conformances) {
                    const c = conf.trim();
                    if (c) (conformers[c] || (conformers[c] = [])).push(d.name);
                }
            }
        }
    }
}

(async () => {
    await loadVocabulary();
    const fl = await (await fetch("/files")).json().catch(() => ({ files: [] }));
    files = fl.files || []; personalFile = fl.personal || null; personalEmpty = !!fl.personal_empty;
    // the rail carries files AND the journal, so it shows for any clone
    // the line says what is true HERE: with a world, the judge is at work;
    // without one, only the history is being read
    document.getElementById("brandline").textContent = files.length
        ? "Every claim in these files is judged as you type. A lie cannot be saved."
        : "Reading this repository's history. Nothing here is judged yet.";
    document.getElementById("rail").style.display = "flex";
    document.getElementById("split-rail").style.display = "block";
    document.getElementById("fname").style.display = "none";
buildRail();
    await buildJournal();
    if (!files.length) return showEmpty();   // no world here yet
    await loadFile(files[0] || "gate.swift");
})();

// ── no world yet: the journal on the left is already live, and these are the
// two ways to get one. Nobody is asked to read a manual first. ──
function showEmpty() {
    document.getElementById("editor-host").style.display = "none";
    document.getElementById("verdict-panel").style.display = "none";
    document.getElementById("view-seg").style.display = "none";
    document.querySelector("#rail h3").style.display = "none";   // no files, no heading
    const host = document.getElementById("table-host");
    host.style.display = "block";
    // say only what is true HERE: a repository with no commits has no journal
    const lead = journalCommits.length
        ? "The journal on the left is already reading this repository: every commit, who wrote "
          + "it, whether it is merged. That needs no translation at all."
        : "This repository has no commits yet, so there is nothing to read on the left either. "
          + "A world is the place to start.";
    host.innerHTML =
        '<div class="empty"><h2>No world here yet</h2><p>' + lead + "</p>"
        + '<div class="door"><code>gate demo</code><span>Run this in a terminal: it builds a world of people and grants, with a lie already in it. Thirty seconds.</span></div>'
        + '<div class="door"><code>cp your.csv tables/ &amp;&amp; gate status</code><span>Drop a table you already export into tables/, and your own rows become a world the judge can read.</span></div>'
        + "</div>";
}
</script>
