name: battery
on: [push, pull_request]
jobs:
  green:
    runs-on: macos-latest
    permissions:
      contents: read
      statuses: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4
      # the runner's own Xcode swift builds the corpus: a pinned separate
      # toolchain met an SDK built by a newer one and refused, so no
      # toolchain is installed here on purpose
      # the judge is rebuilt from the public theory corpus at the pin,
      # so the battery never trusts a stale vendored binary
      - run: bin/build-judge.sh d74e258
      # the same tee as linux: this job went red once with its log closed
      # and its mouth shut, and a red nobody can read is a red that gets
      # guessed at. One mechanism, both platforms.
      - run: |
          python3 tests/smoke.py 2>&1 | tee /tmp/smoke-out.txt
          exit ${PIPESTATUS[0]}
      - if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # ── AND THE PREAMBLE DOES NOT EAT THE FINDING. A status field is 138
          # letters wide, and this took the first three lines that looked like
          # a red: on a clean checkout the first of them is always "no binary
          # in this clone", which is the battery saying hello. Three runs in a
          # row spent their whole budget on it and cut the diagnostic off at
          # its first letter. What a run says about itself before anything has
          # failed is not what travels.
          SAID=$(grep -E '^FAIL|^   ' /tmp/smoke-out.txt \
                 | grep -v 'no binary in this clone' | head -3 \
                 | paste -sd '; ' - || true)
          [ -n "$SAID" ] || SAID=$(tail -1 /tmp/smoke-out.txt)
          BODY=$(python3 -c 'import json,sys; print(json.dumps({"state":"failure","context":"macos-first-fail","description":sys.argv[1][:138]}))' "$SAID")
          curl -s -X POST -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d "$BODY" > /dev/null
      # the camera's subject: the battery above compiles the vein into its
      # own scratch and sweeps it, so a fresh runner holds no binary here.
      # The shot is of this revision's bench, and the subject is built first.
      - run: bin/build-cli.sh
      # a fresh shot of the bench on every run, downloadable from the run's
      # artifacts. The battery holds docs/bench.png.from to web/ui.html, so a
      # stale committed picture is already red above; committing the fresh
      # one stays a human act.
      # the cover's cost sentence, held rather than measured once:
      # ten times the claims may cost more, and not by a different order
      - run: python3 bin/bench.py --check
      # ── AND THE CAMERA HAS A CLOCK. This step took seven minutes on the
      # runner against fifteen seconds here, and with no bound of its own a
      # slow shot reads as a hung job: the run sat past an hour before anybody
      # asked. Ten minutes is forty times the local shot; past that, something
      # is wrong rather than slow, and the red says so.
      - run: |
          ( sleep 600; echo "shoot-bench: past ten minutes, something is wrong rather than slow" >&2; pkill -f shoot-bench.sh ) &
          WATCH=$!
          bash bin/shoot-bench.sh
          kill $WATCH || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02   # v4
        with:
          name: bench-shot
          path: |
            docs/bench.png
            docs/bench.png.from
  linux:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      statuses: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4
      # the same full battery, on the platform where the port serves both
      # courts by default. The judge is still built here, from the same pin
      # as the macos job: the parity vectors are the point of this job, and
      # they need both carriers standing on one machine. Swift comes with
      # the runner image; the guard below says so loudly if it ever leaves.
      - run: |
          command -v swift || { echo "the runner image no longer carries swift; install a toolchain step here"; exit 1; }
          swift --version
      - run: bin/build-judge.sh d74e258
      - run: |
          python3 tests/smoke.py 2>&1 | tee /tmp/smoke-out.txt
          exit ${PIPESTATUS[0]}
      # the first red line travels out as a commit status, because the job
      # log is not readable without a token and a failure nobody can read
      # is a failure that gets guessed at instead of fixed
      #
      # AND THE DIAGNOSTIC TRAVELS WITH IT. The battery prints what a check
      # found on the line above its name, indented, and only the names were
      # shipped: a red that says "the two surfaces answer apart" without the
      # fields it found apart is a name to guess at, which is the thing this
      # step exists against. Measured the hard way: that exact check went red
      # here twice, held on a machine that could not reproduce it, and the
      # list of differing fields was sitting in a log nobody may read.
      - if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # ── AND THE PREAMBLE DOES NOT EAT THE FINDING. A status field is 138
          # letters wide, and this took the first three lines that looked like
          # a red: on a clean checkout the first of them is always "no binary
          # in this clone", which is the battery saying hello. Three runs in a
          # row spent their whole budget on it and cut the diagnostic off at
          # its first letter. What a run says about itself before anything has
          # failed is not what travels.
          SAID=$(grep -E '^FAIL|^   ' /tmp/smoke-out.txt \
                 | grep -v 'no binary in this clone' | head -3 \
                 | paste -sd '; ' - || true)
          [ -n "$SAID" ] || SAID=$(tail -1 /tmp/smoke-out.txt)
          BODY=$(python3 -c 'import json,sys; print(json.dumps({"state":"failure","context":"linux-first-fail","description":sys.argv[1][:138]}))' "$SAID")
          curl -s -X POST -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d "$BODY" > /dev/null
  # ── AND THE REVIEWER'S ROAD RUNS WHERE THE TOOL IS. This walk had a job of
  # its own that checked out and ran, because the CLI was python and needed
  # nothing built. The tool is a binary now, so the road runs in the job that
  # builds one: a checkout with no binary can only be told where to get one,
  # which is not a measurement of anything.
  # ── AND THE VEIN IS BUILT WHERE IT HAS NEVER BEEN BUILT. The shipping plan is
  # one binary per platform, and windows is the one this vein has never met: its
  # socket calls come from WinSDK under names of their own, and Foundation
  # differs where paths and processes are concerned. A build is not a battery
  # and does not pretend to be one: what this job says is that the source
  # compiles there and the binary answers the one question the python side asks
  # it. Everything past that is measured by the battery on the platforms that
  # have one, until this one grows its own.
  windows-vein:
    runs-on: windows-latest
    permissions:
      contents: read
      statuses: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4
      # ── AND THE TOOLCHAIN IS A CHOICE THAT WAS MEASURED. 6.0.3 met the
      # runner's Visual Studio headers and stopped at a cyclic dependency in
      # `mm_malloc.h`, which is the compiler's own include and nothing this
      # repository writes. The version is the first thing to move when that
      # happens, and the red line said so by name.
      - uses: compnerd/gha-setup-swift@eeda069c5bc95ac8a9ac5cea7d4f588ae5420ca5   # v0.4.0
        with:
          branch: swift-6.1.2-release
          tag: 6.1.2-RELEASE
      - run: swift --version
      # ── AND THE BUILD'S OWN WORDS ARE KEPT IN THE CLONE, not in the shell's
      # temp: the step below renames what `/tmp` means, and a log written there
      # went nowhere, taking the mouth down with it. That run said nothing at
      # all, which is the one failure mode this job exists against.
      # ── AND THE COMPILER IS TOLD WHERE TO PUT ITS OWN SCRATCH, in the
      # spelling it reads. The shell here exports a posix `TMP`, the linker
      # takes that at its word, and it fails to create `lnk{...}.tmp` in a
      # directory that does not exist for it. The runner's own temp is a native
      # path, and naming it is the whole fix: the error never mentioned an
      # environment, only a file it could not open.
      - name: build the vein
        shell: bash
        env:
          TMP: ${{ runner.temp }}
          TEMP: ${{ runner.temp }}
        run: |
          # ── AND THE FACTS TRAVEL WITH THE FAILURE. Three fixes in a row were
          # guesses because the only thing that left this machine was one line
          # naming a file. What the linker is actually given is an environment,
          # and it is written down here so the mouth can carry it out: a guess
          # costs a run in the queue, and printing four values costs nothing.
          echo "shell says TMP=$TMP TEMP=$TEMP RUNNER_TEMP=$RUNNER_TEMP" | tee vein-out.txt
          echo "temp exists: $([ -d "$TMP" ] && echo yes || echo no)" | tee -a vein-out.txt
          echo "cwd=$(pwd) free=$(df -h . | tail -1 | tr -s ' ' | cut -d' ' -f4)" | tee -a vein-out.txt
          bin/build-cli.sh 2>&1 | tee -a vein-out.txt; exit ${PIPESTATUS[0]}
      - if: failure()
        name: what the build actually said
        shell: bash
        run: tail -40 vein-out.txt
      - name: the binary answers what it carries
        shell: bash
        run: |
          CARRIED=$(bin/gate-cli.exe --carries | tr -d '\r' | wc -l | tr -d ' ')
          echo "the vein carries $CARRIED veins" | tee -a vein-out.txt
          [ "$CARRIED" = "30" ] || { echo "the ledger this binary prints is not the one the battery holds" | tee -a vein-out.txt; exit 1; }
      # ── AND THE ROAD WALKS HERE. It could not before: it stopped at the first
      # verb that takes a path, because `gate demo C:\...\demo` made nothing at
      # all. Every path in the vein was spelled the one way, a drive letter is
      # none of those things, and an absolute path on this platform was read as
      # relative and glued onto the working directory. The port put ONE door in
      # front of every reader, and the arithmetic of that door is held by the
      # battery in both spellings, on a machine that is not this one.
      #
      # What is measured HERE is the only thing no other machine can say: that
      # the verbs walk on this platform. The road is the reviewer's own, from
      # the demo to a refusal at its written line, and the cover tells it in
      # one sentence.
      - name: the road a reviewer walks
        shell: bash
        run: |
          python tests/windows.py 2>&1 | tee -a vein-out.txt
          exit ${PIPESTATUS[0]}
      # the compiler's own first line travels out as a status: a build that
      # fails on the one platform nobody here can reproduce is a red somebody
      # guesses at, and the guessing is what this line exists against
      - if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # ── AND THE LINE THAT TRAVELS IS THE ONE THAT NAMES SOMETHING. A
          # linker says `cannot open file X` on one line and `link command
          # failed` on the next, and only the second is an `error:`, so the
          # status carried the sentence that names nothing twice over. What is
          # looked for first is a line that names a file or a symbol; the
          # generic failure is the fallback. The drive letters go either way:
          # a windows path is longer than the whole status field.
          # ── AND THE SED IS FOR PATHS, NOT FOR SENTENCES. A windows path is
          # longer than the whole status field, so a linker line is cut back to
          # the file it names. The road's own FAIL line is a sentence with a
          # path at the END of it, and the same cut left only the last folder:
          # `gate-win-dw4pl1hh`, which names nothing anybody can act on. What
          # the road says travels whole, and the cut stays where it belongs.
          SAID=$(grep -m1 -E '^FAIL' vein-out.txt | paste -sd '; ' - || true)
          [ -n "$SAID" ] || SAID=$(grep -m2 -E 'LNK[0-9]+|cannot open|undefined symbol|unresolved external' \
                 vein-out.txt | sed 's|.*[\\/]||' | paste -sd '; ' - || true)
          [ -n "$SAID" ] || SAID=$(grep -m2 -E 'error:|the ledger this binary' vein-out.txt \
                 | sed 's|.*[\\/]||' | paste -sd '; ' - || true)
          [ -n "$SAID" ] || SAID=$(tail -1 vein-out.txt)
          BODY=$(python -c 'import json,sys; print(json.dumps({"state":"failure","context":"windows-vein-first-fail","description":sys.argv[1][:138]}))' "$SAID")
          curl -s -X POST -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d "$BODY" > /dev/null
          # ── AND THE SECOND SENTENCE THE ROAD SAID TRAVELS TOO. The road tells
          # a failing pair with one line per verb: the first names the verb that
          # stopped, and the one after it carries the verb whose answer was
          # actually wrong. Cut to one line, this mouth reported `demo: exit=0`,
          # which says the step it names did not fail and nothing about what did.
          THEN=$(grep -E '^FAIL' vein-out.txt | sed -n '2p' || true)
          if [ -n "$THEN" ]; then
            # ── AND A SENTENCE IS CUT AT BOTH ENDS, NEVER ONLY THE HEAD. What
            # this carries is a refusal, and a refusal's head is an address
            # already known from the line above it while the thing being hunted
            # (the path that was tried) sits at the END. Cut from the front
            # alone, three runs in a row carried "...no such file exists at"
            # and stopped one character before the answer.
            BODY3=$(python -c 'import json,sys; t=sys.argv[1]; print(json.dumps({"state":"failure","context":"windows-road-then","description":t if len(t)<=138 else t[:56]+" … "+t[-79:]}))' "$THEN")
            curl -s -X POST -H "Authorization: Bearer $GH_TOKEN" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
              -d "$BODY3" > /dev/null
          fi
          # and a third status carrying what the machine was, because the job
          # log is unreadable without a token and one sentence is not a state
          SAW=$(head -3 vein-out.txt | paste -sd '; ' - || true)
          BODY2=$(python -c 'import json,sys; print(json.dumps({"state":"failure","context":"windows-vein-machine","description":sys.argv[1][:138]}))' "$SAW")
          curl -s -X POST -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d "$BODY2" > /dev/null
  pages:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # ── AND TWO PUSHES DO NOT RACE FOR ONE DEPLOYMENT. There is one Pages site
    # and one deployment at a time; without a group, a second push while the
    # first is deploying fails the second, and the run goes red for a reason
    # that is not about this repository at all. That happened on run 123: the
    # battery was green on macos, linux and windows, and the red was a queue.
    # A red nobody can act on teaches people to stop reading red.
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
      statuses: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4
      # ── AND THE PAGE IS BUILT BY THE TOOL, SO THE TOOL IS BUILT FIRST. This
      # job asked the shim on a clean checkout, which can only say where to get
      # a binary: it worked while the CLI was python and needed nothing built.
      # Swift comes with the runner image, the same way the linux job leans on
      # it, and the guard there says so loudly if it ever leaves.
      - run: bin/build-cli.sh
      # the published bench: the same page, the same browser judges, and the
      # server's own answers recorded from a live serve at build time. The
      # build itself is a Linux measure: a demo is born and served under the
      # node port on this runner before anything is published.
      - run: python3 bin/build-pages.py _site
      # the road test: the published page walks the user's own road headless,
      # type to offer to red to green to kept, and refuses to deploy a page
      # where any step of it falls over
      - run: |
          BROWSER=$(command -v google-chrome || command -v chromium-browser || command -v chromium)
          # the camera's own words survive: `2>/dev/null` here meant a browser
          # that could not start failed this step with no reason printed, which
          # is the shape bin/shoot-bench.sh carried until this phase
          "$BROWSER" --headless --disable-gpu --no-sandbox --virtual-time-budget=15000 \
            --dump-dom "file://$PWD/_site/index.html?f=ownership.swift:84&roadtest=1" \
            2>/tmp/road-err.txt | grep -q "ROAD ALL GREEN" \
            || { echo "the road test did not reach ROAD ALL GREEN. What the browser said:"; \
                 tail -5 /tmp/road-err.txt; exit 1; }
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9   # v5.0.0
        with:
          path: _site
      # ── AND PUBLISHING IS ASKED ABOUT BEFORE IT IS ATTEMPTED. `deploy-pages`
      # fails with an empty message when Pages is off or its source is a branch
      # rather than this workflow, and that is what runs 123, 124 and 125 were:
      # checkout, build, road test and artifact all green, one step red with
      # nothing to read. A setting outside the repository is not a claim of the
      # repository, so the run says which it is instead of going red over it.
      - id: site
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          CODE=$(curl -s -o /tmp/pages.json -w '%{http_code}' \
            -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages")
          echo "the pages api answered $CODE"
          if [ "$CODE" = "200" ] && grep -q '"build_type": *"workflow"' /tmp/pages.json; then
            echo "on=true" >> "$GITHUB_OUTPUT"
          else
            echo "on=false" >> "$GITHUB_OUTPUT"
            echo "PUBLISHING IS OFF FOR THIS REPOSITORY."
            echo "Settings > Pages > Source must be GitHub Actions."
            echo "The page was built and walked its own road in the steps above:"
            echo "nothing here is about this repository's claims, and the battery"
            echo "is the other three jobs."
          fi
      - if: steps.site.outputs.on == 'true'
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128   # v5.0.0
      # ── AND A RED FROM THIS JOB SAYS IT IS THIS JOB. Only the linux battery
      # posted a commit status, so a failing deployment left none at all and the
      # run read as a mystery: three of them in a row, with the battery green on
      # three platforms, and the job had to be named by asking the API for it.
      # The page is built and walked before this step, so a red here is about
      # publishing and not about the repository, and the status says which.
      - if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BODY=$(python3 -c 'import json;print(json.dumps({"state":"failure","context":"pages-publish","description":"the page built and walked its road; publishing it failed with Pages switched on. The battery is the other jobs"}))')
          curl -s -X POST -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d "$BODY" > /dev/null

  # ── THE ROAD A STRANGER'S CI WALKS. `uses: ./` runs action.yml from this
  # very push: the published binary is fetched at a pinned tag, its bytes
  # answer to the sha256 beside them, and both mouths judge a fixture. The
  # tag here is one release behind the vein on purpose: on the push that
  # bumps VERSION the new tag has no assets yet, and this job is about the
  # road. The default tag is held to VERSION by the battery instead.
  action:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4
      - name: a tree with a dead row is refused
        id: dead
        continue-on-error: true
        uses: ./
        with:
          version: v0.2.1
          tree: .github/action-fixtures/dead
      - name: and that refusal is this job's negative control
        run: test "${{ steps.dead.outcome }}" = failure
      - name: a clean tree holds
        uses: ./
        with:
          version: v0.2.1
          tree: .github/action-fixtures/clean
