# ── THE ONLY PLACE A SHIPPED BINARY IS BORN. Every executable line in this
# repository stays text, and that rule outlived the carrier it was written for:
# a binary is never committed, it is built. So the ones people download are
# built here, in public, from the public text at a pin, and never on anybody's
# machine.
#
# Beside each binary go the two things that make it checkable: `.from`, the
# revision of the theory corpus its court was compiled from, and a sha256, which
# says WHAT lies there. The check is not the hash: linkers are not byte-stable,
# so the honest check is a rebuild, and the README says that command. The hash
# names the artifact; the rebuild judges it.
name: release
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

# ── AND ONE SCARCE MACHINE DOES NOT HOLD A RELEASE. The first run of this
# road built four platforms in minutes and then sat two hours on a queued
# macos-13, which is the last intel runner and is handed out sparingly.
# `publish` waited on the whole matrix, so nothing at all was published: a
# release that exists nowhere because one machine somewhere is busy.
#
# The matrix below is what this project can promise: those runners answer.
# Intel macOS is built beside it, in a job that may take as long as it takes
# and blocks nothing; if it lands before the publish, its files travel with
# the rest, and if it does not, the release says so rather than pretending
# the platform was forgotten. Anybody on that machine builds in a minute
# with bin/build-cli.sh, which is the same binary from the same text.
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            said: macos-arm64
          - runner: ubuntu-latest
            said: linux-x86_64
          - runner: ubuntu-24.04-arm
            said: linux-arm64
          - runner: windows-latest
            said: windows-x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4
      # windows carries no toolchain of its own; every other runner does, and
      # the guard says so loudly rather than building with whatever is there
      - if: runner.os == 'Windows'
        uses: compnerd/gha-setup-swift@eeda069c5bc95ac8a9ac5cea7d4f588ae5420ca5   # v0.4.0
        with:
          branch: swift-6.1.2-release
          tag: 6.1.2-RELEASE
      - shell: bash
        run: |
          command -v swiftc || { echo "no swift toolchain on ${{ matrix.runner }}: a shipped binary is built here or nowhere"; exit 1; }
          swiftc --version
      - name: build the vein at the judge's pin
        shell: bash
        run: bin/build-cli.sh
      # the binary answers for what it carries before it is allowed to leave this
      # job: `--carries` is the ledger of every verb this tool answers, and a
      # build that produced something unaskable is not a release, it is a file
      - name: it answers what it carries
        shell: bash
        run: |
          BIN=bin/gate-cli
          [ "${{ runner.os }}" = "Windows" ] && BIN=bin/gate-cli.exe
          CARRIED=$($BIN --carries | tr -d '\r' | wc -l | tr -d ' ')
          [ "$CARRIED" = "30" ] || { echo "this binary carries $CARRIED veins, and the ledger says 30"; exit 1; }
      - name: name what lies there
        shell: bash
        run: |
          mkdir -p out
          BIN=bin/gate-cli
          [ "${{ runner.os }}" = "Windows" ] && BIN=bin/gate-cli.exe
          NAME=gate-${{ matrix.said }}
          [ "${{ runner.os }}" = "Windows" ] && NAME=$NAME.exe
          cp "$BIN" "out/$NAME"
          cp bin/gate-judge.from "out/$NAME.from"
          # one sha256 spelling on three platforms, and the file it names is
          # written beside it rather than in a log nobody keeps
          if command -v sha256sum >/dev/null; then
            (cd out && sha256sum "$NAME" > "$NAME.sha256")
          else
            (cd out && shasum -a 256 "$NAME" > "$NAME.sha256")
          fi
          cat "out/$NAME.sha256"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a   # v7.0.1
        with:
          name: gate-${{ matrix.said }}
          path: out/*
          if-no-files-found: error

  # the platform that is handed out sparingly: it waits as long as it waits,
  # and `publish` does not wait with it. Its artifact travels if it is there
  # by then, and the release names what it carries either way.
  build-intel:
    runs-on: macos-13
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4
      - shell: bash
        run: |
          command -v swiftc || { echo "no swift toolchain on macos-13: a shipped binary is built here or nowhere"; exit 1; }
          swiftc --version
      - name: build the vein at the judge's pin
        shell: bash
        run: bin/build-cli.sh
      - name: it answers what it carries
        shell: bash
        run: |
          CARRIED=$(bin/gate-cli --carries | wc -l | tr -d ' ')
          [ "$CARRIED" = "30" ] || { echo "this binary carries $CARRIED veins, and the ledger says 30"; exit 1; }
      - name: name what lies there
        shell: bash
        run: |
          mkdir -p out
          NAME=gate-macos-x86_64
          cp bin/gate-cli "out/$NAME"
          cp bin/gate-judge.from "out/$NAME.from"
          (cd out && shasum -a 256 "$NAME" > "$NAME.sha256")
          cat "out/$NAME.sha256"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a   # v7.0.1
        with:
          name: gate-macos-x86_64
          path: out/*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write        # the release itself
      id-token: write        # the provenance signature
      attestations: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c   # v8.0.1
        with:
          path: out
          merge-multiple: true
      - run: ls -l out
      # the provenance: what built this, from which commit, by which workflow.
      # A reader who trusts none of it still has the rebuild; this is for the
      # one who wants the chain without running anything.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8   # v4.2.2
        with:
          subject-path: out/gate-*
      - uses: softprops/action-gh-release@fe965f7af51af5f2602596916f38a38df2e33de0   # v3.0.2
        with:
          files: out/*
          fail_on_unmatched_files: true
          body: |
            Binaries built by this workflow, in public, from the text at this
            tag. Beside each one: `.from`, the corpus revision its court was
            compiled from, and a `sha256`. What is attached is what built in
            time: linux (x86_64, arm64), macOS on Apple silicon, and Windows
            are built on every release; macOS on Intel is built beside them on
            a runner that is handed out sparingly, and is here only if it
            landed before this was published. On any machine with swiftc,
            `bin/build-cli.sh` builds the same binary from the same text in
            about a minute.

            The hash says what lies here. The check is the rebuild:

                git clone https://github.com/DanielSwift1992/gate && cd gate
                bin/build-cli.sh          # needs swiftc, builds the same court at the same pin
                python3 tests/smoke.py    # the battery this repository holds itself to

            Nothing here installs anything, and nothing here reaches the
            network at run time.
