# ── THE ONLY PLACE A SHIPPED BINARY IS BORN. Every executable line in this
# repository stays text, and that rule outlived the carrier it was written for:
# a binary is never committed, it is built. So the ones people download are
# built here, in public, from the public text at a pin, and never on anybody's
# machine.
#
# Beside each binary go the two things that make it checkable: `.from`, the
# revision of the theory corpus its court was compiled from, and a sha256, which
# says WHAT lies there. The check is not the hash: linkers are not byte-stable,
# so the honest check is a rebuild, and the README says that command. The hash
# names the artifact; the rebuild judges it.
name: release
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

# ── AND ONE SCARCE MACHINE DOES NOT HOLD A RELEASE. The first run of this
# road built four platforms in minutes and then sat two hours on a queued
# macos-13, the last intel runner and one handed out sparingly. `publish`
# waited on the whole matrix, so nothing at all was published: a release
# that exists nowhere because one machine somewhere is busy.
#
# The first cure kept that platform in a job that blocked nothing, and it
# was half a cure: `publish` runs the moment the four are done, so the intel
# artifact had no way into the release it was building for. It sat in the
# queue for hours producing a file nobody would ever receive, and the
# release body said "here only if it landed in time", which reads as a
# possibility and was never one.
#
# So the matrix is exactly what this project ships, and Intel macOS is not
# shipped: it is BUILT, by whoever is on that machine, in about a minute,
# from this same text. That is said plainly in the body below rather than
# dressed as an attachment that might appear.
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            said: macos-arm64
          - runner: ubuntu-latest
            said: linux-x86_64
          - runner: ubuntu-24.04-arm
            said: linux-arm64
          - runner: windows-latest
            said: windows-x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4
      # windows carries no toolchain of its own; every other runner does, and
      # the guard says so loudly rather than building with whatever is there
      - if: runner.os == 'Windows'
        uses: compnerd/gha-setup-swift@eeda069c5bc95ac8a9ac5cea7d4f588ae5420ca5   # v0.4.0
        with:
          branch: swift-6.1.2-release
          tag: 6.1.2-RELEASE
      - shell: bash
        run: |
          command -v swiftc || { echo "no swift toolchain on ${{ matrix.runner }}: a shipped binary is built here or nowhere"; exit 1; }
          swiftc --version
      - name: build the vein at the judge's pin
        shell: bash
        run: bin/build-cli.sh
      # the binary answers for what it carries before it is allowed to leave this
      # job: `--carries` is the ledger of every verb this tool answers, and a
      # build that produced something unaskable is not a release, it is a file
      - name: it answers what it carries
        shell: bash
        # held name for name to stdlib/verbs.swift, the record that owns the
        # roster: a count identifies nothing, and a swapped verb keeps a count
        run: |
          BIN=bin/gate-cli
          [ "${{ runner.os }}" = "Windows" ] && BIN=bin/gate-cli.exe
          sed -n 's/.*typeName: String { "\([^"]*\)".*/\1/p' stdlib/verbs.swift | grep -v -x -e v -e version | sort > roster.txt
          [ -s roster.txt ] || { echo "the roster read from stdlib/verbs.swift is empty: the reader lost its subject"; exit 1; }
          $BIN --carries | tr -d '\r' | sort > carried.txt
          diff roster.txt carried.txt || { echo "the ledger this binary prints is not the roster stdlib/verbs.swift declares"; exit 1; }
      - name: the tag being released is the default the action installs
        shell: bash
        # action.yml names the release its one-liner installs. A tag that leaves
        # that default behind ships a cover installing last season's judge, so
        # the release refuses here instead
        run: |
          DEFAULT=$(sed -n "s/.*default: '\(v[0-9.]*\)'.*/\1/p" action.yml)
          [ -n "$DEFAULT" ] || { echo "action.yml declares no default version: the reader lost its subject"; exit 1; }
          [ "${GITHUB_REF_NAME}" = "$DEFAULT" ] || { echo "this release is ${GITHUB_REF_NAME}, and action.yml still defaults to ${DEFAULT}"; exit 1; }
      - name: name what lies there
        shell: bash
        run: |
          mkdir -p out
          BIN=bin/gate-cli
          [ "${{ runner.os }}" = "Windows" ] && BIN=bin/gate-cli.exe
          NAME=gate-${{ matrix.said }}
          [ "${{ runner.os }}" = "Windows" ] && NAME=$NAME.exe
          cp "$BIN" "out/$NAME"
          cp bin/gate-judge.from "out/$NAME.from"
          # one sha256 spelling on three platforms, and the file it names is
          # written beside it rather than in a log nobody keeps
          if command -v sha256sum >/dev/null; then
            (cd out && sha256sum "$NAME" > "$NAME.sha256")
          else
            (cd out && shasum -a 256 "$NAME" > "$NAME.sha256")
          fi
          cat "out/$NAME.sha256"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a   # v7.0.1
        with:
          name: gate-${{ matrix.said }}
          path: out/*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write        # the release itself
      id-token: write        # the provenance signature
      attestations: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c   # v8.0.1
        with:
          path: out
          merge-multiple: true
      - run: ls -l out
      # the provenance: what built this, from which commit, by which workflow.
      # A reader who trusts none of it still has the rebuild; this is for the
      # one who wants the chain without running anything.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8   # v4.2.2
        with:
          subject-path: out/gate-*
      - uses: softprops/action-gh-release@fe965f7af51af5f2602596916f38a38df2e33de0   # v3.0.2
        with:
          files: out/*
          fail_on_unmatched_files: true
          # ── AND THE PAGE A DOWNLOADER LANDS ON LEADS WITH THE DOOR, NOT THE
          # FOUNDRY. The first spelling of this body opened with how the
          # binaries were built and never said what the tool does or how to
          # take it in one step: provenance prose where a reader wanted a
          # handle. The order now: what it is, the one-step door, the
          # binaries, the rebuild. The battery holds the load-bearing words.
          body: |
            gate checks facts a repository declares about itself (CODEOWNERS
            rules, workflow `paths:` filters, its own declared worlds)
            against the files that actually exist: a rule pointing at a
            deleted or renamed path fails with the exact file and line.

            ## one step, nothing installed

                - uses: DanielSwift1992/gate@${{ github.ref_name }}

            That step takes the binary below for its runner, checks the bytes
            against the `sha256` published beside them, and checks the
            repository it runs in. A clean tree passes quietly; a stale rule
            fails at its file:line, echoed as an annotation on the pull
            request.

            ## the binaries

            linux x86_64 · linux arm64 · macos arm64 · windows x86_64, each
            built by this workflow, in public, from the text at this tag.
            Beside each one: `.from`, the corpus revision its court was
            compiled from, and its `sha256`.

            macOS on Intel is not attached: that runner is handed out
            sparingly, and a release does not wait on it. On that machine, or
            any machine with swiftc, `bin/build-cli.sh` builds the same
            binary from this same text in about a minute.

            ## the hash names it, the rebuild checks it

            The hash says what lies here. The check is the rebuild:

                git clone https://github.com/DanielSwift1992/gate && cd gate
                bin/build-cli.sh          # needs swiftc, builds the same court at the same pin
                python3 tests/smoke.py    # the battery this repository holds itself to

            Nothing here installs anything, and nothing here reaches the
            network at run time.
