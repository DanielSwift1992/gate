# ── THE OFFER EQUALS THE LAW. This file is a claim about what a stranger's
# CI will do, and every load-bearing word in it is held at home: the pinned
# tag below is the vein's own VERSION, the script it names is run by the
# battery on three vectors, and the download road is walked by the `action`
# job on every push. The words a marketplace shows are these.
name: 'Stale CODEOWNERS and workflow paths check'
description: 'Finds CODEOWNERS rules and workflow path filters that point to files that no longer exist. Fails at the exact file and line.'
branding:
  icon: 'check-square'
  color: 'gray-dark'
inputs:
  version:
    description: 'gate release to take the binary from'
    required: false
    default: 'v0.2.2'
  tree:
    description: 'directory to check (default: repository root)'
    required: false
    default: '.'
runs:
  using: 'composite'
  steps:
    - name: check CODEOWNERS and workflow path filters
      shell: bash
      run: bash "${{ github.action_path }}/bin/gate-audit.sh" "${{ inputs.version }}" "${{ inputs.tree }}"
