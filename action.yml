# ── THE OFFER EQUALS THE LAW. This file is a claim about what a stranger's
# CI will do, and every load-bearing word in it is held at home: the pinned
# tag below is the vein's own VERSION, the script it names is run by the
# battery on three vectors, and the download road is walked by the `action`
# job on every push. The words a marketplace shows are these.
name: 'gate ownership audit'
description: 'Judge CODEOWNERS rows and workflow path filters against the tree: a row naming nothing is refused at its file:line.'
branding:
  icon: 'check-square'
  color: 'gray-dark'
inputs:
  version:
    description: 'gate release tag whose binary judges'
    required: false
    default: 'v0.2.2'
  tree:
    description: 'the directory judged'
    required: false
    default: '.'
runs:
  using: 'composite'
  steps:
    - name: judge the declared
      shell: bash
      run: bash "${{ github.action_path }}/bin/gate-audit.sh" "${{ inputs.version }}" "${{ inputs.tree }}"
